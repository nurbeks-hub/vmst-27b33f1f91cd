ru": "Уличное интервью с микрофоном", "summary_ru": "Ведущая с ручным микрофоном останавливает прохожего, он шутит про лодку, оба смеются, он уходит из кадра. Ждём правильного говорящего на каждой реплике, микрофон у того, кто говорит, и живую улицу.", "checks": [{"name_ru": "Кто говорит", "detail_ru": "Каждую реплику произносит нужный человек, липсинк совпадает, голоса разные."}, {"name_ru": "Микрофон", "detail_ru": "Микрофон в руке ведущей всё время, направлен на того, кто говорит; одна рука, пять пальцев."}, {"name_ru": "Тайминг шутки", "detail_ru": "Пауза перед панчлайном и реакция смехом после него; реплики дословно."}, {"name_ru": "Порядок кадров", "detail_ru": "Четыре кадра в заданном порядке; одежда и лица не меняются между склейками."}, {"name_ru": "Уход вправо", "detail_ru": "Прохожий касается микрофона и уходит из кадра вправо, не исчезает и не телепортируется."}, {"name_ru": "Живой фон", "detail_ru": "Прохожие сзади идут естественно, не клонируются и не сливаются; вывески без читаемого текста."}, {"name_ru": "Звук улицы", "detail_ru": "Ветер в микрофоне, трафик, шаги; без музыки."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nVertical street-interview video shot on a handheld phone by a camera operator, sunny afternoon on a sidewalk in a fictional mid-size American downtown: plain brick storefronts with blank awnings, parked cars, people walking past in the background. Two people on camera. The interviewer: a woman about 28, short copper-red hair, a faded denim jacket, holding a small black handheld microphone with a red foam windscreen in her right hand. The passer-by: a friendly man about 60, grey beard, a faded green baseball cap with no logo, a plain tan work jacket.\n\n[Plot Summary]\nShot 1, 00:00-00:03: Medium two-shot, the camera walking backward. She steps into his path, smiling, and holds the microphone toward her own mouth: \"What's the worst advice you ever got?\" (in English) She then points the microphone at him.\nShot 2, 00:03-00:09: Tighter on him, the microphone in the lower left of frame pointed at his mouth. He thinks for a beat, then: \"Buy a boat.\" He pauses, nods slowly, and adds: \"Best two days of my life: the day I bought it and the day I sold it.\" (in English)\nShot 3, 00:09-00:12: Medium two-shot. She bursts out laughing, turns the microphone back to herself and asks: \"So... good advice?\" (in English), then points it at him again.\nShot 4, 00:12-00:15: He leans to the microphone: \"Terrible advice. Great days.\" (in English) He taps the top of the microphone twice with two fingers and walks out of frame to the right, still chuckling; she turns to the camera, laughing, shaking her head.\n\n[Audio Style]\nNatural street sound recorded through the phone and the handheld microphone: both voices close and clear, each a distinct voice with matching lip sync, light wind bumping the windscreen, passing traffic, footsteps and distant chatter, two dull thumps when he taps the microphone, their real laughter. No music.\n\n[Camera Work and Core Constraints]\nHandheld phone camera at chest-to-eye height, small natural sway, quick reframes toward whoever speaks; four shots with clear changes of scale between them. The microphone stays in her right hand the whole time and always points at the person speaking. Both faces sit inside the central safe area of the vertical frame. He exits on the right side of frame and keeps walking right. Background pedestrians move naturally at their own pace. Real faces with pores and wrinkles, harsh-but-pleasant afternoon sun with real shadows, phone capture look.\n\n[Negative Prompt]\nsubtitles, captions, on-screen text, watermark, music, logos", "inputs_expanded": []}, {"id": "05", "tier": "core", "direction": "Ads", "contrast": "premium · slow", "task_mode": "R2V", "aspect_ratio": "16:9", "duration": "15s", "title_ru": "Премиальный ролик духов VESPER", "summary_ru": "Медленный премиальный спот духов VESPER в пяти сценах: капля, проезд по флакону, крышка, нанесение на кожу, пэкшот. Ждём флакон точно как на референсе, надпись VESPER без ошибок и держащийся пэкшот.", "checks": [{"name_ru": "Флакон как на референсе", "detail_ru": "Огранка, дымчато-янтарная жидкость и латунная крышка совпадают с @Image1 во всех сценах."}, {"name_ru": "Надпись VESPER", "detail_ru": "VESPER читается без ошибок, не зеркалится и не плывёт ни в одном кадре."}, {"name_ru": "Жидкость и свет", "detail_ru": "Капля даёт корону и кольца; каустика от граней движется вместе с камерой."}, {"name_ru": "Крышка и рука", "detail_ru": "Крышка поднимается целой, под ней распылитель; на руке пять пальцев."}, {"name_ru": "Распыление", "detail_ru": "Тонкий туман из распылителя оседает на коже, кожа с порами, без воска."}, {"name_ru": "Пять сцен, медленно", "detail_ru": "Ровно пять сцен в заданном порядке, плавный премиальный темп без суеты."}, {"name_ru": "Пэкшот и звук", "detail_ru": "Последние 2 с флакон неподвижен в правой трети, VESPER чётко; шёпот и звуки в синхроне."}], "inputs": ["A_PERFUME"], "reference_mapping": "@Image1 = A_PERFUME: the VESPER flacon — shape, faceted glass, smoky amber liquid, brushed brass cap and the etched VESPER wordmark. Product only.", "prompt": "[Core Task]\n[Reference Mapping] @Image1 is the product — the VESPER perfume flacon. It defines the bottle's shape, the faceted heavy glass, the smoky amber liquid, the brushed brass cap and the wordmark VESPER etched on the glass. Reproduce it exactly in every shot.\nA premium, slow cinematic perfume commercial for VESPER in five shots, built around one moment: a woman wearing the scent at night. Warm, dark and elegant. The product sits on a slab of dark wet slate in a black space lit by one warm side light. The woman is about 35, ordinary refined face, dark hair pinned up, a black silk blouse; only her hand, neck and profile are seen.\n\n[Plot Summary]\nShot 1, 00:00-00:03: Extreme macro, locked off. A single drop of smoky amber liquid falls in slow motion onto the black slate, forms a small crown and spreads into fine rings, warm rim light catching its edge.\nShot 2, 00:03-00:06: Slow lateral dolly from left to right across the flacon standing on the wet slate, medium close. Amber caustic light thrown by the glass facets slides across the slate as the camera passes; the etched VESPER wordmark catches the light and reads cleanly.\nShot 3, 00:06-00:09: Close-up from a low angle. Her hand in the black silk sleeve enters from the right and lifts the brushed brass cap straight up; the cap rises whole with a soft magnetic click, revealing the spray nozzle, light raking across the brass.\nShot 4, 00:09-00:12: Close-up of her neck and collarbone in profile, warm side light, the flacon held just out of focus in the foreground. She sprays once; a fine translucent mist catches the backlight and settles on her skin. She turns her head slightly toward the light, eyes closed.\nShot 5, 00:12-00:15: Packshot. The flacon stands capped again on the slate in the right third of frame, dark open space on the left. A very slow push-in settles by 00:13 and the frame holds still; a soft band of light sweeps once across the facets and the brass cap. VESPER is crisp, correctly spelled and centred on the glass. A woman's calm whisper: \"Vesper.\" (in English)\n\n[Audio Style]\nSound design only, intimate and close: deep room silence, a magnified liquid drip on the drop, a soft glassy hum as the dolly passes, a clean magnetic click as the cap lifts, a short fine spray hiss, a breath, then the whispered \"Vesper.\" over the packshot and a low soft resonant tone under the final hold. No music.\n\n[Camera Work and Core Constraints]\nFive shots, each with a new scale, angle or move: locked macro, lateral dolly, low close-up, profile close-up, packshot push. Slow, deliberate premium pacing; every move settles before the cut. The flacon keeps identical shape, facets, liquid colour, cap and wordmark in every shot, and the wordmark always reads VESPER the right way round. Large-format cinema camera look, warm amber and black palette, crisp contrast, one motivated warm key with no visible lamps, matte skin with natural texture and pores, real photographic live action, people kept off-centre.\n\n[Negative Prompt]\nsubtitles, on-screen text other than the etched VESPER, watermark, music, other logos", "inputs_expanded": ["A_PERFUME"]}, {"id": "06", "tier": "core", "direction": "Hyper-motion", "contrast": "fast · rhythmic", "task_mode": "R2V", "aspect_ratio": "9:16", "duration": "10s", "title_ru": "Банка KUMO: взрыв и сборка", "summary_ru": "Хайпер-моушн: банка KUMO разлетается на части с шаром газировки, части облетают камеру и собираются обратно, финальное приземление со всплеском; склейка каждые ~1,5 с. Ждём точную банку и надпись, честную жидкость и ритм.", "checks": [{"name_ru": "Банка как на референсе", "detail_ru": "Матовый бледно-зелёный алюминий и надпись KUMO как на @Image1, в начале и после сборки."}, {"name_ru": "Надпись KUMO", "detail_ru": "KUMO читается без ошибок на банке и на развёрнутом листе, не зеркалится."}, {"name_ru": "Части целы", "detail_ru": "Ровно шесть кусков: крышка с язычком, стенка, дно, шар газировки, две половинки юдзу; при сборке половинки юдзу смыкаются в целый плод; без лишних и пропавших."}, {"name_ru": "Жидкость", "detail_ru": "Газировка прозрачная с пузырьками, держит объём, при приземлении даёт корону брызг."}, {"name_ru": "Ритм склеек", "detail_ru": "Новый ракурс примерно каждые 1,5 с, 7 кадров, склейки на акцентах."}, {"name_ru": "Камера с инерцией", "detail_ru": "Быстрые движения с разгоном и торможением и моушн-блюром, без дрожи."}, {"name_ru": "Звук в синхроне", "detail_ru": "Хлопок с шипением на взрыве, щелчки на сборке, щелчок язычка, всплеск; без музыки."}], "inputs": ["A_CAN"], "reference_mapping": "@Image1 = A_CAN: the KUMO yuzu-soda can — shape, matte pale-green aluminium, wordmark and condensation. Product only.", "prompt": "[Core Task]\n[Reference Mapping] @Image1 is the product — the KUMO yuzu soda can. It defines the can's shape, the matte pale-green aluminium, the KUMO wordmark and the condensation drops. Reproduce it exactly whenever the can is whole.\nHyper-motion product film, photoreal premium studio commercial, vertical. The can explodes into its parts, the parts fly around the camera, then reassemble and land with a splash. Warm sand-coloured seamless studio, one hard key light from upper left carving crisp highlights, a thin cool rim light from behind. The burst produces exactly six pieces: the lid with its pull tab, the cylindrical wall, the domed base, a floating globe of translucent pale-yellow soda full of bubbles, and two halves of a fresh yuzu. Hard cut to a new angle roughly every 1.5 seconds, each cut on an accent.\n\n[Plot Summary]\nShot 1, 00:00-00:01.5: Low three-quarter angle, the whole cold can hangs in the air on the right third of frame, condensation beading. In the first instant it bursts apart in a clean controlled explosion: lid, wall, base and the soda globe fly outward, two yuzu halves spinning out of the centre.\nShot 2, 00:01.5-00:03: Hard cut, close side angle. The can wall unrolls into a flat curved sheet that glides past the lens, the KUMO wordmark sweeping across frame, reading correctly.\nShot 3, 00:03-00:04.5: Hard cut, the camera flies forward through the gap between the lid and the base, both sliding past on either side of the lens, the pull tab glinting.\nShot 4, 00:04.5-00:06: Hard cut, extreme macro on the soda globe turning in the light: translucent pale-yellow liquid, rising bubbles, a yuzu half drifting behind it out of focus.\nShot 5, 00:06-00:07.5: Hard cut, top-down wide. All six pieces reverse and rush back toward the centre; the wall rolls itself back into a cylinder around the soda globe, and the two yuzu halves press together into one whole yuzu.\nShot 6, 00:07.5-00:09: Hard cut, three-quarter front. Base and lid lock onto the wall with crisp mechanical snaps, the pull tab clicks flat; the rebuilt can is identical to the start, KUMO facing the lens.\nShot 7, 00:09-00:10: Hard cut, side angle at floor height. The can drops onto a shallow pool of pale-yellow soda on the studio floor at the left third of frame, landing upright with a crown of splash and droplets; the whole yuzu drops beside it a beat later and rolls to a stop; hold.\n\n[Audio Style]\nNo music. A deep whoosh and a sharp aluminium pop with fizzing hiss on the explosion, airy whooshes as parts pass the lens, a soft bubbling under the macro, a rushing pull on the reverse, crisp metallic snaps and a tab click on reassembly, a heavy wet slap and splash on landing, a soft thud as the yuzu lands, then quiet studio room tone.\n\n[Camera Work and Core Constraints]\nMotion-control camera rig with real inertia: fast moves that accelerate and brake along one smooth arc, natural motion blur on the fastest frames, steady with no jitter. Seven shots, each a clearly new angle. Compositions off-centre in the vertical frame, the product weighted to one third with open space on the other side. Exactly six pieces while apart, each intact and sharp; the liquid stays translucent with visible bubbles and keeps its volume. Lacquered highlights sliding across aluminium, real condensation, physically plausible splash.\n\n[Negative Prompt]\nsubtitles, on-screen text other than KUMO, watermark, music, other logos", "inputs_expanded": ["A_CAN"]}, {"id": "07", "tier": "core", "direction": "Genjutsu (V2V)", "contrast": "realism · micro-cut montage", "task_mode": "V2V", "aspect_ratio": "16:9", "duration": "15s", "title_ru": "Заправка: замена водителя", "summary_ru": "Ночной монтаж на заправке из ~15 жёстких склеек: водитель в чёрном худи заменяется на нашего героя в белом льняном халате и сандалиях. Ждём героя в каждом кадре, включая вставки рук и ноги, и все склейки на тех же кадрах.", "checks": [{"name_ru": "Герой везде", "detail_ru": "В каждом кадре с водителем — герой с листа: стрижка «под горшок», подкова усов, белый льняной халат."}, {"name_ru": "Вставки рук и ноги", "detail_ru": "На пистолете и рычаге — его руки с льняным рукавом; на педали — нога в сандалии с голыми пальцами."}, {"name_ru": "Склейки на месте", "detail_ru": "Число склеек как в исходнике, каждая на том же кадре ±2; ни один шот не добавлен, не выпал и не переставлен."}, {"name_ru": "Движение и камера", "detail_ru": "Позы, жесты, траектории и тряска камеры совпадают с исходником покадрово."}, {"name_ru": "Реквизит цел", "detail_ru": "Заправочный пистолет со шлангом, руль, рычаг КПП, оранжевая машина — той же формы, без логотипов."}, {"name_ru": "Нет утечки худи", "detail_ru": "Ни капюшона, ни чёрной ткани, ни кроссовок; руки и лицо не остаются от исходного водителя."}, {"name_ru": "Свет и мир", "detail_ru": "Ночная заправка, свет навеса и отражения на машине как в исходнике."}, {"name_ru": "Звук и длина", "detail_ru": "Звук исходника на месте и в синхроне; длина 15 с."}], "inputs": ["V_GASSTATION", "A_HERO_SHEET"], "reference_mapping": "@Video1 = V_GASSTATION: the source edit — performance, blocking, camera, framing, cuts, timing, location, car and sound. @Image1 = A_HERO_SHEET: the complete identity of the driver (face, hair, mustache, robe, sandals).", "prompt": "[Core Task]\nEdit @Video1.\n[Reference Mapping] @Video1 is the source film: it controls the performance, blocking, camera, framing, every cut, the timing, the night gas-station location, the orange car and the sound. @Image1 is the character sheet: it supplies the complete identity of the driver — face, bowl haircut, horseshoe mustache, white linen robe and sandals — seen front, back and close.\nReplace the driver in the black hoodie with the man from @Image1 in every shot where any part of the driver appears. Everything else in @Video1 stays as recorded.\n\n[Plot Summary]\n00:00-00:15: The cut structure is identical to @Video1 — the same number of shots (a fast montage of roughly 12 to 15 hard cuts) in the same order, and every cut of @Video1 stays on the same frame. Each shot keeps its own framing, lens, camera move and the exact motion of the driver.\nDetail ledger, wherever these appear in @Video1:\n- Wide and medium shots at the pump: the man from @Image1 stands where the driver stood, in the white linen robe and sandals, with his bowl haircut and horseshoe mustache.\n- Insert of the hand on the fuel nozzle: his hand, with the loose white linen sleeve at the wrist, grips the same fuel nozzle and hose.\n- Insert of the foot on the pedal: his bare foot in a leather sandal, toes visible, presses the same pedal.\n- Insert of the hand on the gear shift: his hand and linen sleeve on the same gear-shift knob.\n- Face in the car: his face from @Image1 behind the same steering wheel, lit by the same dashboard and canopy light.\n- The car drives off: the same low unbadged orange sports car, same shape and colour.\n\n[Audio Style]\nThe soundtrack of @Video1 passes through unchanged and in sync: engine, fuel-pump click, door, tyres and night ambience exactly as recorded.\n\n[Camera Work and Core Constraints]\n@Video1 controls performance, blocking, camera, framing, cuts and timing; reproduce them exactly, without re-timing, re-staging, re-posing or smoothing anything. Body anatomy follows @Image1: the hero's build, his hands with five fingers and the linen sleeve at each wrist, his feet in sandals. Action-critical props survive in every shot with the same shape and position, plain and unbranded: the fuel nozzle and hose, the pump, the steering wheel, the gear-shift knob and pedals, the orange car. The night lighting, the canopy lights and the reflections on the car stay as in @Video1. Photoreal skin with pores, the same realistic camera texture and grain as @Video1.\n\n[Negative Prompt]\nsubtitles, on-screen text, watermark, music, logos, black hoodie", "inputs_expanded": ["V_GASSTATION", "A_HERO_SHEET"]}, {"id": "08", "tier": "core", "direction": "Genjutsu (V2V)", "contrast": "one take · total restyle", "task_mode": "V2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Танцовщица → рыцарь в соборе", "summary_ru": "Один непрерывный дубль: танцовщица в белой студии превращается в рыцаря в латах, студия — в туманный разрушенный собор. Ждём хореографию кадр в кадр, жёсткие латы без пластилина и полностью новый мир.", "checks": [{"name_ru": "Хореография 1:1", "detail_ru": "Повороты, падение на пол и прыжок совпадают с исходником по позам и времени."}, {"name_ru": "Один дубль", "detail_ru": "Без склеек; камера стоит с тем же медленным наездом."}, {"name_ru": "Латы жёсткие", "detail_ru": "Пластины не гнутся как ткань, скользят на суставах, руки и ноги не проходят сквозь броню."}, {"name_ru": "Рыцарь как на листе", "detail_ru": "Матовая сталь, красный плюмаж, закрытое забрало и тёмно-синяя табарда весь ролик."}, {"name_ru": "Плюмаж и табарда", "detail_ru": "Плюмаж и табарда догоняют движение с инерцией после поворота и прыжка."}, {"name_ru": "Собор с референса", "detail_ru": "Неф как на @Image2: без крыши, туман, утренний свет, лужи; лужи брызгают при падении и приземлении."}, {"name_ru": "Нет утечки исходника", "detail_ru": "Ни белых стен студии, ни чёрной одежды, ни открытого лица танцовщицы."}, {"name_ru": "Звук", "detail_ru": "Лязг на шагах и приземлениях, скрежет пластин на поворотах, всплеск, эхо собора; без музыки."}], "inputs": ["V_DANCER", "A_KNIGHT_SHEET", "A_CATHEDRAL"], "reference_mapping": "@Video1 = V_DANCER: choreography, timing, blocking, camera and framing. @Image1 = A_KNIGHT_SHEET: the complete knight (armour, plume, closed visor, tabard). @Image2 = A_CATHEDRAL: the complete location and light.", "prompt": "[Core Task]\nEdit @Video1.\n[Reference Mapping] @Video1 is the source take: it controls the performance, choreography, blocking, camera, framing and timing. @Image1 is the character sheet: it supplies the complete knight — matte steel plate armour, red horsehair plume, closed visor, plain dark-blue tabard — seen front, back and close. @Image2 is the location: it supplies the complete world — a roofless ruined gothic cathedral nave in morning mist with puddles on the stone floor — and its light.\nReplace the dancer with the knight from @Image1 and the white studio with the cathedral from @Image2. Nothing from the studio or the dancer's look remains.\n\n[Plot Summary]\n00:00-00:10: One continuous take with no cuts, identical in timing to @Video1. The knight performs the dancer's routine move for move — the turns, the drop to the floor and the jump — on the same frames, in the same place in frame. The knight's visor stays closed throughout. The cathedral floor reacts to the action: water in the puddles splashes where the knight drops to the floor and where the jump lands; the morning mist swirls around the body after the turns.\n\n[Audio Style]\nNew native sound for the new world, synced to the motion of @Video1: a metallic clank on every step and landing, steel plates scraping on each turn, a heavy armoured thud and a splash on the floor drop and the jump landing, the soft whip of the tabard, the vast stone reverb of the cathedral, faint wind and distant birds through the open roof. No music.\n\n[Camera Work and Core Constraints]\n@Video1 controls performance, blocking, camera, framing and timing; keep the locked-off wide framing and its slow push exactly, and reproduce every pose without re-timing, re-staging or smoothing. The knight's weight shows only through sound, splashes and the follow-through of the plume and tabard, never through changed timing. Anatomy follows @Image1: a full suit of rigid plate that slides at the joints and never bends like cloth; limbs stay inside the armour with no clipping. The red plume and the tabard swing with inertia and settle after each move. The cathedral of @Image2 keeps its architecture, mist and soft morning light from one direction for the whole take. Photoreal metal with real reflections of the morning sky, real stone and water.\n\n[Negative Prompt]\nsubtitles, on-screen text, watermark, music, cuts", "inputs_expanded": ["V_DANCER", "A_KNIGHT_SHEET", "A_CATHEDRAL"]}, {"id": "09", "tier": "core", "direction": "Action", "contrast": "close combat · one take · night", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "15s", "title_ru": "Драка за кухонный нож", "summary_ru": "Одним ручным дублем ночью две женщины борются за один кухонный нож: удар о стол, разбитая тарелка, распахнутый холодильник, нож переходит к героине. Ждём один нож, целые руки, физику и ясную географию без крови.", "checks": [{"name_ru": "Один дубль", "detail_ru": "Ни одной склейки за 15 с, камера ручная, без замедления."}, {"name_ru": "Ровно один нож", "detail_ru": "Нож всегда один и всегда в чьей-то руке; переход к героине читается."}, {"name_ru": "Руки в захвате", "detail_ru": "Пальцы и запястья целы, руки не сливаются и не проходят друг сквозь друга."}, {"name_ru": "Тарелка", "detail_ru": "Тарелка падает от удара локтем и разбивается; осколки остаются на полу."}, {"name_ru": "Свет холодильника", "detail_ru": "Узкая полоска света становится полным светом, когда дверь распахивается; других источников нет."}, {"name_ru": "Без крови, по-настоящему", "detail_ru": "Нет крови, ранений и боевых приёмов; видны усталость, вес и неуклюжесть."}, {"name_ru": "География", "detail_ru": "Шкафы слева, холодильник справа на протяжении всего дубля."}, {"name_ru": "Звук", "detail_ru": "Звон тарелки, удар двери, шорох ткани и дыхание совпадают с картинкой; без музыки."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA grounded, non-graphic thriller scene, one continuous handheld shot with no cuts. A cramped apartment kitchen at night: wall cabinets and a counter on the left of frame, a refrigerator on the right with its door slightly ajar, spilling a narrow strip of cold white light — the only light in the room. Two adult women struggle over one single kitchen knife. The protagonist: late twenties, messy brown ponytail, grey hoodie, black leggings. The intruder: a s and counter on the left, refrigerator on the right. The refrigerator is the only light source: a strip while ajar, full cold light once open. No stabbing or slashing and no injuries. Naturalistic performances, rumpled clothing, real weight and fatigue, real hands with five fingers, deep shadows, muted colours, subtle film grain.\n\n[Negative Prompt]\nsubtitles, on-screen text, watermark, music, blood", "inputs_expanded": []}, {"id": "10", "tier": "core", "direction": "Action", "contrast": "vehicle · multi-shot · day", "task_mode": "T2V", "aspect_ratio": "21:9", "duration": "15s", "title_ru": "Погоня в пустынном каньоне", "summary_ru": "Шесть кадров дневной погони по дну каньона: голубой фастбэк 70-х уходит от белого пикапа, таран, прыжок через гребень, пикап застревает. Ждём неизменные машины, направление слева направо и честную пыль и вес.", "checks": [{"name_ru": "Машины не меняются", "detail_ru": "Голубой фастбэк и белый пикап одной формы и цвета во всех кадрах, без значков и номеров."}, {"name_ru": "Направление", "detail_ru": "Обе машины едут слева направо; пикап всегда позади."}, {"name_ru": "Колёса и подвеска", "detail_ru": "Колёса вращаются со скоростью движения, подвеска проседает на ударах."}, {"name_ru": "Таран", "detail_ru": "Пикап бьёт в задний бампер, фастбэк виляет и выравнивается — причина и следствие видны."}, {"name_ru": "Прыжок", "detail_ru": "Обе машины отрываются на гребне, приземляются с весом; пикап разворачивает в его же пыли."}, {"name_ru": "Пыль и свет", "detail_ru": "Пыль тянется за машинами и сносится ветром; солнце жёсткое, тени одинаковы во всех кадрах."}, {"name_ru": "Звук", "detail_ru": "Разные моторы у двух машин, гравий, удар тарана и приземлений в синхроне; без музыки."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nLive-action car-chase sequence in six shots, one continuous scene in the middle of a hot day. A fictional desert canyon in the American Southwest: a straight dirt road along a dry riverbed between tall red sandstone walls, scattered sagebrush, a low crest where a dry wash crosses the road. Hard high sun, short sharp shadows, a light crosswind from the right. Hero car: one unbadged 1970s two-door fastback, pale sky-blue paint dulled by dust, long hood, short rear deck, four round headlights, slim chrome bumpers, no plates, no emblems or lettering. Pursuer: one boxy white 1980s pickup truck, dented, a black steel push-bar on the front, no plates, no emblems. Both vehicles travel left to right on screen for the whole sequence and the pickup is always behind the fastback.\n\n[Plot Summary]\nShot 1, 00:00-00:02: Camera locked low beside the road, wide lens. The blue fastback blasts past the lens left to right, rear tyres throwing gravel, a thick dust plume rolling across frame right and drifting with the wind.\nShot 2, 00:02-00:04: High drone wide, flying right at the cars' speed. The fastback small in the lower left third heading right along the canyon floor, the white pickup about fifty meters behind it inside its dust trail, the red walls towering on both sides.\nShot 3, 00:04-00:06.5: Inside the fastback, close on the rear-view mirror in the upper left of frame. The driver's eyes, a woman about 40 with sun lines, flick to the mirror; the pickup's push-bar grows larger in it.\nShot 4, 00:06.5-00:09: Long-lens tracking shot from a camera car alongside, both vehicles in profile. The pickup surges and its push-bar rams the fastback's rear bumper; the fastback lurches, fishtails once in a spray of dust and straightens.\nShot 5, 00:09-00:12: Wide static shot from beyond the crest, looking back. The fastback hits the crest and flies with all four wheels in the air, lands heavily, suspension compressing deep, a burst of dust. The pickup follows, lands nose-first, its front digs in and it slews sideways to a stop inside its own dust cloud.\nShot 6, 00:12-00:15: Low long lens behind and to the left of the fastback as it drives on to the right and away into the heat haze, the dust cloud around the stalled pickup filling the left of frame in the foreground. Hold.\n\n[Audio Style]\nNatural location sound only. The fastback: a deep, uneven V8 rumble rising with each gear. The pickup: a harsher, rattling engine and loose metal. Gravel pelting the underbody, wind buffeting the camera, a hard metallic crunch on the ram, a tyre scrub on the fishtail, the engine note leaping when the wheels leave the ground, heavy thuds and spring creaks on both landings, then the fastback's engine fading into wind.\n\n[Camera Work and Core Constraints]\nSix shots, each with a new scale, angle and move: locked low wide, drone, interior mirror close, long-lens tracking, wide static, low long lens. Screen direction left to right holds in every exterior shot; the pickup stays behind. The same two vehicles with identical shape, colour and damage in every shot. Wheels roll at road speed, real suspension travel and vehicle weight, dust that trails, hangs and drifts right with the wind. Hard midday light consistent across shots. 35 mm anamorphic film look, warm red rock and pale blue sky, fine grain, compositions off-centre with the vehicle on a third.\n\n[Negative Prompt]\nsubtitles, on-screen text, watermark, music, logos, licence plates", "inputs_expanded": []}, {"id": "11", "tier": "core", "direction": "Dialogue", "contrast": "speech · three people", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Диалог троих в закусочной", "summary_ru": "Четыре кадра в ночной закусочной: двое в кабинке спорят, официантка ставит ровно две чашки кофе и шутит. Ждём точные реплики нужным голосом, точную неоновую надпись и ровно две чашки.", "checks": [{"name_ru": "Реплики и липсинк", "detail_ru": "Три фразы дословно, каждую говорит нужный человек, губы в синхроне."}, {"name_ru": "Неон RUBY'S", "detail_ru": "Надпись RUBY'S — OPEN 24 HRS без ошибок, читается правильно и одинакова во всех кадрах."}, {"name_ru": "Ровно две чашки", "detail_ru": "До официантки на столе нет кофе; она ставит ровно две чашки, по одной каждому, и их остаётся две."}, {"name_ru": "Лица и одежда", "detail_ru": "Дана, Лео и Грейс не меняются между склейками."}, {"name_ru": "Оси и стороны", "detail_ru": "Дана слева, Лео справа во всех кадрах; взгляды не перескакивают."}, {"name_ru": "Порядок кадров", "detail_ru": "Четыре кадра в заданном порядке и времени."}, {"name_ru": "Звук закусочной", "detail_ru": "Гул холодильника, стук чашек о стол в момент касания; без музыки."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA dialogue scene in a late-night American diner, four shots. Dana and Leo sit facing each other in a red vinyl booth: Dana on the left of frame, Leo on the right. Dana: early 30s, curly dark hair, a mustard knit sweater. Leo: mid 30s, short beard, a faded denim jacket. Grace: about 60, grey bob, a pale-blue waitress uniform with a white apron. On the wall above the counter behind Leo, a pink neon sign reads exactly \"RUBY'S — OPEN 24 HRS\", mounted inside the room so it reads correctly. At the start the table holds only a napkin dispenser and a sugar jar, no cups.\n\n[Plot Summary]\nShot 1, 00:00-00:03: Wide master from the aisle, the neon sign readable on the back wall. Dana leans across the table and says, low and urgent: \"We can't keep running from this.\" (in English)\nShot 2, 00:03-00:05: Close-up on Leo, the neon sign soft behind his shoulder. He holds her look and answers flatly: \"Watch me.\" (in English)\nShot 3, 00:05-00:08: Medium shot at table height. Grace steps in from the right and sets down two white mugs of black coffee, one in front of Dana and one in front of Leo, and says dryly: \"Refills are free. Advice isn't.\" (in English)\nShot 4, 00:08-00:10: Close reaction shot of Dana, her mug in the soft foreground, holding back a smile as she looks down.\n\n[Audio Style]\nEach line spoken in English by its own speaker with matching lip sync and natural pauses: Dana's voice low and tense, Leo's flat and calm, Grace's dry and husky. Room sound: a quiet refrigerator hum, the faint buzz of the neon, distant cutlery from the kitchen, two ceramic knocks exactly when the mugs touch the table. No music.\n\n[Camera Work and Core Constraints]\nFour shots in the given order with changes of scale between them: wide, close, medium, close. The 180-degree line holds: Dana always on the left looking right, Leo always on the right looking left. The neon sign keeps the exact text RUBY'S — OPEN 24 HRS in every shot where it is visible. Exactly two coffee mugs appear, both placed by Grace in shot 3, and exactly two remain afterwards. Warm tungsten interior light against the cool blue night in the windows, pink neon spill on faces, 35 mm film look, ordinary natural faces with real skin texture.\n\n[Negative Prompt]\nsubtitles, on-screen text other than the neon sign, watermark, music", "inputs_expanded": []}, {"id": "12", "tier": "core", "direction": "Audio", "contrast": "music · no speech", "task_mode": "R2V", "aspect_ratio": "16:9", "duration": "15s", "title_ru": "Барабанщик и басист под трек", "summary_ru": "Барабанщик и басист играют под присланный фанк-рок трек; склейки на сильные доли, брейк около 7,5 с, финальный удар вместе. Ждём видимый синхрон ударов и баса с треком и нетронутое аудио.", "checks": [{"name_ru": "Синхрон барабанов", "detail_ru": "Удары палочек и бочки совпадают с бочкой и малым в треке."}, {"name_ru": "Синхрон баса", "detail_ru": "Пальцы басиста щиплют струны в такт басовой линии."}, {"name_ru": "Брейк на ~7,5 с", "detail_ru": "На брейке в треке барабанщик видимо проходит по томам."}, {"name_ru": "Склейки на долях", "detail_ru": "Шесть кадров, каждая склейка на сильной доле такта."}, {"name_ru": "Финальный удар", "detail_ru": "Оба бьют последний акцент вместе и замирают; тарелка ещё дрожит."}, {"name_ru": "Аудио без изменений", "detail_ru": "Трек не изменён: нет голосов, лишних звуков и сдвига."}, {"name_ru": "Руки и инструменты", "detail_ru": "Пять пальцев, две палочки, четыре струны и лады; инструменты без логотипов; те же музыканты во всех кадрах."}], "inputs": ["A_TRACK"], "reference_mapping": "@Audio1 = A_TRACK: the complete soundtrack, used unchanged; every picture event is timed to it.", "prompt": "[Core Task]\n[Reference Mapping] @Audio1 is the soundtrack: a funk-rock groove at about 100 BPM in 4/4 with a clear kick and snare, a bass line, one drum fill at about 00:07.5 and a final hit at the end. Use it unchanged as the only audio and time every picture event to it.\nA live-performance music video: a drummer and a bass player play @Audio1 in a small garage rehearsal room. Egg-crate foam on the walls, a worn rug, a single bare tungsten bulb overhead and a cool daylight window on the left. Drummer: a woman about 30, shaved head, plain olive t-shirt, a small plain drum kit with kick, snare, one rack tom, one floor tom, hi-hat, crash and ride. Bass player: a man about 40, long grey ponytail, plain black shirt, a four-string sunburst bass with no logo. The same two musicians appear in every shot.\n\n[Plot Summary]\nOne bar of @Audio1 lasts about 2.4 seconds; every cut lands on the downbeat of a bar.\nShot 1, 00:00-00:02.4: Wide from the doorway, both musicians playing; each kick-drum stroke and each snare hit lands exactly on the kick and snare of @Audio1.\nShot 2, 00:02.4-00:04.8: High close-up on the drummer's hands over the snare and hi-hat; every stick strike on the snare matches a snare hit in the track.\nShot 3, 00:04.8-00:07.2: Low close-up on the bass player's right-hand fingers plucking near the pickups and his left hand moving on the frets, every pluck in time with the bass line.\nShot 4, 00:07.2-00:09.6: Medium side angle on the drummer. On the fill at about 00:07.5 her sticks run across the rack tom and the floor tom in time with the fill, and she hits the crash on the next downbeat.\nShot 5, 00:09.6-00:12.0: Medium two-shot over the bass player's shoulder toward the drummer; they lock eyes and nod on the beat, both still playing in time.\nShot 6, 00:12.0-00:15.0: Wide low angle. The groove continues; on the final hit of @Audio1 the drummer strikes the crash and kick together while the bass player hits his last note, and both freeze on the hit and hold, the crash cymbal still shaking.\n\n[Audio Style]\n@Audio1 only, unchanged, from first frame to last. No added voices, no added sound effects, no speech.\n\n[Camera Work and Core Constraints]\nHandheld music-video camera with small breathing moves, six shots with changes of scale and angle between them, cuts only on downbeats. Every visible hit, pluck and cymbal movement is synced to @Audio1. Real hands with five fingers, exactly two drumsticks, a four-string bass with straight frets, instruments plain without logos. Warm tungsten top light mixed with cool window light, real skin with sweat and pores, fine grain.\n\n[Negative Prompt]\nsubtitles, on-screen text, watermark, speech, logos", "inputs_expanded": ["A_TRACK"]}, {"id": "13", "tier": "core", "direction": "Physics", "contrast": "objects · slow-mo · dark", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Бокал вина падает перед зеркалом", "summary_ru": "Ночная кухня, один источник света: рука задевает бокал, он падает в рапиде, вино рвётся на капли, стекло бьётся. Ждём честную гравитацию, правильный скол и зеркало, синхронное и отражённое.", "checks": [{"name_ru": "Гравитация и ровный рапид", "detail_ru": "Бокал разгоняется вниз равномерно, скорость рапида одна на весь кадр, нет рывков, зависаний и ускорений."}, {"name_ru": "Жгут вина рвётся на капли", "detail_ru": "Вино выходит одним жгутом, тянется и распадается на круглые капли; объём лужи соответствует полному бокалу, цвет вина не меняется."}, {"name_ru": "Стекло бьётся, а не плавится", "detail_ru": "При ударе бокал раскалывается на крупные и мелкие осколки с острыми краями, ножка отлетает отдельно; осколки один раз подпрыгивают и скользят, ничего не гнётся и не исчезает."}, {"name_ru": "Зеркало зеркальное и синхронное", "detail_ru": "В зеркале видна та же сцена с другой стороны (рука спереди), отражение зеркально перевёрнуто и совпадает по времени кадр в кадр; камеры в зеркале нет."}, {"name_ru": "Рука", "detail_ru": "Одна рука в сером рукаве, пять пальцев, щелчок по бокалу читается как причина падения."}, {"name_ru": "Один кадр, тёмный свет", "detail_ru": "Один непрерывный неподвижный кадр без склеек; единственный тёплый источник сбоку, блики на стекле и вине, остальное в полутьме."}, {"name_ru": "Звук в момент удара", "detail_ru": "Звон удара совпадает с кадром контакта с полом (±2 кадра), звук замедлен как рапид, музыки нет."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA high-speed slow-motion shot of a full glass of red wine falling off a kitchen island at night in front of a large wall mirror. One continuous locked-off shot, no cuts. The whole shot plays at one constant slow-motion rate, as if filmed at 240 fps, with real gravity: the glass accelerates steadily as it falls.\n\nGeography: a dark grey stone kitchen island in the foreground, a pale tile floor below it, a large frameless mirror on the wall behind the island. The camera looks at the mirror at a 30-degree angle from the right, so the mirror shows the island and the hand from the opposite side and the camera itself stays out of the reflection. Everything that happens appears in the mirror at the same moment, mirror-reversed.\n\n[Plot Summary]\nShot 1 (one continuous shot), 00:00-00:10:\n00:00-00:02 — A single hand in a grey knit sleeve, five fingers, enters from frame-left and flicks the stem of a full wine glass standing near the island edge. The glass tips past its balance point and leaves the edge. In the mirror the same hand is seen from the front, reversed.\n00:02-00:05 — The glass falls and slowly rotates; the wine leaves it as one long glossy rope that stretches, thins and breaks into round droplets under gravity, each droplet catching the lamp highlight.\n00:05-00:07 — The glass hits the pale tile floor and shatters: the bowl cracks into several large curved shards and many small sharp pieces, the stem snaps off and skids separately; the shards bounce once and slide outward. The wine lands a beat later and splashes into a short crown that collapses into a spreading puddle.\n00:07-00:10 — The last droplets land, the shards come to rest, the dark puddle widens slowly to a size that matches one full glass of wine. In the mirror the same aftermath sits reversed and in sync.\n\n[Audio Style]\nSlowed-down real sound, no music: a low dull tick as the finger hits the stem, a soft stretched whoosh during the fall, one deep stretched glass shatter exactly on the frame of impact, a wet slap of wine, small shards tinkling and sliding, then quiet night room tone with a fridge hum.\n\n[Camera Work and Core Constraints]\nLocked-off camera on a tripod at island height, 50 mm lens, the falling path placed in the left-centre third, the mirror filling the background. Lighting: night, one warm tungsten pendant lamp above and to the left as the only source; hard highlights on glass and wine, deep soft shadows elsewhere, the floor dimly lit. Crisp detail on glass edges and liquid, real high-speed cinematography look with light grain. The glass stays rigid glass until it breaks; the mirror reflection matches the real action frame for frame.\n\n[Negative Prompt]\nsubtitles, watermark, logos, music", "inputs_expanded": []}, {"id": "14", "tier": "core", "direction": "Physics", "contrast": "body · bright", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Гимнастка: двойное сальто и срыв приземления", "summary_ru": "Светлый зал: гимнастка делает двойное сальто назад, правая нога попадает на полотенце, срывается вперёд, она падает на пол и встаёт. Ждём честные два оборота в реальном времени и настоящий срыв, а не «спасённое» приземление.", "checks": [{"name_ru": "Ровно два оборота", "detail_ru": "В воздухе ровно два полных оборота назад в группировке, тело не прокручивается лишний раз и не обрывает вращение."}, {"name_ru": "Реальное время полёта", "detail_ru": "Полёт около секунды, без рапида и «зависания» в воздухе; разгон, отрыв и снижение подчиняются гравитации."}, {"name_ru": "Срыв случился", "detail_ru": "Приземление НЕ чистое: правая стопа попадает на полотенце, полотенце едет вперёд, нога уезжает, гимнастка садится на пол и опирается руками. Если она устояла — FAIL."}, {"name_ru": "Причина видна", "detail_ru": "Полотенце лежит на ковре с первого кадра, сдвигается от удара стопы и остаётся смятым на новом месте в следующих планах."}, {"name_ru": "Тело цело", "detail_ru": "Две руки, две ноги, пять пальцев; в группировке конечности не сливаются, колени и локти гнутся в правильную сторону."}, {"name_ru": "Инерция и вес", "detail_ru": "Падение продолжает направление вращения (назад на таз), меловая пыль с ладоней при ударе, тело не пружинит как резиновое."}, {"name_ru": "Одна и та же гимнастка", "detail_ru": "Лицо, волосы в пучке и тёмно-синий купальник одинаковы во всех планах."}, {"name_ru": "Звук", "detail_ru": "Глухой удар о ковёр точно в кадр касания, шорох полотенца, дыхание, эхо зала; музыки нет."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second sports scene in a bright training gym, 4 shots. A female gymnast in her early 20s performs a double back tuck on the floor mat and the landing fails: her right foot lands on a towel, the towel slides, her foot shoots forward and she falls onto her seat. The whole skill plays in real time at normal speed.\n\nConstant in every shot: the gymnast has an ordinary face with freckles, dark brown hair in a tight bun, a plain dark navy sleeveless leotard with no logos, white chalk on her palms. The floor is a blue sprung competition mat with a white boundary line. A crumpled white hand towel lies flat on the mat near the far landing area from the first frame. Screen direction: she travels left to right.\n\n[Plot Summary]\nShot 1, 00:00-00:02: Wide side view, camera locked off at hip height, 35 mm. She sprints from frame-left across the mat, punches a round-off and snaps into a back handspring, the white towel visible on the mat ahead of her at frame-right.\n\nShot 2, 00:02-00:06: Wide side view from slightly further back, the camera pans right with her at her speed, 28 mm, full body always in frame. She rebounds off the mat, rises about two metres, tucks her knees to her chest and completes exactly two full backward rotations in about one second of airtime, then opens up. She comes down short: her right foot lands squarely on the towel, the towel skids forward across the mat, her right foot shoots out in front of her, her weight keeps rotating backward and she drops onto her seat with both palms slapping the mat behind her, a puff of chalk dust rising from her hands.\n\nShot 3, 00:06-00:08: Low close-up at mat level from the front, 50 mm, shallow focus. Her chalky hands spread on the blue mat, her right knee bent, the towel bunched up half a metre ahead of her foot where it slid. She breathes hard, a strand of hair loose from the bun.\n\nShot 4, 00:08-00:10: Medium shot from a slightly high angle, handheld, 40 mm. She pushes herself up to standing, shakes out her right ankle, gives a short embarrassed laugh and walks off toward frame-right.\n\n[Audio Style]\nNative gym sound, no music: bare-foot thumps on the sprung mat during the run, the springy boom of the round-off and handspring, a sharp exhale on take-off, the swish of the tuck, the hiss of the towel skidding, one heavy dull thud of her landing on the mat exactly on the frame of impact, palms slapping, hard breathing, the large echoing room tone of an empty gym, one short laugh at the end.\n\n[Camera Work and Core Constraints]\nBright daytime: large high windows flood the gym with soft white daylight from frame-left, plus even overhead light; open shadows, natural skin with pores and sweat sheen. Real sports-broadcast and documentary capture, 1/500 shutter crispness, no slow motion anywhere. Adjacent shots change both scale and angle. The body stays anatomically correct through the tuck: two arms, two legs, knees bending forward. The landing fails as written; the towel stays bunched where it slid in every later shot.\n\n[Negative Prompt]\nsubtitles, watermark, logos, music, slow motion", "inputs_expanded": []}, {"id": "15", "tier": "core", "direction": "Animation", "contrast": "2D TV anime", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "15s", "title_ru": "Аниме: дуэль на крыше поезда", "summary_ru": "Две мечницы дерутся на крыше несущегося товарного поезда в каньоне, тоннель, финал с клинком у горла. Ждём настоящее рисованное ТВ-аниме: анимацию на двойках с паузами, смазы, импакт-кадр, а не гладкое 3D.", "checks": [{"name_ru": "Рисованная анимация, не 3D", "detail_ru": "Движение ступенчатое (на двойках, местами на тройках) с удержанными позами; нет плавной интерполяции и CG-объёма; линия и одна жёсткая тень."}, {"name_ru": "Смазы и импакт", "detail_ru": "Смазы только на самых быстрых взмахах; в момент встречи клинков 1–2 импакт-кадра и короткая пауза (хит-стоп), не больше 3 вспышек в секунду."}, {"name_ru": "On-model персонажи", "detail_ru": "Рен: медное каре, янтарные глаза, длинное тёмно-синее пальто; Сейбл: серебряная коса, оливковая куртка, малиновый шарф. Не меняются между планами."}, {"name_ru": "Мечи и стороны", "detail_ru": "Ровно два меча: у Рен прямой, у Сейбл изогнутый, не меняются местами; Рен слева, Сейбл справа до прыжка."}, {"name_ru": "Прыжок через сцепку", "detail_ru": "Сейбл прыгает через зазор между вагонами с видимой сцепкой и приземляется на следующую крышу; пропорции тела не ломаются."}, {"name_ru": "Тоннель: чернота и тишина", "detail_ru": "Полкадра полной черноты и полсекунды полной тишины, затем свет и звук возвращаются."}, {"name_ru": "Финал и прядь", "detail_ru": "Клинок Рен у горла Сейбл, отрезанная прядь серебряных волос падает мимо клинка и улетает с ветром."}, {"name_ru": "Звук", "detail_ru": "Стук колёс, ветер, звон и скрежет стали, удары сапог; без музыки и речи."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 15-second sword duel on the roof of a speeding freight train, made as classic Japanese TV anime: hand-drawn 2D cel animation, clean dark ink linework with slight line-weight variation, flat cel colours with exactly one hard-edged shadow tone and small sharp highlights, painted gouache backgrounds slightly less saturated than the characters. Limited animation: characters animated on twos, holds on threes for poses, clearly stepped motion between drawings; smear frames only on the fastest sword swings; one impact frame at the clash. 7 shots.\n\nSetting: a red sandstone canyon in the American Southwest at high noon, pale-blue sky, a dark locomotive pulling plain rust-red boxcars with flat roofs and no markings along a ledge cut into the canyon wall.\n\nCharacters, on-model in every shot: WREN, a young woman with a short choppy copper-red bob, amber eyes, a long dark navy high-collared coat, a straight single-edged sword. SABLE, a young woman with a long silver-white braid, grey eyes, a cropped olive jacket and a long crimson scarf, a slightly curved sword. Exactly two swords. Wren stays on frame-left, Sable on frame-right, until the leap.\n\n[Plot Summary]\nShot 1, 00:00-00:02: Extreme high wide looking down into the canyon, the train a thin dark line along the rim in the lower-left third. The camera falls in one fast rush toward the train until two small figures on a boxcar roof come into view.\n\nShot 2, 00:02-00:03.5: Extreme close-up of Wren's eye in profile at frame-right, copper strands whipping across it, cliffs streaking past behind in painted speed blur. Her pupil tightens. Held drawing, only the hair moves on twos.\n\nShot 3, 00:03.5-00:06: Medium-wide side view on the roof, horizon tilted, Wren left, Sable right. Wren lunges on a single smear frame; Sable raises her curved blade; the blades meet with one black-and-white impact frame and a short hit-stop hold with a sharp glint at the contact point. They grind in a lock, then shove apart.\n\nShot 4, 00:06-00:08: Low angle from the roof surface, Sable in the upper right against the sky; the wind tears at her, the silver braid snapping sideways and the crimson scarf cracking behind her in stepped poses. She glances back at the gap to the next car.\n\nShot 5, 00:08-00:10: Side tracking with the train, white anime speed lines in the background. Sable runs to the end of the boxcar and leaps across the coupling gap, the coupling and the blurred track visible below, full body in a clean running jump, and lands in a crouch on the next roof, one hand touching down. Wren leaps after her a beat later.\n\nShot 6, 00:10-00:11: The train plunges into a tunnel mouth in the cliff. The frame cuts to solid black and all sound drops to complete silence for half a second.\n\nShot 7, 00:11-00:15: The train bursts back into daylight, wide side view. Sable kneels on one knee near frame-left, chin raised; Wren stands over her from frame-right, arm extended, sword tip held steady at Sable's throat. One cut lock of silver hair separates from the braid, falls past the blade and the wind carries it off into the canyon. Both hold still, only hair, coat and scarf moving on twos.\n\n[Audio Style]\nNo music, no dialogue. Heavy rhythmic clatter of steel wheels, roaring wind rising with speed, cloth snapping, a bright ringing clash of steel on the impact frame and a scraping grind during the lock, boots slamming on metal roofs on the landing, the deep whoosh of the tunnel, then total silence in the black, then wind and wheels crashing back in with daylight and a soft hiss as the hair falls.\n\n[Camera Work and Core Constraints]\nAnime layout and camera language: drawn camera moves, painted background pans, speed-line backgrounds, tilted horizons only where written. Cuts land on poses. Character designs, colours and sword shapes stay identical across all shots. Flashing stays at three flashes per second or fewer. The look is a hand-drawn TV anime frame in every shot, flat colour and ink lines throughout.\n\n[Negative Prompt]\nsubtitles, watermark, logos, music, 3D CGI render", "inputs_expanded": []}, {"id": "16", "tier": "core", "direction": "Animation", "contrast": "3D feature-animation style", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "15s", "title_ru": "3D-мульт: бабушка на газонокосилке удирает от шерифа", "summary_ru": "Бабушка в бигуди на красном райдере удирает от машины помощника шерифа через пригородные дворы, прыгает с горки через машину и невозмутимо пьёт чай. Ждём цельный стиль полнометражного 3D, комедийный тайминг и непрерывность реквизита.", "checks": [{"name_ru": "Цельный 3D-мульт-стиль", "detail_ru": "Все персонажи и мир в одном стилизованном 3D-стиле, без фотореальных людей и без смены стиля между планами."}, {"name_ru": "Направление движения", "detail_ru": "Бабушка всё время едет слева направо, машина позади неё; нет перескока оси."}, {"name_ru": "Бабушка одна и та же", "detail_ru": "Розовые бигуди, цветастый оранжево-бирюзовый халат, золотые авиаторы на месте во всех планах."}, {"name_ru": "Стакан чая на месте", "detail_ru": "Пластиковый стакан холодного чая в подстаканнике виден до прыжка и остаётся там после приземления, она пьёт именно его."}, {"name_ru": "Причина и следствие", "detail_ru": "Задетый гриль подбрасывает сосиски, машина встаёт боком, косилка въезжает на горку и именно с неё взлетает."}, {"name_ru": "Рапид и возврат скорости", "detail_ru": "Рапид только в полёте над машиной, приземление в нормальной скорости с отскоком."}, {"name_ru": "Без текста и брендов", "detail_ru": "На машине только световая балка, без надписей и логотипов."}, {"name_ru": "Звук", "detail_ru": "Мотор косилки, сирена, лязг гриля, удар приземления, звон льда и хлюп трубочки; без музыки и речи."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 15-second comedy chase in stylized 3D feature-film animation: rounded expressive characters, hand-crafted textures, soft painterly summer light, 7 shots. A sunny suburban street in a small Midwestern town on a July afternoon: white clapboard houses, picket fences, deep green lawns.\n\nThe heroine, same look in every shot: a small wiry 80-year-old grandmother with pink foam curlers in silver hair, a loud orange-and-teal floral housecoat, fuzzy slippers, gold aviator sunglasses, deep wrinkles and a sharp chin, riding a red ride-on lawn mower with a plastic cup of iced tea and a straw in its cup holder. The pursuer: a young round-faced sheriff's deputy in a tan uniform shirt, driving an old boxy white sedan with plain doors, no lettering and a red-and-blue light bar on the roof. Screen direction stays constant: she flees left to right, the sedan follows behind her.\n\n[Plot Summary]\nShot 1, 00:00-00:02: Camera low on the grass, ultra-wide lens, a tall boxwood hedge filling the right two thirds of frame. The mower bursts through the hedge toward the lens, branches splitting, torn leaves tumbling past, grandmother upright and calm, aviators flashing the sun; she roars past the left edge of frame.\n\nShot 2, 00:02-00:04: Camera mounted on the mower's hood looking back at her. Her wrinkled hands with thin gold rings hold the wheel at ten and two. She glances sideways over her aviators and a slow sly grin creeps across her face. Behind her the white sedan swings around the corner, light bar flashing.\n\nShot 3, 00:04-00:06: Wide side view, the camera dollies right at the mower's speed, mower in the left third. She cuts through a backyard barbecue: the mower clips a kettle grill, the grill tips and a handful of hot dogs spring into the air in a lazy arc, a heavyset dad in an apron leaps backward holding his tongs.\n\nShot 4, 00:06-00:08: Inside the sedan, camera on the dashboard facing the deputy. He swerves ahead, slams the brakes and the car skids sideways to a stop broadside across the lawn to block her. He looks out of his side window and his face drops into pure horror, eyes wide, mouth stretched open.\n\nShot 5, 00:08-00:09.5: Wide low angle from behind the mower, the stopped sedan in the right half of frame, a child's yellow plastic slide standing right in front of it like a ramp. The mower drives straight up the slide chute, front wheels lifting, engine screaming, and launches off the top.\n\nShot 6, 00:09.5-00:12.5: Slow motion. Camera low on the grass beyond the sedan, looking up. The mower sails in a high clean arc left to right over the sedan roof, its spinning wheels passing above the flashing light bar, curlers and housecoat fluttering, the iced tea cup still in its holder, grandmother perfectly composed. Through the window below, the deputy's head turns slowly to follow her, jaw hanging.\n\nShot 7, 00:12.5-00:15: Normal speed, medium shot, grandmother in the left third, the stopped sedan soft in the background on the right. The mower lands hard on all four wheels with a bounce and rolls to a stop. Unbothered, she lifts the same iced tea from the cup holder, takes one long sip through the straw, the ice clinks. Hold on her deadpan face.\n\n[Audio Style]\nDiegetic only, no music, no dialogue: two-stroke mower engine roar, hedge branches crunching, siren whoops, a metal grill clang and sizzle, soft thuds of hot dogs on grass, tire squeal and skid, a hollow plastic rumble on the slide, a muffled slow-motion whoosh, a heavy landing thump, then near silence with cicadas, ice clinking and a long straw slurp.\n\n[Camera Work and Core Constraints]\nPhysical, motivated camera moves: dolly, hood mount, locked-off low angles; asymmetric compositions with lawn and sky as negative space. Broad soft afternoon sunlight with open soft-edged shadows, warm greens and sky blues, matte skin with gentle subsurface glow. Comedy timing: crisp cuts on each beat, one stretched slow-motion jump, a quiet deadpan button. The whole film stays in one consistent stylized 3D animation look.\n\n[Negative Prompt]\nsubtitles, watermark, logos, text on the car, music", "inputs_expanded": []}, {"id": "17", "tier": "core", "direction": "Animation", "contrast": "clay stop-motion", "task_mode": "T2V", "aspect_ratio": "4:3", "duration": "10s", "title_ru": "Пластилиновый джаз-клуб, трио", "summary_ru": "Пластилиновый джаз-клуб: трио (труба, пианино, контрабас) играет, на высокой ноте у всех зрителей подпрыгивают шляпы. Ждём настоящий стоп-моушен на двойках с отпечатками пальцев и музыку, совпадающую с игрой.", "checks": [{"name_ru": "Настоящий стоп-моушен", "detail_ru": "Движение ступенчатое на двойках (~12 поз в секунду), лёгкое «кипение» поверхности пластилина; не гладкое CG."}, {"name_ru": "Фактура пластилина", "detail_ru": "Матовый пластилин с отпечатками пальцев и вмятинами от стека на всех фигурах; клавиша сохраняет вмятину от пальца."}, {"name_ru": "Ровно трио", "detail_ru": "На сцене ровно три музыканта: трубач, пианист, контрабасистка; лишних музыкантов и инструментов нет."}, {"name_ru": "Игра совпадает со звуком", "detail_ru": "Пальцы на клавишах, клапанах трубы и струне двигаются в такт музыке; щипок струны совпадает с её звуком."}, {"name_ru": "Шляпы в унисон", "detail_ru": "На высокой ноте все шляпы одновременно подпрыгивают, зависают и падают обратно на те же головы с одним шлепком."}, {"name_ru": "Миниатюра и 4:3", "detail_ru": "Макро-объектив с малой ГРИП, тёплые настольные лампы как реальные мини-источники; композиция работает в 4:3, без пустых полей."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second handmade clay stop-motion film, 5 shots in one continuous scene. Every character, instrument and prop is sculpted from matte plasticine with visible thumbprints, fingernail marks and small tool dents. Animated on twos, about 12 poses per second, so movement steps slightly and the clay surfaces boil with a faint frame-to-frame shimmer. A real miniature set lit by real tiny lamps, filmed with a small macro lens and gentle shallow focus.\n\nThe set: a cramped jazz club at night with dark green clay walls, a low wooden stage, round tables with small checkered cloths and little brass table lamps with amber fabric shades. On stage exactly three musicians: a chubby trumpeter in a mustard vest and rolled shirtsleeves, a lanky pianist in a brown suit at an upright piano, a tall bassist woman with a big round afro and a red dress at an upright bass. In the room about a dozen clay audience members at tables, every one wearing a hat: fedoras, porkpies, a cloche, a straw boater.\n\n[Plot Summary]\nShot 1, 00:00-00:01.5: Extreme macro on the piano keyboard, keys running diagonally across frame. A fat clay fingertip with a visible fingerprint swirl presses one white key; the key squashes softly and keeps a shallow fingerprint dent as the finger lifts, the next finger already landing beside it on the beat.\n\nShot 2, 00:01.5-00:03.5: Wide from table height at the back of the room, static camera, the stage small in the upper left, the backs of two audience members in hats large and soft in the right foreground. The trio plays, lamps glowing on every table, heads nodding.\n\nShot 3, 00:03.5-00:05.5: Close-up of the trumpeter in profile in the right third, the trumpet pointing left. He inhales and his cheeks swell into two round clay balls, eyes bulging, his stubby fingers pressing the three valves one after another in time with the melody.\n\nShot 4, 00:05.5-00:07: Low close-up of the bassist's hand at the strings. Her thick clay fingers pull one fat string and release it; the string wobbles in visible stepped poses as the low note sounds, her afro bouncing on the beat at the top of frame.\n\nShot 5, 00:07-00:10: Wide from the side of the stage, low, the trumpeter in the left foreground leaning back, the room behind him on the right. He blows one huge high note and every hat in the room jumps straight up off every head at the same moment, hangs for a beat, then all drop back onto the same heads together with one flat thump. The audience blinks. He lowers the horn with a proud grin.\n\n[Audio Style]\nA live jazz trio playing in the room: a bouncy medium-swing tune with walking upright bass, comping piano and a muted trumpet melody, timed to the on-screen fingers. Small-club room tone and clinking glasses, a soft clay squish on the first key press, a fat twang exactly on the bass pluck, one soaring high trumpet note, a light whoosh as the hats rise and one flat clay thump as they land, then a short delighted laugh from the audience. No dialogue.\n\n[Camera Work and Core Constraints]\nMiniature photography: macro lens, shallow depth of field, small physical camera moves only (static and a tiny slider). Warm amber tungsten pools of light against deep green walls, soft open shadows. Compositions fill the 4:3 frame, subjects on a third. Exactly three musicians and three instruments on stage throughout. Stepped stop-motion movement and visible clay texture in every shot.\n\n[Negative Prompt]\nsubtitles, watermark, logos, smooth CGI", "inputs_expanded": []}, {"id": "18", "tier": "core", "direction": "Consistency", "contrast": "across shots", "task_mode": "R2V", "aspect_ratio": "16:9", "duration": "15s", "title_ru": "Драка за портфель на платформе метро", "summary_ru": "Майя и Оуэн дерутся за кожаный портфель на пустой платформе метро, у Оуэна слетает кепка, Майя убегает с портфелем. Ждём точное совпадение лиц, одежды, портфеля и локации с рефами во всех 5 планах.", "checks": [{"name_ru": "Майя = реф", "detail_ru": "Асимметричное лицо, короткое чёрное каре, горчичная вельветовая куртка, серое худи, тёмные джинсы, белые кеды во всех планах."}, {"name_ru": "Оуэн = реф", "detail_ru": "Тяжёлое телосложение, седая щетина, тёмно-синее шерстяное пальто, кепка до 3-го плана; лицо не меняется."}, {"name_ru": "Один и тот же портфель", "detail_ru": "Один потёртый коричневый кожаный портфель, форма, цвет и ручка не меняются; второго портфеля не появляется."}, {"name_ru": "Кепка слетает и остаётся", "detail_ru": "Кепка падает в 3-м плане и дальше Оуэн без кепки, а кепка лежит на полу платформы."}, {"name_ru": "Локация = реф", "detail_ru": "Кафельные стены без надписей, люминесцентный свет, пути слева в кадре во всех планах."}, {"name_ru": "Стороны и физика контакта", "detail_ru": "Майя справа, Оуэн слева; руки на ручке не сливаются, перетягивание имеет вес, кеды скользят по плитке."}, {"name_ru": "Реплика", "detail_ru": "Оуэн говорит «Let go of it.» с синхроном губ, других слов нет; музыки нет."}], "inputs": ["A_CHAR_MAYA_SHEET", "A_CHAR_OWEN_SHEET", "A_SUBWAY"], "reference_mapping": "@Image1 = A_CHAR_MAYA_SHEET (Maya: identity, face, wardrobe); @Image2 = A_CHAR_OWEN_SHEET (Owen: identity, face, wardrobe, the brown leather briefcase); @Image3 = A_SUBWAY (location: platform, tiles, light, tracks on frame-left)", "prompt": "[Core Task]\n[Reference Mapping] @Image1 is Maya: her face, hair and full outfit. @Image2 is Owen: his face, build, outfit and his scuffed brown leather briefcase. @Image3 is the location: the empty subway platform, its tiled walls, fluorescent light and the tracks on frame-left.\nA 15-second fight over a briefcase on an empty late-night subway platform, 5 shots, realistic crime-drama look. Maya, a woman of about 30 with an asymmetric face and a short black bob, wears a mustard corduroy jacket over a grey hoodie, dark jeans and plain white sneakers, exactly as in @Image1. Owen, a heavy-built man of about 45 with grey stubble, wears a navy wool peacoat and a flat cap, exactly as in @Image2, and holds one scuffed brown leather briefcase. Geography: the tracks stay on frame-left in every shot; Owen stays on the left side of the action, Maya on the right; Maya's escape is toward the exit stairs at frame-right.\n\n[Plot Summary]\nShot 1, 00:00-00:03: Wide shot down the platform, eye level, 28 mm, static. Owen stands near the yellow edge line holding the briefcase in his right hand. Maya strides in from frame-right and clamps both hands on the briefcase handle; his grip holds.\n\nShot 2, 00:03-00:06: Medium two-shot in profile, 40 mm, handheld. A tug of war: Owen yanks the case toward himself and growls \"Let go of it.\" (in English); Maya is pulled half a step forward, her sneakers skidding on the tiles, then she plants her feet and pulls back.\n\nShot 3, 00:06-00:09: Close shot at chest height, 50 mm, the camera drifting with them. Maya twists the handle and drives her shoulder into Owen's chest; his head snaps back and his flat cap falls off and lands on the platform floor.\n\nShot 4, 00:09-00:12: Over Owen's left shoulder, 35 mm. Maya wrenches the briefcase free and stumbles backward with it held against her chest; Owen lunges with one hand, his fingers closing on air.\n\nShot 5, 00:12-00:15: Wide low angle from near the wall, 24 mm, static. Maya runs off toward the exit stairs at frame-right with the briefcase in her left hand. Owen, now bare-headed, stands breathing hard beside his flat cap lying on the platform; far down the tunnel on frame-left the headlights of an approaching train appear.\n\n[Audio Style]\nNative sound, no music: fluorescent tube hum and the platform's hollow tiled echo, sneakers squeaking on tiles, heavy breathing and grunts, the creak of the leather handle under strain, a dull thud as her shoulder hits his chest, the soft slap of the cap on the floor, running footsteps fading toward the stairs, then a distant rising rumble of the approaching train. Owen's single line \"Let go of it.\" (in English), lip-synced, no other dialogue.\n\n[Camera Work and Core Constraints]\nRealistic film look, cool green-white fluorescent light from above as the dominant source, real skin with pores, ordinary faces, light grain. Adjacent shots differ in scale and angle; the axis holds with the tracks on frame-left. Maya, Owen, the briefcase and the platform match @Image1, @Image2 and @Image3 in every shot. After Shot 3 Owen is bare-headed and the cap stays on the floor. Walls carry plain tiles only.\n\n[Negative Prompt]\nsubtitles, watermark, logos, text on walls, music", "inputs_expanded": ["A_CHAR_MAYA_SHEET", "A_CHAR_OWEN_SHEET", "A_SUBWAY"]}, {"id": "19", "tier": "core", "direction": "Consistency", "contrast": "across time", "task_mode": "I2V+EXT", "aspect_ratio": "16:9", "duration": "40s", "title_ru": "Женщина в красном пальто у маяка, 40 с", "summary_ru": "Базовый I2V на 10 с со стартового кадра и три продления по 10 с: женщина идёт к маяку, входит, поднимается по лестнице и выходит на галерею. Ждём одно лицо и пальто на все 40 с, луч ровно каждые 6 с и швы без скачков.", "checks": [{"name_ru": "Старт = стартовый кадр", "detail_ru": "Первый кадр совпадает с A_LIGHTHOUSE_START: маяк справа, женщина слева, вид на три четверти со спины."}, {"name_ru": "Одна и та же героиня 40 с", "detail_ru": "Лицо, цвет и длина волос, длинное красное шерстяное пальто одного оттенка и кроя во всех 4 сегментах."}, {"name_ru": "Луч ровно каждые 6 с", "detail_ru": "Проход луча на 00:03, 00:09, 00:15, 00:21, 00:27, 00:33, 00:39 (±0,5 с); нет лишних и пропущенных проходов."}, {"name_ru": "Швы без скачков", "detail_ru": "На 00:10, 00:20, 00:30 поза, положение, свет и звук продолжаются из последнего кадра без прыжка."}, {"name_ru": "Свет течёт в одну сторону", "detail_ru": "Сумерки плавно переходят в синий час и не светлеют назад; маяк тот же (белая башня, тёмный фонарь)."}, {"name_ru": "Логика ветра", "detail_ru": "Снаружи волосы и полы пальто летят вправо (ветер с моря слева), на лестнице внутри волосы спокойны, на галерее ветер снова сильный."}, {"name_ru": "Звук непрерывен", "detail_ru": "Ветер, волны, шаги и скрип двери меняются по месту действия без обрывов на швах; музыки нет."}], "inputs": ["A_LIGHTHOUSE_START"], "reference_mapping": "@Image1 = A_LIGHTHOUSE_START (exact first frame of Segment 1: shore, lighthouse, the woman, light)", "prompt": "[Core Task]\n[Reference Mapping] @Image1 is the exact first frame of Segment 1: the rocky shore at dusk, the white lighthouse on frame-right, the woman in the long red wool coat on frame-left in three-quarter back view.\nA 40-second continuous story built as one base generation plus three extensions. Segment 1 is the base 10-second image-to-video generation from @Image1. Segments 2, 3 and 4 are pasted in order as the three extension prompts; each one continues directly from the last frame of the previous segment with no jump. Global times run 00:00-00:40; times in brackets are local to each segment.\n\nConstant for all 40 seconds: the same woman with the same face and the same dark hair, the same long red wool coat of one exact shade and cut, the same white lighthouse with a dark lantern room. The lighthouse beam sweeps once every 6 seconds, exactly at 00:03, 00:09, 00:15, 00:21, 00:27, 00:33 and 00:39, never in between. The light moves forward in time only, from dusk into blue hour. Wind blows in from the sea on frame-left, pushing her hair and coat toward frame-right whenever she is outdoors.\n\n[Plot Summary]\nSegment 1 (base, 00:00-00:10, local 00:00-00:10):\nShot 1, 00:00-00:05: Starts exactly on @Image1. She walks forward over the wet rocks toward the lighthouse, the camera following in a slow push at walking pace, her hair and coat hem streaming to frame-right. At 00:03 [local 00:03] the beam sweeps across the darkening sky once.\nShot 2, 00:05-00:10: Medium side tracking shot from her left, 50 mm, she walks left to right with her collar turned up against the wind, surf breaking on the rocks below. At 00:09 [local 00:09] the beam sweeps over the rocks and across her.\n\nSegment 2 (extension 1, 00:10-00:20, local 00:00-00:10): Continue directly from the last frame, same woman, same coat, same light.\nShot 3, 00:10-00:14 [00:00-00:04]: Medium shot: she reaches the base of the lighthouse, takes hold of a rusted iron handrail and climbs a short flight of worn concrete steps.\nShot 4, 00:14-00:17 [00:04-00:07]: Wide low angle from the rocks: she stands at the heavy iron door at the tower base, the white tower rising above her. At 00:15 [local 00:05] the beam sweeps out over the sea above her.\nShot 5, 00:17-00:20 [00:07-00:10]: Close shot on her hands: she leans her weight into the iron door and pushes it open; it grinds inward onto darkness.\n\nSegment 3 (extension 2, 00:20-00:30, local 00:00-00:10): Continue directly from the last frame, inside the lighthouse, same woman, same coat.\nShot 6, 00:20-00:25 [00:00-00:05]: High angle looking down the stone spiral staircase: she climbs steadily, one hand on the curved wall; indoors her hair hangs still. At 00:21 [local 00:01] a band of beam light flashes through a small window and slides across the steps.\nShot 7, 00:25-00:30 [00:05-00:10]: Medium close side tracking at her shoulder, her face in profile, breath visible in the cold. At 00:27 [local 00:07] the beam flashes through the next small window and crosses her face.\n\nSegment 4 (extension 3, 00:30-00:40, local 00:00-00:10): Continue directly from the last frame, at the top of the lighthouse, same woman, same coat.\nShot 8, 00:30-00:34 [00:00-00:04]: Medium shot from behind: she pushes open the small door onto the iron gallery and the wind hits her again, hair and coat streaming to frame-right. At 00:33 [local 00:03] the great lamp behind the glass turns and the beam sweeps out above her.\nShot 9, 00:34-00:40 [00:04-00:10]: Close-up of her face in three-quarter front view at the railing, looking out to sea as fog rolls in over the water. At 00:39 [local 00:09] the beam passes over her face and lights it white for a moment, then she stays in the blue dusk.\n\n[Audio Style]\nContinuous native sound, no music, no dialogue, flowing across every seam: wind and surf with gulls and footsteps on wet rock outdoors; her steps on concrete and the long metallic grind of the iron door; inside, echoing footsteps on stone and muffled wind; at the top, strong wind, the low hum of the turning lamp and waves far below.\n\n[Camera Work and Core Constraints]\nRealistic 35 mm film look: cold blue-grey dusk with the red coat as the only strong colour, soft grain, real skin with pores, an ordinary face. Each segment opens on the same framing and pose as the last frame of the previous one. Adjacent shots differ in scale and angle. The beam timing, her identity, the coat and the progression of light hold across all four segments.\n\n[Negative Prompt]\nsubtitles, watermark, logos, music", "inputs_expanded": ["A_LIGHTHOUSE_START"]}, {"id": "20", "tier": "core", "direction": "Viral effects", "contrast": "transformation", "task_mode": "I2V", "aspect_ratio": "9:16", "duration": "10s", "title_ru": "Человек плавится в жидкий хром и становится героем в броне", "summary_ru": "С фото: парень щёлкает пальцами, тело покрывается жидким хромом, оседает лужей и снова поднимается — уже в броне, с тем же лицом. Ждём сохранение личности, честную физику тяжёлой жидкости и сдержанный вкус без дешёвых эффектов.", "checks": [{"name_ru": "Личность сохранена", "detail_ru": "После трансформации то же лицо: веснушки, рыжие кудри, форма носа и глаз как на A_PERSON_PHOTO; лицо открыто, не в шлеме."}, {"name_ru": "Старт = фото", "detail_ru": "Первый кадр совпадает с A_PERSON_PHOTO: тот же тротуар, кадр по пояс, дневной свет."}, {"name_ru": "Хром — зеркало мира", "detail_ru": "Хром отражает реальную улицу и небо с правильной перспективой, а не серую краску; отражения движутся с поверхностью."}, {"name_ru": "Физика тяжёлой жидкости", "detail_ru": "Хром стекает вниз под гравитацией, вязко, с волнами; объём сохраняется: лужа и броня собираются из того же металла, ничего не берётся из воздуха."}, {"name_ru": "Броня правдоподобна", "detail_ru": "Матовые оружейно-серые пластины на тёмной ткани, сегменты на суставах, без эмблем, свечения, молний и частиц."}, {"name_ru": "Последовательность", "detail_ru": "Щелчок → хром от пальцев вверх → оседание → подъём → хром сходит с лица последним; порядок не нарушен."}, {"name_ru": "Руки и фон", "detail_ru": "Пять пальцев до и после; улица на фоне не меняется и не плывёт."}, {"name_ru": "Звук", "detail_ru": "Щелчок пальцев, вязкий плеск металла, щелчки пластин, уличный фон; музыки нет."}], "inputs": ["A_PERSON_PHOTO"], "reference_mapping": "@Image1 = A_PERSON_PHOTO (exact first frame and the identity to preserve: face, freckles, curly auburn hair)", "prompt": "[Core Task]\n[Reference Mapping] @Image1 is the exact first frame and the identity to preserve: the young man's face, freckles, curly auburn hair and build, the city sidewalk and the daylight.\nA 10-second vertical transformation in one continuous shot: the young man from @Image1 snaps his fingers, liquid chrome spreads over his body, he melts down into a pool of chrome and rises again from it wearing fitted armour, with his own face and hair unchanged. The effect is grounded and physical: heavy, viscous liquid metal that mirrors the real street.\n\n[Plot Summary]\nShot 1 (one continuous shot), 00:00-00:10:\n00:00-00:02 — Starts exactly on @Image1: waist-up on the sidewalk, plain olive t-shirt, natural daylight. He looks into the lens, a small half-smile, raises his right hand and snaps his fingers.\n00:02-00:04 — From the snapping fingertips a skin of liquid chrome spreads up his hand and arm and across his chest and neck; wherever it flows, the surface turns into a perfect curved mirror reflecting the street, the parked cars and the sky. His face is the last part covered.\n00:04-00:06 — Fully chrome, his body loses its shape and slumps downward like heavy mercury, sliding into a waist-high rippling pool of liquid chrome on the sidewalk; the camera eases back to keep the whole pool in frame. Waves cross the pool, reflecting the street.\n00:06-00:08.5 — The same chrome surges upward and re-forms his body standing in the same spot, now wearing a close-fitting armoured suit: matte gunmetal-grey plates over dark matte fabric, segmented at the shoulders, elbows and knees, no emblem. The last chrome flows down off his face and hair, revealing his exact face with the same freckles and the same curly auburn hair.\n00:08.5-00:10 — He exhales, flexes the five armoured fingers of his right hand, then looks back into the lens with the same half-smile.\n\n[Audio Style]\nNative sound, no music: city sidewalk ambience with distant traffic, one crisp finger snap, a thick viscous metallic slosh as the chrome spreads, a heavy liquid collapse into the pool, a rising pour as it re-forms, a series of small precise clicks as the armour plates settle, his calm exhale.\n\n[Camera Work and Core Constraints]\nHandheld phone-style vertical framing matching @Image1, a gentle pull-back from waist-up to knees during the melt and a return to waist-up at the end. Natural overcast-to-soft daylight, real skin with pores before and after, the chrome reflecting the actual surroundings with correct perspective. The chrome moves under gravity and its volume is conserved: the pool and the armour are made from the same metal. The street behind him stays the same throughout. Restrained, tasteful effect with no glow and no particles.\n\n[Negative Prompt]\nsubtitles, watermark, logos, music, helmet", "inputs_expanded": ["A_PERSON_PHOTO"]}, {"id": "21", "tier": "extended", "direction": "Camera", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Пытка камерой: долли-зум, орбита, крэш-зум, пролёт сквозь отражение", "summary_ru": "Один непрерывный кадр в дождливом переулке: долли-зум, замороженный дождь с орбитой на 360°, крэш-зум в правый глаз и пролёт сквозь отражение в другую сцену. Ждём точное исполнение каждого приёма и бесшовность.", "checks": [{"name_ru": "Настоящий долли-зум", "detail_ru": "Мужчина держит один размер в кадре, а стены переулка за ним заметно растягиваются в глубину; это не простой зум и не наезд."}, {"name_ru": "Заморозка", "detail_ru": "Он застывает на полушаге, капли дождя неподвижно висят в воздух
