е, лужи не рябят."}, {"name_ru": "Орбита 360° замкнута", "detail_ru": "Камера облетает его полный круг и возвращается к лицу в той же точке; переулок за ним сохраняет геометрию со всех сторон, капли дают параллакс."}, {"name_ru": "Крэш-зум в правый глаз", "detail_ru": "Резкий зум именно в ЕГО правый глаз (слева в кадре), без склейки."}, {"name_ru": "Отражение верное", "detail_ru": "В зрачке видна горящая машина на ночном шоссе, затем камера пролетает сквозь отражение в эту сцену без склейки и наплыва."}, {"name_ru": "Один кадр", "detail_ru": "Весь ролик одно непрерывное движение камеры, ни одной склейки."}, {"name_ru": "Звук по битам", "detail_ru": "Дождь, сердцебиение замедляется на заморозке, на пролёте рёв огня; музыки нет."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA single continuous camera move at night in the rain, one shot with no cuts and no dissolves, built from four precise camera techniques in sequence: a dolly zoom, a full 360-degree orbit through frozen rain, a crash zoom into an eye, and a fly-through of the reflection in that eye.\n\nThe subject: a man in his 30s with an ordinary face and short dark hair, in a dark waxed jacket, in a narrow wet brick alley lit by one blue neon tube and one sodium-orange street lamp.\n\n[Plot Summary]\nShot 1 (one continuous shot), 00:00-00:10:\n00:00-00:03 — Dolly zoom: the man stands mid-alley facing the camera, chest-up. The camera dollies backward while the lens zooms in, so he stays exactly the same size in frame while the alley walls behind him visibly stretch away and the far end recedes.\n00:03-00:06 — He freezes mid-step and every raindrop stops in the air, the puddles go glassy still. The camera orbits a full 360 degrees around him at chest height through the hanging drops, the drops sliding past the lens in parallax, the alley keeping the same geometry on every side, and arrives back at his face exactly where the orbit began.\n00:06-00:08 — The camera crash-zooms straight into his right eye (on frame-left as he faces the camera) until the iris fills the frame; reflected on the wet pupil is a car burning on the shoulder of a night highway.\n00:08-00:10 — Without a cut, the camera flies forward through the reflection and emerges inside that highway scene, moving toward the burning car, flames and smoke rolling in front of the lens.\n\n[Audio Style]\nNo music: steady rain on brick and puddles; at the freeze the rain sound drains away into silence with a slow heartbeat that slows further during the orbit; a sharp whoosh on the crash zoom; on the fly-through, the roar and crackle of the fire and a distant passing truck.\n\n[Camera Work and Core Constraints]\nOne unbroken move, 35 mm-equivalent at the start of the dolly zoom, telephoto at the end of it; speeds as written: slow and controlled on the dolly zoom and orbit, violent on the crash zoom, steady forward on the fly-through. Neon blue and sodium orange light on wet surfaces, raindrops crisp and sharply frozen during the orbit, realistic film look with grain. The eye in the crash zoom is his right eye; the scene in the reflection is the scene the camera flies into.\n\n[Negative Prompt]\nsubtitles, watermark, logos, music", "inputs_expanded": []}, {"id": "22", "tier": "extended", "direction": "Text", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Текст: неон, чат в телефоне, ценник, титр", "summary_ru": "Ночная улица с неоном «OPEN 24H», переписка в телефоне, ценник «-30%» в магазине и финальный титр. Ждём каждую строку буква в букву и стабильно во всех кадрах.", "checks": [{"name_ru": "Неон OPEN 24H", "detail_ru": "Вывеска читается ровно «OPEN 24H», буквы не плывут и не меняются; в мокром асфальте отражение зеркально перевёрнуто."}, {"name_ru": "Чат дословно", "detail_ru": "Входящее сообщение ровно «Where are you?», набираемый текст «Almost there» появляется по буквам и после отправки встаёт пузырём под входящим."}, {"name_ru": "Ценник -30%", "detail_ru": "Красный ценник ровно «-30%» со знаком минус и процентом, без лишних цифр."}, {"name_ru": "Финальный титр", "detail_ru": "Белым по чёрному ровно «NIGHT SHIFT», ниже меньше ровно «A SHORT FILM»."}, {"name_ru": "Нет мусорного текста", "detail_ru": "Других надписей, псевдобукв и логотипов в кадре нет: витрины, полки и интерфейс телефона без лишнего текста."}, {"name_ru": "Порядок и руки", "detail_ru": "Планы идут в заданном порядке; палец печатает по клавиатуре правдоподобно, пять пальцев."}, {"name_ru": "Звук", "detail_ru": "Дождь, гул неона, щелчки клавиатуры, звук отправки, колокольчик двери, низкий удар на титре; без музыки и речи."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second night-street scene built around exact on-screen text, 4 shots. Every text string must appear spelled exactly as written here, letter for letter, and stay stable for as long as it is on screen. These are the only four pieces of text in the film: the neon sign \"OPEN 24H\", the two chat messages \"Where are you?\" and \"Almost there\", the price tag \"-30%\", and the end title \"NIGHT SHIFT\" with the line \"A SHORT FILM\". All other surfaces carry no lettering.\n\n[Plot Summary]\nShot 1, 00:00-00:02.5: Wide shot of a rainy night street, eye level, 35 mm, slow push toward a small corner store. In its window a red neon sign reads \"OPEN 24H\", buzzing steadily; the wet pavement below reflects it mirror-reversed. A young woman in a dark raincoat walks toward the store door, phone in hand.\n\nShot 2, 00:02.5-00:05: Close over-the-shoulder shot of her phone screen in her left hand, 50 mm. A plain messaging screen without any app logo shows one grey incoming bubble that reads \"Where are you?\". Her right thumb types on the on-screen keyboard and \"Almost there\" appears letter by letter in the input field; she taps send and it jumps up as a blue bubble below the grey one.\n\nShot 3, 00:05-00:07.5: Inside the store, close-up at shelf height, 85 mm, shallow focus. A row of plain white ceramic mugs on a shelf with one red paper price tag clipped to the shelf edge that reads \"-30%\" in bold white characters. Her index finger enters from frame-right and taps the tag, which swings slightly.\n\nShot 4, 00:07.5-00:10: End title card: solid black frame. The title \"NIGHT SHIFT\" fades in at centre in large white serif capitals, then the line \"A SHORT FILM\" in small white capitals appears below it; both hold steady to the end.\n\n[Audio Style]\nNo music, no dialogue: steady rain and wet tyre hiss, the electric buzz of the neon sign, soft keyboard taps synced to each letter, a short send whoosh, a door chime and quiet store hum with a fridge, then one low soft hit as the title appears and silence under the card.\n\n[Camera Work and Core Constraints]\nRealistic night look: red neon and cool street light on wet surfaces, real skin, light grain. Adjacent shots change scale and angle. Text is crisp, correctly spelled and fixed in place on its surface; the reflection of the sign in the pavement is mirror-reversed. The phone interface is plain and generic.\n\n[Negative Prompt]\nsubtitles, watermark, logos, extra text, music", "inputs_expanded": []}, {"id": "23", "tier": "extended", "direction": "Counting & logic", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "8s", "title_ru": "Счёт и логика: шарики и лист", "summary_ru": "Слева 5 красных шариков, справа 2 синих; синие лопают по одному в заданном порядке, красные остаются, затем один зелёный лист желтеет. Ждём точные числа, стороны, порядок и изменение во времени.", "checks": [{"name_ru": "Счёт в начале", "detail_ru": "Ровно 5 красных шариков слева в кадре и ровно 2 синих справа."}, {"name_ru": "Порядок лопания", "detail_ru": "Сначала лопается внутренний синий (ближе к красным) на ~00:02, затем внешний на ~00:03.5; каждый один раз, иглой, с ошмётками резины."}, {"name_ru": "Красные не тронуты", "detail_ru": "После лопания по-прежнему ровно 5 красных шариков, они только качнулись; справа остаются две пустые ленточки."}, {"name_ru": "Стороны не меняются", "detail_ru": "Красные всегда слева, синие справа, в том числе после склеек."}, {"name_ru": "Лист меняет цвет", "detail_ru": "Желтеет ровно один, самый большой передний лист: от кончика к черешку за ~2 с; остальные листья остаются зелёными."}, {"name_ru": "Рука", "detail_ru": "Одна правая рука с иглой, пять пальцев."}, {"name_ru": "Звук", "detail_ru": "Два хлопка в нужный момент и порядке, тихий фон комнаты; музыки нет."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nAn 8-second logic test in a plain bright room, 4 shots, with exact counts, fixed left and right positions, ordered actions and a colour change over time. Exactly five red balloons are tied to a wooden chair on frame-left; exactly two blue balloons are tied to a wooden chair on frame-right. Between the chairs a small table holds a potted plant with green leaves. Red always stays on frame-left and blue on frame-right.\n\n[Plot Summary]\nShot 1, 00:00-00:01.5: Wide frontal shot, eye level, static, 35 mm. The whole setup in clear view: five red balloons on the left chair, two blue balloons on the right chair, the potted plant on the table between them. All balloons float still on their strings.\n\nShot 2, 00:01.5-00:04.5: Medium shot of the right chair, slightly low angle, 50 mm. A right hand with five fingers enters from frame-right holding a sewing pin. At 00:02 it pops the inner blue balloon, the one closer to the red ones: the balloon bursts, rubber shreds fly and the empty string drops. At 00:03.5 it pops the outer blue balloon the same way. Two limp strings hang from the chair.\n\nShot 3, 00:04.5-00:05.5: Wide shot from a slightly higher angle, static. Still exactly five red balloons on the left chair, swaying gently from the shock of the pops; the right chair has two empty strings.\n\nShot 4, 00:05.5-00:08: Macro close-up of the potted plant, static, shallow focus. The largest front leaf, bright green, turns yellow over about two seconds, the colour spreading from the tip toward the stem until the whole leaf is yellow; every other leaf stays green.\n\n[Audio Style]\nNo music, no dialogue: quiet room tone, two sharp balloon pops exactly at 00:02 and 00:03.5, the soft patter of rubber shreds landing, the faint squeak of red balloons rubbing as they sway, then near silence over the leaf.\n\n[Camera Work and Core Constraints]\nBright, soft daylight from a window on frame-left, white walls, clean realistic look. Static camera in every shot. Counts stay exact in every shot: five red, two blue until popped, then zero blue. The blue balloons pop in the stated order, one at a time. Only one leaf changes colour.\n\n[Negative Prompt]\nsubtitles, watermark, logos, music", "inputs_expanded": []}, {"id": "24", "tier": "extended", "direction": "Local video edit", "contrast": "—", "task_mode": "V2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Локальная правка ролика из кафе", "summary_ru": "Три отдельных прогона от исходника V_CAFE: A — убрать прохожего и его отражение, B — золотой час и лёгкий дождь, C — обратная точка того же момента. Ждём, что меняется только цель, а всё остальное не плывёт.", "checks": [{"name_ru": "A: прохожий исчез полностью", "detail_ru": "Нет ни прохожего, ни его отражения в окне ни в одном кадре; фон за ним заполнен чисто, без пятен, призраков и мерцания."}, {"name_ru": "A: остальное не тронуто", "detail_ru": "Лицо, жесты и тайминг женщины, ноутбук, чашки и предметы на столе, улица и дрожание камеры совпадают с исходником кадр в кадр."}, {"name_ru": "B: свет золотого часа", "detail_ru": "Тёплый низкий свет из окна с одной стороны все 10 с, длинные блики и тени согласованы; на стекле капли, улица мокрая."}, {"name_ru": "B: люди и движение те же", "detail_ru": "Женщина и прохожий двигаются как в исходнике, лица и одежда не меняются, отражение прохожего сохранено."}, {"name_ru": "C: тот же момент с обратной точки", "detail_ru": "Жесты женщины синхронны исходнику по секундам; прохожий проходит в тот же момент, но теперь справа налево."}, {"name_ru": "C: целостность сцены", "detail_ru": "Одежда, ноутбук, предметы стола совпадают; окно на другой стороне кадра, интерьер за исходной камерой правдоподобен."}, {"name_ru": "Без дрейфа нетронутых зон", "detail_ru": "Во всех трёх прогонах стены, мебель, число предметов на столе и вид за окном не плывут и не меняются от кадра к кадру."}, {"name_ru": "Звук", "detail_ru": "Исходный звук сохранён; в B добавлен только дождь по стеклу; музыки нет."}], "inputs": ["V_CAFE"], "reference_mapping": "@Video1 = V_CAFE (the original clip; each run A, B, C is a separate generation from this original, not chained)", "prompt": "[Core Task]\nRUN A of 3 — a separate generation from the original @Video1.\n[Reference Mapping] @Video1 is the clip to edit: the handheld café shot of a woman at a window table with a laptop, with a passer-by walking behind her left to right and reflected in the window.\nLocal edit: remove the passer-by completely, including their reflection in the window. Keep everything else in @Video1 exactly the same, frame for frame.\n\n[Plot Summary]\nShot 1 (the full original shot), 00:00-00:10: The woman at the window table works on her laptop exactly as in @Video1, with the same gestures, glances and timing. Where the passer-by walked behind her, the café interior that was behind them is filled in naturally: the same tables, chairs, wall and light, holding still and consistent from frame to frame. The window shows only the reflection of the café interior and the woman, with no trace of the passer-by. Everything else stays untouched: her face, hair, clothes, the laptop, cups and objects on the table, the street outside, the overcast daylight and the original handheld camera motion.\n\n[Audio Style]\nKeep the original audio of @Video1 unchanged: café room tone, cups, keyboard taps. Remove only the passer-by's footsteps if they are audible.\n\n[Camera Work and Core Constraints]\nThe original handheld camera path, framing and exposure of @Video1 are kept exactly. Only the passer-by and their reflection change; every other pixel region stays as in the source.\n\n[Negative Prompt]\nsubtitles, watermark, logos, music\n\n----------\n\n[Core Task]\nRUN B of 3 — a separate generation from the original @Video1.\n[Reference Mapping] @Video1 is the clip to edit: the handheld café shot of a woman at a window table with a laptop, with a passer-by walking behind her left to right and reflected in the window.\nRelight and weather edit: change the overcast daylight to golden hour with light rain outside. Keep the people, their motion, the room and the camera exactly as in @Video1.\n\n[Plot Summary]\nShot 1 (the full original shot), 00:00-00:10: The same woman, the same passer-by and the same actions with the same timing as in @Video1. Low warm sunlight now comes through the window from one consistent side, laying long golden patches across the table, her face and the laptop, with soft shadows falling away from the window. Light rain falls outside: thin drops streak down the window glass and the street outside is wet and glistening in the low sun. The passer-by and their reflection remain and receive the same warm light. Faces, clothes, objects and the room layout stay exactly as in the source.\n\n[Audio Style]\nKeep the original audio of @Video1 and add the soft patter of light rain on the window glass and a faint wet street hiss outside.\n\n[Camera Work and Core Constraints]\nThe original handheld camera path and framing of @Video1 are kept exactly. The light direction stays the same for all 10 seconds. Only the light, the colour of the light and the weather outside change.\n\n[Negative Prompt]\nsubtitles, watermark, logos, music\n\n----------\n\n[Core Task]\nRUN C of 3 — a separate generation from the original @Video1.\n[Reference Mapping] @Video1 is the source moment: the handheld café shot of a woman at a window table with a laptop, with a passer-by walking behind her left to right and reflected in the window.\nNew angle edit: show the same 10 seconds of action from the reverse angle. The same woman, passer-by, table, objects and light, with all actions happening at the same moments as in @Video1.\n\n[Plot Summary]\nShot 1 (reverse angle, one continuous shot), 00:00-00:10: The camera is now on the opposite side of the woman, behind and slightly to the side of her shoulder, looking past her across the café toward where the original camera stood; the window is now on the opposite side of frame. She performs exactly the same gestures, glances and typing as in @Video1, in sync second by second. The passer-by crosses at the same moment as in the original, and because the camera has turned around, now walks right to left in frame. Her clothes, hair, the laptop, cups and table objects match the source, mirrored correctly by the new viewpoint, and the café interior visible behind the original camera position is plausible and consistent with the room.\n\n[Audio Style]\nKeep the original audio of @Video1 unchanged: the same café room tone, cups and keyboard taps at the same moments.\n\n[Camera Work and Core Constraints]\nHandheld at the same height and with the same gentle shake character as @Video1, the same overcast daylight from the window. Only the viewpoint changes; the people, objects, actions and timing stay those of @Video1.\n\n[Negative Prompt]\nsubtitles, watermark, logos, music", "inputs_expanded": ["V_CAFE"]}, {"id": "25", "tier": "extended", "direction": "Non-speech audio", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Звук без речи: стекло, нота, машина", "summary_ru": "Три жёстких куска: нож режет стеклянное яблоко, гитарист держит одну ноту Ля, машина проезжает слева направо. Сильная модель попадает звуком в действие до кадра, держит ровную ноту и ведёт машину по стерео.", "checks": [{"name_ru": "Хруст по касанию", "detail_ru": "Хруст начинается в момент входа лезвия и обрывается, когда лезвие касается доски; дальше только стук и звон половинок."}, {"name_ru": "Стекло ведёт себя как стекло", "detail_ru": "Яблоко твёрдое и прозрачное, трещина идёт перед лезвием, распадается на две половинки; не мнётся и не режется как желе."}, {"name_ru": "Одна ровная нота Ля", "detail_ru": "Один щипок открытой пятой струны, высота стоит ровно без плавания и вибрато, второй ноты нет, струна видимо вибрирует и затухает."}, {"name_ru": "Машина слева направо", "detail_ru": "Седан въезжает слева и уезжает вправо с постоянной скоростью, без разворота и без второй машины."}, {"name_ru": "Стерео идёт за машиной", "detail_ru": "Звук мотора из левого канала через центр уходит в правый синхронно с положением машины в кадре; при проезде центра тон падает (Доплер)."}, {"name_ru": "Склейки звука и картинки совпадают", "detail_ru": "Звук режется жёстко на тех же кадрах, что и картинка: 00:03.5 и 00:07."}, {"name_ru": "Без музыки и голоса", "detail_ru": "Нет музыкальной подложки, нет речи; только синхронные шумы."}, {"name_ru": "Руки", "detail_ru": "У руки с ножом и у гитариста по пять пальцев, хват стабилен."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second live-action sound-design test film in three hard-cut parts, real photographic footage. Its purpose is exact sync between picture and non-speech sound: an ASMR knife cut through a glass apple, one sustained guitar note, and a car passing with its sound moving across the stereo field. The soundtrack is pure sync sound from the three events.\n\n[Plot Summary]\nShot 1, 00:00-00:03.5: Extreme macro, static, side angle at board level, soft window light from frame-right, the apple on the left third of frame on a pale end-grain maple board. A solid, perfectly clear glass apple with a glass stem rests still. A hand enters from the right and presses a thin, sharp steel chef's knife straight down through its centre in one slow, even stroke: the edge enters the glass at 00:00.8 and meets the board at 00:02.8, a fine crack line running just ahead of the blade inside the glass. The moment the blade touches the board, the two halves tip apart and rock to a stop, each cut face flat and glossy.\nShot 2, 00:03.5-00:07: Hard cut. Medium close-up, slightly low angle, 85 mm, warm practical lamp behind, on the hands and soundhole of a plain unbranded acoustic guitar played by a seated man whose face stays out of frame. At 00:03.8 his right thumb plucks the open fifth string once: a single A note (A2, 110 Hz). He lets it ring with both hands still; the string blurs with vibration and slowly settles, no other string is touched, and the note holds one steady pitch while it decays naturally until the cut.\nShot 3, 00:07-00:10: Hard cut. Wide, static, tripod at hip height on the roadside, a quiet two-lane country road crossing frame horizontally under flat overcast light, empty fields behind. A plain dark-grey sedan with no badges enters at the left edge at 00:07.3, drives steadily across frame at about 70 km/h, and exits at the right edge at 00:09.2; the road is empty in the final second.\n\n[Audio Style]\nNative close-miked sound only, no music bed, no voice. Shot 1: near-silent room tone, then a crisp, high glassy crunch with fine crackles that starts exactly when the edge enters the glass and stops exactly when the blade meets the board, followed by one soft wooden tap and two small glass clicks as the halves rock. Hard audio cut at 00:03.5, on the picture cut. Shot 2: one clean plucked A note at 110 Hz that sustains at one perfectly steady pitch, a single note only, with a faint body resonance, decaying naturally over three seconds. Hard audio cut at 00:07, on the picture cut. Shot 3: soft wind and distant birds, then the car's engine and tyre roar heard in the left channel as the car enters frame-left, passing through the centre as it crosses mid-frame with a natural Doppler drop in pitch, and ending in the right channel as it exits frame-right; the sound fades out on the right after the car is gone.\n\n[Camera Work and Core Constraints]\nThree shots, two hard cuts, with picture and sound cutting on the same frame. Every sound is locked to its visible cause. The glass apple stays rigid glass: it cracks and splits in two and never bends or squashes. The knife hand has five fingers and a steady grip. The guitarist plays exactly one note. The car travels left to right only at constant speed, and its stereo position follows its screen position. Real photographic look, true colour, fine grain, off-centre compositions.\n\n[Negative Prompt]\nmusic, background score, speech, voice-over, subtitles, on-screen text, watermark, logos", "inputs_expanded": []}, {"id": "26", "tier": "extended", "direction": "Fire & optics", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Фламбе: огонь, пар, лёд, отражение", "summary_ru": "Повар фламбирует креветки, пламя отражается в ложке, кубик льда тает на раскалённой сковороде. Сильная модель делает огонь источником света, правильное перевёрнутое отражение и честное таяние льда.", "checks": [{"name_ru": "Огонь — источник света", "detail_ru": "Вспышка освещает лицо снизу и стены тёплым мерцанием, тени прыгают вместе с пламенем."}, {"name_ru": "Отражение в ложке", "detail_ru": "Вогнутая ложка показывает пламя перевёрнутым и уменьшенным, мерцание синхронно с настоящим огнём за ней."}, {"name_ru": "Лёд тает", "detail_ru": "Кубик скользит на паровой подушке, заметно уменьшается, капли пляшут и испаряются; не стоит неизменным и не исчезает скачком."}, {"name_ru": "Пар, а не дым", "detail_ru": "Пар белый, поднимается в луче лампы и рассеивается; чёрного дыма нет."}, {"name_ru": "Пламя гаснет физично", "detail_ru": "Столб огня опадает до низкого сине-золотого языка и гаснет, а не обрывается кадром."}, {"name_ru": "Один повар, руки", "detail_ru": "Тот же повар и куртка во всех кадрах, у рук по пять пальцев, ложка и графин не плавятся."}, {"name_ru": "Звук в синхрон", "detail_ru": "Глухой «вжух» ровно на вспышке, резкое шипение ровно на касании льда, без музыки."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second live-action cooking film, four shots in one continuous scene, shot on 35 mm film. A small restaurant kitchen at night: black steel gas range, brushed steel counter, one warm hood lamp as the key light, the rest of the kitchen in soft darkness. One cook in his fifties, grey stubble, ordinary face with real skin texture, plain white chef jacket with sleeves rolled up; he appears in every shot and his hands perform every action. On the range: a steel sauté pan with butter and three seared prawns over a blue gas flame, and next to it a second, empty steel pan heated until it is smoking-hot.\n\n[Plot Summary]\nShot 1, 00:00-00:03: Medium close-up from counter height, the cook on the left third of frame. He pours a splash of amber brandy from a small plain glass carafe into the prawn pan and tips the far edge toward the burner; the vapour catches and a column of orange flame rises to his chin, lighting his face from below in warm flicker while shadows jump on the hood wall behind him.\nShot 2, 00:03-00:05: Macro, static, shallow focus. He holds a large polished silver serving spoon in the foreground, the inside of the bowl facing the lens; the concave bowl reflects the flame upside down and shrunk, and the reflection flickers in exact sync with the real flame burning out of focus behind it.\nShot 3, 00:05-00:07.5: Close overhead, static, the empty hot pan filling frame. He drops one clear ice cube onto the hot steel: it lands, skitters across the pan on a cushion of steam, and visibly shrinks as it melts, shedding water that beads into dancing droplets and flashes into white steam, leaving a small wet trail that boils away.\nShot 4, 00:07.5-00:10: Wide side angle across the range, slow push in. The fire in the prawn pan collapses to a low blue-and-gold ripple and goes out; he shakes the pan twice and the prawns slide through the glossy sauce; white steam drifts up through the hood lamp beam and thins out.\n\n[Audio Style]\nNatural kitchen sound only, no music. Low hood-fan hum throughout, the glug of brandy, a deep whoosh exactly when the flame catches, then crackle and soft roar; in the spoon macro the same fire crackle, quieter. A loud sharp hiss and sputter exactly when the ice hits the steel, rapid crackling of dancing droplets fading as it melts. Two metal scrapes of the pan shake and a steady sizzle to the end.\n\n[Camera Work and Core Constraints]\nFour shots; adjacent shots change scale and angle. Fire behaves as a real light source and lights the face and walls with flicker. The spoon reflection is inverted, smaller and synced with the flame. The ice stays one cube that gets smaller over time until it is mostly water. Steam is white and dissipates. The same cook, jacket and pan in every shot; hands with five fingers. Natural photographic realism, fine film grain, warm tungsten against dark steel, off-centre compositions.\n\n[Negative Prompt]\nmusic, subtitles, on-screen text, watermark, logos", "inputs_expanded": []}, {"id": "27", "tier": "extended", "direction": "Animals", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Родео: наездник на быке", "summary_ru": "Бык в загоне, рука на верёвке, ворота, бык вырывается и брыкается в пыли под трибунами, наездник соскакивает по гудку. Ждём правильную анатомию и вес быка, физичную пыль и живые трибуны.", "checks": [{"name_ru": "Анатомия быка", "detail_ru": "Четыре ноги, два рога, горб, масса чувствуется в каждом приземлении; ноги не путаются и не сливаются."}, {"name_ru": "Наездник держится", "detail_ru": "Правая рука в перчатке зажата в верёвке, тело работает от толчков, не сливается с быком и не парит над ним."}, {"name_ru": "Пыль", "detail_ru": "Пыль поднимается клубами от копыт, висит в свете прожекторов и оседает; тяжёлые комья летят по дуге и падают."}, {"name_ru": "Направление экрана", "detail_ru": "Бык идёт справа налево в кадрах 3–5, без зеркальных перескоков."}, {"name_ru": "Живые трибуны", "detail_ru": "Разные люди, нет клонов и застывшей массы; толпа встаёт и кричит после соскока."}, {"name_ru": "Постоянство", "detail_ru": "Тот же наездник, шляпа, жилет, перчатка и тот же чёрный бык во всех кадрах."}, {"name_ru": "Звук", "detail_ru": "Лязг рога о трубу, удар ворот, топот, гудок ровно перед соскоком, рёв трибун; без музыки."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second live-action rodeo sequence, five shots in one continuous scene, shot on 35 mm film. A small-town outdoor rodeo arena in West Texas at blue hour: tall floodlight towers behind the bleachers throw broad warm light through drifting dust, raked brown dirt floor, weathered grey wooden fences, plain unpainted steel bucking chutes on the right side of the arena, wooden stands packed with a local crowd in denim, flannel and cowboy hats. One bull rider about 24, ordinary sunburned face with short stubble, brown felt cowboy hat, tan leather vest over a faded blue denim shirt, plain dark-brown chaps, one tan leather glove on his right hand. One massive black bull with short curved horns and a thick hump. The same rider, outfit and bull appear in every shot.\n\n[Plot Summary]\nShot 1, 00:00-00:01.5: Extreme close-up inside the chute, long lens, low beside the bull's head. The bull's wet dark eye on the left of frame rolls toward the lens, its nostrils blast steam into the cool air, and it lurches so its horn bangs the steel bars.\nShot 2, 00:01.5-00:03: Macro from above the bull's back. The rider's gloved right hand lies palm-up under the flat braided bull rope; his left hand pulls the rope tight across the palm and his right fist closes hard around it, the leather creasing.\nShot 3, 00:03-00:05: Wide from the arena floor at dirt level, static, the chute gate at the right edge of frame. A gate man yanks the gate open and the bull explodes out into the arena moving right to left, front hooves slamming the dirt, the rider high on its back, a burst of dust rising behind.\nShot 4, 00:05-00:08: High-frame-rate slow motion, telephoto, low three-quarter side angle, panning right to left with the bull. The bull drops its head and kicks both hind legs high, body arched; a thick cloud of dust billows from the hooves and hangs glowing in the floodlight, and heavy clods of dirt arc up and fall back with weight. The rider stays seated, right fist locked in the rope, torso thrown back, free left arm high. Behind, the packed stands are a soft blur of people rising to their feet.\nShot 5, 00:08-00:10: Back to real speed, medium wide, handheld from the fence line. The arena horn blares; the rider pulls his hand free, swings his leg over and jumps clear, landing on both boots in a crouch, while the bull bucks on toward frame-left. Dust settles around him and the crowd in the stands behind him jumps up cheering, arms and hats in the air.\n\n[Audio Style]\nNatural arena sound only, no music. The bull's deep snort and the clang of horn on steel, the creak of the rope pulling tight, the bang of the chute gate, thunder of hooves on packed dirt, muffled stretched thuds in the slow-motion shot, the rider's grunt on each buck, a long blaring arena horn just before the jump, boots thumping into dirt, then the crowd erupting in cheers and whistles.\n\n[Camera Work and Core Constraints]\nFive shots; adjacent shots differ in scale and angle. The bull travels right to left from shot 3 to shot 5. The bull has correct anatomy, four legs and two horns, with heavy body weight in every landing. Dust rises, hangs and settles under gravity. Every spectator is a distinct person reacting to the ride. Natural photographic realism, fine grain, deep blue sky against warm dusty floodlight, real sunburned skin and worn leather, off-centre compositions.\n\n[Negative Prompt]\nmusic, subtitles, on-screen text, watermark, logos, sponsor banners", "inputs_expanded": []}, {"id": "28", "tier": "extended", "direction": "Crowd", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Стадион: волна и пять болельщиков", "summary_ru": "Сверху по стадиону бежит волна, потом она проходит через сектор, затем камера едет вдоль ряда из пяти болельщиков, у каждого своё действие. Ждём непрерывную волну, толпу без клонов и ровно пять разных действий.", "checks": [{"name_ru": "Волна непрерывна", "detail_ru": "Одна полоса вставших людей идёт по кругу в одну сторону с постоянной скоростью; не мигает и не возникает кусками."}, {"name_ru": "Толпа без клонов", "detail_ru": "Люди разные по лицам, одежде и движениям; нет повторяющихся копий и каши из тел."}, {"name_ru": "Волна в секторе", "detail_ru": "Ряды встают и садятся по очереди слева направо, синхронно с приходом волны."}, {"name_ru": "Ровно пять болельщиков", "detail_ru": "В финальном проезде пять человек в описанной одежде, никто лишний не занимает их места."}, {"name_ru": "Пять разных действий", "detail_ru": "Хлопки над головой, укус хот-дога, полотенце кругами, съёмка на телефон, крик в ладони — одновременно, без копирования соседа."}, {"name_ru": "Без надписей", "detail_ru": "На трибунах, поле и одежде нет логотипов, букв и номеров."}, {"name_ru": "Звук", "detail_ru": "Рёв нарастает с приходом волны и в секторе идёт слева направо; в конце крик «Let's go!»; без музыки и диктора."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second live-action crowd sequence, three shots, shot on 35 mm film. A packed open-air American football stadium at golden hour, warm low sun from frame-left, plain green pitch with white lines, grey concrete stands, no logos, letters or numbers anywhere on the stands, pitch or clothing. The crowd is made of thousands of distinct ordinary people in varied casual clothes.\n\n[Plot Summary]\nShot 1, 00:00-00:04: Extreme wide, top-down aerial from 150 m, the stadium bowl filling frame. A stadium wave rolls around the bowl counter-clockwise: one band of fans standing with arms raised, about one section wide, travels steadily while fans behind it sit back down; it covers about half a lap.\nShot 2, 00:04-00:06: Low wide from the aisle at eye level inside the stands, 24 mm. The wave arrives from frame-left and sweeps across the section to frame-right: each column of fans stands, throws its arms up and sits again in order.\nShot 3, 00:06-00:10: Medium, slow lateral dolly left to right along one row after the wave has passed, 50 mm. Five fans sit side by side, each doing a different action at the same time: fan 1, a grey-haired woman in a navy windbreaker, claps with her hands above her head; fan 2, a boy about ten in a yellow t-shirt, takes a big bite of a hot dog; fan 3, a heavy man in a plain green jersey, swings a plain white towel in circles over his head; fan 4, a young woman in a denim jacket, holds up her phone filming the pitch; fan 5, a bearded man in a red flannel shirt, cups his hands around his mouth and shouts \"Let's go!\" (in English). The camera comes to rest on fan 5.\n\n[Audio Style]\nNatural stadium sound only, no music and no PA announcer. Shot 1: a broad distant roar that swells as the wave travels. Shot 2: the cheer rises as the wave arrives and moves from the left channel to the right with it. Shot 3: close detail over the crowd bed: clapping, a crunchy bite, the whoosh of the towel, and the bearded man's shout \"Let's go!\" (in English).\n\n[Camera Work and Core Constraints]\nThree shots; each changes scale, angle and movement. The wave keeps one direction and constant speed in shots 1 and 2. Exactly five fans in shot 3, each with their own clothes and their own action, all happening at once. Every face in the crowd is a distinct person. Natural photographic realism, warm golden light, fine grain, off-centre compositions.\n\n[Negative Prompt]\nmusic, announcer voice, subtitles, on-screen text, watermark, logos, team names, jersey numbers", "inputs_expanded": []}, {"id": "29", "tier": "extended", "direction": "Found footage", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "4:3", "duration": "10s", "title_ru": "Дверная камера: енот крадёт посылку", "summary_ru": "Ночная ИК-запись дверного звонка одним неподвижным кадром: енот подходит, нюхает и утаскивает посылку по ступенькам, таймстамп идёт по секундам. Ждём честный бытовой ИК-вид, правильный счёт времени и вес посылки.", "checks": [{"name_ru": "Один неподвижный кадр", "detail_ru": "Камера не двигается, склеек нет, ракурс и фишай-искажение не меняются."}, {"name_ru": "Таймстамп идёт ровно", "detail_ru": "«2026-11-05 02:14:07» в начале и «02:14:17» в конце, секунды прибавляются ровно по одной в секунду, цифры не плывут."}, {"name_ru": "Надпись FRONT DOOR", "detail_ru": "Точно «FRONT DOOR» внизу справа, не меняется весь ролик."}, {"name_ru": "ИК-ч/б", "detail_ru": "Картинка монохромная без цвета, глаза енота светятся белым, шум и компрессия как у дешёвой камеры."}, {"name_ru": "Анатомия енота", "detail_ru": "Четыре лапы, полосатый хвост, маска; походка вразвалку, лапами держит край коробки."}, {"name_ru": "Вес посылки", "detail_ru": "Коробку тащат волоком, она наклоняется и стукается о две ступеньки; не телепортируется и не парит."}, {"name_ru": "Звук", "detail_ru": "Сверчки, шорох картона, стук на ступеньках, стрекот енота, шипение микрофона; без музыки."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second found-footage clip: real night recording from a cheap doorbell security camera, one fixed continuous shot, black-and-white infrared, 4:3. The camera is mounted beside a front door at chest height, looking down at a suburban wooden porch through a wide fisheye lens with strong barrel distortion. A medium plain cardboard parcel sits on the doormat in the centre of frame; three wooden steps lead down off the porch at the bottom left. Burned-in camera overlay: a white monospaced timestamp in the top-left corner reading \"2026-11-05 02:14:07\" at the start and counting up by exactly one second every second to \"2026-11-05 02:14:17\" at the end, and the label \"FRONT DOOR\" in the bottom-right corner.\n\n[Plot Summary]\nShot 1, 00:00-00:10, one continuous fixed shot:\n00:00-00:02: The empty porch in grainy infrared grey, the parcel on the doormat, a few insects flicking through the IR glow.\n00:02-00:04: A raccoon waddles in from frame-left along the porch, its eyes glowing bright white in the infrared, stops at the parcel and sniffs its corner.\n00:04-00:07: It grips the cardboard edge with its front paws and teeth and drags the parcel backward across the doormat; the box scrapes, tilts and slides to the top step.\n00:07-00:09: The parcel bumps down two steps; the raccoon pauses and looks straight up into the camera, eyes glowing.\n00:09-00:10: It hauls the parcel off the last step and out of view at the bottom left; the bare doormat remains.\n\n[Audio Style]\nNative doorbell-camera microphone sound, thin and compressed with faint digital hiss: crickets throughout, a distant dog bark, cardboard scraping on the mat, two hollow thuds as the parcel hits the steps, soft raccoon chittering, then crickets again. No music, no voices.\n\n[Camera Work and Core Constraints]\nOne fixed continuous shot, no cuts, no camera movement. Black-and-white infrared only, low resolution, compression blocks and sensor noise of a consumer security camera. The timestamp is the only changing text and advances exactly one second per second; \"FRONT DOOR\" stays fixed. The raccoon has correct anatomy: four legs, ringed tail, black face mask. The parcel has weight: it is dragged, tips and bumps, and stays the same box.\n\n[Negative Prompt]\nmusic, colour, subtitles, watermark, logos, extra text", "inputs_expanded": []}, {"id": "30", "tier": "extended", "direction": "Languages", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Два языка в одном разговоре", "summary_ru": "Двое в вокзальном кафе: она говорит по-английски с шотландским акцентом, потом переходит на испанский, он отвечает по-английски и затем по-французски, достаёт два билета. Ждём точные языки, акцент, липсинк и правильных говорящих.", "checks": [{"name_ru": "Язык каждой реплики", "detail_ru": "1 и 2 — английский, 3 — испанский, 4 — французский, дословно как в промпте."}, {"name_ru": "Шотландский акцент", "detail_ru": "Её английская реплика звучит с явным шотландским акцентом; его английский нейтральный американский."}, {"name_ru": "Произношение", "detail_ru": "Испанская и французская реплики звучат естественно, не английскими звуками."}, {"name_ru": "Липсинк", "detail_ru": "Губы совпадают со словами в каждом крупном плане."}, {"name_ru": "Говорящие не путаются", "detail_ru": "Каждая реплика у своего человека, голос у каждого постоянный во всех репликах."}, {"name_ru": "Ровно четыре реплики", "detail_ru": "Нет лишней речи, нет других языков, нет русского."}, {"name_ru": "Действие с билетами", "detail_ru": "Он хлопает по куртке и достаёт ровно два бумажных билета на последней реплике."}, {"name_ru": "Без субтитров", "detail_ru": "Нет субтитров и текста на экране."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second live-action dialogue scene, four shots, shot on 35 mm film. A small train-station café on a grey morning: a window table, two coffees in plain white cups, a departures board out of focus outside the window with no readable text. Speaker A: a Scottish woman about 35, auburn hair in a loose bun, freckles, green knit sweater, sitting on frame-left. Speaker B: an American man about 30, short black beard, navy canvas jacket with a chest pocket, sitting on frame-right. Ordinary faces with real skin texture. English is the main language; she switches to Spanish and he answers in French.\n\n[Plot Summary]\nShot 1, 00:00-00:02.5: Medium two-shot at table height, she on the left, he on the right. She looks up from her coffee and says, \"Right, have you got the tickets?\" (in English, strong Scottish accent).\nShot 2, 00:02.5-00:05: Close-up on him, over her shoulder, 85 mm. He blinks and says, \"Me? I thought you had them.\" (in English, neutral American accent).\nShot 3, 00:05-00:07.5: Close-up on her, reverse angle, 85 mm. She rolls her eyes, points at his jacket and says, \"¡No! Están en tu chaqueta.\" (in Spanish).\nShot 4, 00:07.5-00:10: Medium on him, slightly low. He pats his chest pocket, pulls out exactly two paper train tickets, grins and says, \"Ah, oui… les voilà.\" (in French).\n\n[Audio Style]\nClean dialogue with natural voices and accurate lip sync; each line spoken by its own speaker, exactly four lines and no other speech. Café room tone, a soft espresso-machine hiss, cups touching saucers, a train rolling in far away, the rustle of paper as he pulls the tickets out. No music, no station announcements.\n\n[Camera Work and Core Constraints]\nFour shots on a consistent 180-degree axis: she stays on frame-left, he on frame-right. Line languages exactly as written: lines 1 and 2 in English, line 3 in Spanish, line 4 in French; only she has the Scottish accent. Each line is short and lands fully inside its shot. Exactly two coffees and exactly two tickets. Natural soft window light from the left, real skin, fine grain, off-centre framing.\n\n[Negative Prompt]\nsubtitles, captions, on-screen text, music, watermark, logos", "inputs_expanded": []}, {"id": "31", "tier": "extended", "direction": "Nature", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Цветок → долина одним движением", "summary_ru": "Макро-таймлапс: бутон мака раскрывается, затем камера без склейки отъезжает и поднимается дроном над долиной, где бегут облака и их тени. Ждём правильную биологию цветения и бесшовный переход от макро к общему.", "checks": [{"name_ru": "Цветение по порядку", "detail_ru": "Зелёные чашелистики лопаются и опадают, мятые лепестки расправляются в чашу, видны тычинки; без морфинга."}, {"name_ru": "Таймлапс согласован", "detail_ru": "Цветок, свет, облака и тени меняются в одном ускоренном темпе."}, {"name_ru": "Один кадр", "detail_ru": "Переход от макро к виду с дрона — одно непрерывное движение, без склейки и растворения."}, {"name_ru": "Цветок на месте", "detail_ru": "При отъезде тот же цветок остаётся в той же точке и уменьшается, вокруг появляется поле."}, {"name_ru": "Параллакс и рельеф", "detail_ru": "Ближние склоны уходят быстрее дальних, долина и река не плывут и не перестраиваются."}, {"name_ru": "Тени облаков", "detail_ru": "Тени на земле совпадают с облаками и бегут в ту же сторону."}, {"name_ru": "Звук", "detail_ru": "Природный звук, без музыки."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second nature film, one continuous time-lapse shot with no cuts: it starts as a macro time-lapse of a single wild orange poppy blooming on a hillside and becomes an aerial drone shot rising over a wide green valley with moving clouds. Real photographic look.\n\n[Plot Summary]\nShot 1, 00:00-00:10, one continuous shot:\n00:00-00:04: Macro, static, side-low angle, the flower bud slightly right of centre against a soft green meadow, dawn light turning warm. In time-lapse the green sepal cap splits and falls away, four crinkled orange petals unfold and smooth out into an open cup, revealing the yellow stamens; dew on the petals evaporates as the sunlight warms.\n00:04-00:10: Without any cut the camera pulls straight back and climbs, the same poppy staying in the lower centre of frame and shrinking as a meadow of grass and scattered poppies appears around it; the camera keeps rising like a drone over the hillside and reveals a wide green valley with a winding river. Clouds race across the sky in time-lapse and their shadows sweep over the valley floor in the same direction. The shot ends high and wide.\n\n[Audio Style]\nNatural ambience only, no music: a soft bee buzz and light breeze in the grass close to the flower, opening into broad, airy wind and faint distant birds as the camera rises.\n\n[Camera Work and Core Constraints]\nOne unbroken shot: the macro becomes the aerial through one continuous pull-back and climb, with no cut and no dissolve. Time-lapse speed is constant: flower, light, clouds and shadows all change at the same accelerated rate. The flower blooms in correct botanical order. Correct parallax: near slopes move faster than far ones, and terrain stays fixed. Cloud shadows match their clouds. Natural colour, crisp detail, gentle stabilised motion.\n\n[Negative Prompt]\nmusic, subtitles, on-screen text, watermark, logos", "inputs_expanded": []}, {"id": "32", "tier": "extended", "direction": "First & last frame", "contrast": "—", "task_mode": "I2V-FLF", "aspect_ratio": "16:9", "duration": "8s", "title_ru": "Коридор → постер LOW TIDE", "summary_ru": "Один непрерывный проезд от первого кадра (коридор мотеля) к последнему (постер LOW TIDE): вода растекается по ковру, камера опускается к отражению двери, в дверь входит фигура. Ждём точные первый и последний кадр и переход от видимой причины, без кроссфейда.", "checks": [{"name_ru": "Первый кадр", "detail_ru": "Первый кадр совпадает с @Image1: коридор, мигающая лампа, мокрый ковёр, приоткрытая дверь."}, {"name_ru": "Последний кадр", "detail_ru": "Последний кадр совпадает с @Image2: фигура на затопленном полу, отражение двери, композиция постера."}, {"name_ru": "Переход от причины", "detail_ru": "Переход ведут вода и её отражение; нет кроссфейда, морфинга или затемнения."}, {"name_ru": "Без склеек", "detail_ru": "Одно непрерывное движение камеры."}, {"name_ru": "Текст LOW TIDE", "detail_ru": "Точно «LOW TIDE», как в @Image2, появляется только в последней секунде, буквы не плывут."}, {"name_ru": "Фигура входит физически", "detail_ru": "Фигура проходит через приоткрытую дверь и встаёт на воду, а не возникает из воздуха."}, {"name_ru": "Вода как вода", "detail_ru": "Вода растекается от двери, поверхность успокаивается и даёт стабильное отражение."}, {"name_ru": "Звук", "detail_ru": "Гул лампы, журчание воды, шлёпающие шаги фигуры, тишина на титуле; без музыки."}], "inputs": ["A_HALLWAY_FIRST", "A_LOWTIDE_LAST"], "reference_mapping": "@Image1 = A_HALLWAY_FIRST, the exact first frame (dim motel hallway, flickering ceiling light, wet carpet, door ajar at the far end). @Image2 = A_LOWTIDE_LAST, the exact last frame (LOW TIDE poster: lone figure on a flooded hallway floor reflecting a door, title LOW TIDE).", "prompt": "[Core Task]\n[Reference Mapping] @Image1 is the exact first frame: the dim motel hallway with the flickering ceiling light, wet carpet and the door ajar at the far end. @Image2 is the exact last frame: the LOW TIDE poster with a lone figure standing on a flooded hallway floor that reflects a door, and the title \"LOW TIDE\".\nAn 8-second horror film transition, one continuous camera move from @Image1 to @Image2 with no cuts and no dissolves. The transition is caused by something visible: water spreads from under the far door, floods the hallway and becomes the mirror surface of the poster.\n\n[Plot Summary]\nShot 1, 00:00-00:08, one continuous camera move:\n00:00-00:02: Start exactly on @Image1. The ceiling light flickers twice. A thin sheet of dark water slides out from under the ajar door at the far end and spreads toward the camera over the wet carpet, catching the light.\n00:02-00:04.5: The camera glides forward down the hallway and lowers to knee height, tilting slightly down. The water rises over the carpet; its surface goes still and mirror-like, reflecting the ceiling light and the far door upside down.\n00:04.5-00:06.5: The camera sinks to just above the water surface, the reflected door filling the lower half of frame. A lone figure steps through the ajar door and walks slowly onto the flooded floor, ripples spreading, then stands still as the ripples settle and the reflection sharpens.\n00:06.5-00:08: The camera settles exactly into the composition of @Image2. In the final second the poster typography of @Image2 appears, with the title \"LOW TIDE\" spelled exactly as in @Image2.\n\n[Audio Style]\nNative sound, no music: the electric buzz of the flickering tube, a slow trickle of water spreading, low room drone building, soft splashing footsteps as the figure walks in, ripples lapping, then near-silence on the title.\n\n[Camera Work and Core Constraints]\nOne unbroken camera move, no cuts, no crossfade, no morph between the two images: the water and its reflection carry the change. The first frame matches @Image1 and the last frame matches @Image2. The figure physically enters through the door. \"LOW TIDE\" appears only in the final second and is letter-perfect. Cold desaturated film look, real grain, motivated light from the ceiling fixture.\n\n[Negative Prompt]\nsubtitles, watermark, logos, extra text, music", "inputs_expanded": ["A_HALLWAY_FIRST", "A_LOWTIDE_LAST"]}, {"id": "33", "tier": "extended", "direction": "Animation: motion design", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Моушн-дизайн: SaaS-ролик", "summary_ru": "Плоский 2D-векторный ролик: круг превращается в карточку задач, курсор ставит три галочки, карточки становятся доской с графиком, всё собирается в заголовок «Ship it today.». Ждём чистую векторную графику, непрерывность форм и точный текст.", "checks": [{"name_ru": "Плоский 2D", "detail_ru": "Только плоские заливки и векторные формы; нет 3D, градиентов, фактур и фотореализма."}, {"name_ru": "Точный заголовок", "detail_ru": "Ровно «Ship it today.» — регистр, пробелы и точка; буквы не плывут."}, {"name_ru": "Нет другого текста", "detail_ru": "Строки в карточках — серые полосы-плейсхолдеры, без абракадабры и псевдобукв."}, {"name_ru": "Непрерывность форм", "detail_ru": "Каждый элемент вырастает из предыдущего (круг → карточка → три карточки → линия → текст); нет склеек и выскакиваний."}, {"name_ru": "Три галочки по кликам", "detail_ru": "Курсор кликает три чекбокса сверху вниз, галочка появляется ровно на каждом клике, ровно три."}, {"name_ru": "Три столбца графика", "detail_ru": "Растут три столбца слева направо: низкий, средний, высокий."}, {"name_ru": "Изинг", "detail_ru": "Движение плавное с овершутом и squash-and-stretch, без дрожи и рывков."}, {"name_ru": "Звук", "detail_ru": "Клики, попы и свуши точно на событиях; без музыки и голоса."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second flat 2D vector motion-design piece in a clean SaaS product style, like a polished app launch animation. Off-white background (#F6F4EF), navy ink (#1E2A44), coral (#FF6B57) and mint (#3DD6A3), solid flat fills only, rounded-corner UI cards with simple flat offset shadows, one geometric sans-serif typeface. Every element is born from the previous one, so the piece flows as one continuous animation. The only text in the film is the final headline \"Ship it today.\".\n\n[Plot Summary]\nShot 1, 00:00-00:02: A coral circle drops from the top of the off-white frame, bounces twice with squash and stretch, then stretches sideways and unfolds into a white rounded-corner card in the centre.\nShot 2, 00:02-00:04.5: The view scales smoothly into the card: a task list of three rows, each row a round checkbox and a grey placeholder bar instead of words. A navy arrow cursor glides in and clicks the checkboxes from top to bottom; a mint check mark pops into each box exactly on its click — three checks in total.\nShot 3, 00:04.5-00:07: The card splits into three cards that slide apart into a three-column board; in the right-hand card a bar chart grows three navy bars from left to right, short, medium and tall, each with a small overshoot, and a coral dot pulses once on the tallest bar.\nShot 4, 00:07-00:10: The three cards slide together and collapse into one thin navy line in the centre; the line becomes a text baseline and the headline \"Ship it today.\" rises onto it word by word, each word sliding up with a light overshoot, the coral circle dropping in last as the full stop. Hold the finished headline for the final 1.5 seconds.\n\n[Audio Style]\nCrisp, minimal UI sound design synced to every motion, sound effects only: two soft rubbery bounces, a paper-like swipe as the card unfolds, three crisp clicks each followed by a light pop, three rising ticks as the bars grow, three soft whooshes for the three words, and a small round thump as the full stop lands.\n\n[Camera Work and Core Constraints]\nFlat 2D vector animation only: solid colours and flat shapes only. Smooth ease-in-out with deliberate overshoot; motion stays clean with no jitter. Shape continuity: circle → card → three cards → line → headline, each element transforming out of the previous one. Exactly three check marks and three bars. Placeholder rows are plain grey bars. The headline reads exactly \"Ship it today.\" with the full stop. Generous negative space, off-centre balance in the middle scenes.\n\n[Negative Prompt]\nmusic, voice-over, subtitles, gibberish text, watermark, 3D render", "inputs_expanded": []}, {"id": "34", "tier": "extended", "direction": "Animation: retro OVA", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Ретро-OVA: мотопогоня в неоновом городе", "summary_ru": "Аниме конца 80-х на целлулоиде: курьер на белом мотоцикле уходит от двух полицейских дронов по эстакадам и прыгает через разводной мост на фоне луны. Ждём настоящую рисованную фактуру на двойках, а не гладкий 3D, и постоянство героини.", "checks": [{"name_ru": "Рисованный cel-look", "detail_ru": "Тушевой контур неровной толщины, плоская заливка с двумя жёсткими тенями, аэрограф на хроме, гуашевые фоны; не 3D и не цифровой глянец."}, {"name_ru": "На двойках и холды", "detail_ru": "Анимация дискретная, с держанием ключевых поз; нет плавной видео-интерполяции."}, {"name_ru": "Плёнка 80-х", "detail_ru": "Зерно, лёгкий gate weave, тёплая халация вокруг неона и фары."}, {"name_ru": "Постоянство героини и байка", "detail_ru": "Чёрное каре, оливковая куртка, кейс за спиной, белый байк с одной круглой фарой — одинаково во всех кадрах."}, {"name_ru": "Направление экрана", "detail_ru": "В кадрах 3–5 байк едет слева направо."}, {"name_ru": "Без надписей", "detail_ru": "Вывески — цветные блоки без букв, на байке и дронах нет текста."}, {"name_ru": "Механика", "detail_ru": "Колёса крутятся, руки на руле, наклон в повороте, дроны — диски с одним красным глазом."}, {"name_ru": "Звук", "detail_ru": "Мотор по передачам, шипение шин, вой дронов, тишина ветра на силуэте у луны; без музыки."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second hand-painted late-1980s Japanese OVA anime action scene, five shots cut in one continuous chase. Pure traditional cel animation photographed on 35 mm film: ink and paint on celluloid over hand-painted gouache background art, crisp hand-inked outlines of slightly varying weight, flat cel shading with two hard-edged shadow tones, airbrushed highlights on chrome and visor, animated on twos with held key poses, rich film grain, faint gate weave and warm halation blooming around every neon light and headlight. The world: a retro-futuristic American megacity at 2 a.m., stacked elevated concrete freeways between dark towers, wet asphalt reflecting magenta, teal and amber neon, a huge pale full moon low over the skyline; all signs are clean blocks of glowing colour with no lettering. The courier: a young woman with a short black bob, sharp dark eyes, a plain cropped olive flight jacket, black gloves, a small square delivery case strapped to her back. Her bike: a long, low white streamlined motorcycle with one round headlight and no markings. The pursuers: two flat matte-grey disc police drones, each with one red searchlight eye.\n\n[Plot Summary]\nShot 1, 00:00-00:01.5: The bike comes straight at the lens from low and slightly left, the round headlight flaring huge into camera in a hand-drawn starburst with warm halation, lane lines streaking past below.\nShot 2, 00:01.5-00:03.5: Close-up of the courier's face on the right third, three-quarter profile, wind whipping her hair back, the neon city smeared behind her in painted speed streaks; her eyes flick to the mirror as a red searchlight sweeps across her cheek.\nShot 3, 00:03.5-00:05.5: Wide from high above, the bike a small white streak in the lower left travelling left to right along the curving freeway, the two drones diving in from the upper right, red beams raking the road behind her.\nShot 4, 00:05.5-00:07.5: Low tracking shot alongside the rear wheel moving left to right, her gloved hand twisting the throttle, the bike leaning hard into the curve and the tyre throwing a sheet of water; a drone beam strikes the asphalt a metre behind in a burst of hand-drawn sparks.\nShot 5, 00:07.5-00:10: Wide silhouette from far below: the road ends at a raised drawbridge; the bike launches off the tilted span left to right and flies across the face of the enormous moon in solid black silhouette, hair and jacket streaming; hold the silhouette at the top of the arc.\n\n[Audio Style]\nSound effects only, no music: a high revving engine climbing through gears, tyre hiss on wet road, wind roar, the low electric whine of the drones, a sharp crack as the beam hits asphalt, the engine screaming as the bike leaves the ramp, then sudden near-silence of wind alone over the moon silhouette.\n\n[Camera Work and Core Constraints]\nFive shots; adjacent shots change scale and angle. Screen direction: the bike travels left to right in shots 3 to 5. The courier, her jacket, case and the white bike stay identical in every shot. Authentic hand-drawn 1980s cel frame: drawn on twos with holds, painted backgrounds, two-tone hard shadows, film grain and halation; strong graphic silhouettes and asymmetric compositions.\n\n[Negative Prompt]\n3D CGI, smooth digital shading, subtitles, on-screen text, watermark, logos, music", "inputs_expanded": []}, {"id": "35", "tier": "extended", "direction": "Animation: paper cut-out / watercolor", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Книжка-раскладушка: бумага и акварель", "summary_ru": "Самодельная книжка на столе: бумажный лис гонится за красным змеем по акварельному лесу, рука переворачивает страницу, слои складываются, на новом развороте ночное озеро. Ждём настоящую бумагу и акварель и физичное перелистывание.", "checks": [{"name_ru": "Материал — бумага", "detail_ru": "Видна толщина и срез картона, мягкие тени между слоями, акварель с затёками и зерном бумаги."}, {"name_ru": "Перелистывание физично", "detail_ru": "Страница гнётся одной плавной дугой, просвечивает, не проходит сквозь слои и не морфится."}, {"name_ru": "Слои складываются", "detail_ru": "Поп-ап деревья ложатся в корешок вместе с закрытием страницы; на новом развороте слои поднимаются."}, {"name_ru": "Тот же лис и змей", "detail_ru": "Оранжевый бумажный лис и красный змей одинаковы на обоих разворотах."}, {"name_ru": "Без текста", "detail_ru": "На страницах нет букв и псевдотекста."}, {"name_ru": "Рука", "detail_ru": "Пять пальцев, естественная кожа, хват за уголок."}, {"name_ru": "Бумажная механика", "detail_ru": "Лис едет по прорези и поворачивает голову на шарнире; без мультяшной деформации бумаги."}, {"name_ru": "Звук", "detail_ru": "Шелест и шлепок страницы синхронно, щелчки язычков; без музыки и голоса."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second paper cut-out and watercolour storybook animation, four shots, photographed for real like a tabletop stop-motion film. A handmade pop-up picture book lies open on an oak table in soft window light from frame-left. The pages are thick cold-press watercolour paper with visible grain and soft bleeding washes; the scenery and characters are cut-paper layers with real thickness, clean cut edges and soft shadows between rs. Warm natural window light, shallow depth of field, gentle stop-motion cadence.\n\n[Negative Prompt]\nmusic, narration, subtitles, text on pages, watermark, logos, 3D render", "inputs_expanded": []}, {"id": "36", "tier": "extended", "direction": "Location refs", "contrast": "—", "task_mode": "R2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Прогулка по квартире по 5 фото", "summary_ru": "Один непрерывный проход на стабилизаторе по квартире из пяти фото: прихожая, гостиная, кухня, спальня, ванная. Ждём верный порядок комнат, ничего выдуманного и смену шагов с дерева на плитку.", "checks": [{"name_ru": "Порядок комнат", "detail_ru": "Прихожая → гостиная → кухня → спальня → ванная, без пропусков и повторов."}, {"name_ru": "Комнаты как на фото", "detail_ru": "Мебель, окна, цвета и растения совпадают с каждым фото; ничего не выдумано и не исчезло."}, {"name_ru": "Один непрерывный кадр", "detail_ru": "Нет склеек, растворений и скачков камеры."}, {"name_ru": "Проёмы правдоподобны", "detail_ru": "Камера проходит только через двери и проёмы, геометрия связна, сквозь стены не проходит."}, {"name_ru": "Шаги по полу", "detail_ru": "Шаги звучат по дереву в прихожей, гостиной и спальне и по плитке на кухне и в ванной, смена ровно на пороге."}, {"name_ru": "Материалы пола", "detail_ru": "Дубовый паркет и белая плитка те же, что на фото, не меняют цвет и рисунок."}, {"name_ru": "Без искажений", "detail_ru": "Прямые линии стен и дверей не плывут, нет варпинга."}, {"name_ru": "Финал", "detail_ru": "Ролик заканчивается в проёме ванной с её видом, как на @Image5."}], "inputs": ["A_APT_1", "A_APT_2", "A_APT_3", "A_APT_4", "A_APT_5"], "reference_mapping": "@Image1 = A_APT_1 entry hall with oak floor (and first frame); @Image2 = A_APT_2 living room; @Image3 = A_APT_3 kitchen with white tile floor; @Image4 = A_APT_4 bedroom; @Image5 = A_APT_5 bathroom. Each image defines only its own room: layout, furniture, windows, colours, floor.", "prompt": "[Core Task]\n[Reference Mapp xt. The camera only passes through real doorways; walls and door frames stay straight and solid. Soft natural daylight from the windows, true colours, steady gimbal motion at constant height.\n\n[Negative Prompt]\nmusic, subtitles, on-screen text, watermark, logos, people", "inputs_expanded": ["A_APT_1", "A_APT_2", "A_APT_3", "A_APT_4", "A_APT_5"]}, {"id": "37", "tier": "extended", "direction": "Long take & counts", "contrast": "—", "task_mode": "T2V", "aspect_ratio": "16:9", "duration": "10s", "title_ru": "Официант с тремя тарелками, без склеек", "summary_ru": "Один ручной проход за официантом с ровно тремя тарелками через распашные двери из кухни к столу с тремя гостями. Ждём, что тарелок всё время три, двери качаются физично и звук меняется ровно на дверях.", "checks": [{"name_ru": "Ровно три тарелки", "detail_ru": "Всё время три тарелки: в правой руке, в левой руке и на левом предплечье; не появляются и не исчезают."}, {"name_ru": "Тарелки держатся", "detail_ru": "Тарелка на предплечье лежит устойчиво, еда не меняется, руки не проходят сквозь тарелки."}, {"name_ru": "Двери качаются", "detail_ru": "Он толкает створки плечом, они распахиваются и качаются обратно за камерой с весом и затуханием."}, {"name_ru": "Ровно три гостя", "detail_ru": "За круглым столом три гостя, никто не появляется и не исчезает."}, {"name_ru": "По одной", "detail_ru": "Ставит тарелки по одной: правая рука, левая рука, тарелка с предплечья; в конце три тарелки перед тремя гостями."}, {"name_ru": "Без склеек", "detail_ru": "Один непрерывный кадр с ручной камеры."}, {"name_ru": "Звук на дверях", "detail_ru": "Кухонный шум сменяется залом ровно в момент прохода через двери; без музыки."}, {"name_ru": "Руки и лицо", "detail_ru": "По пять пальцев, лицо официанта не меняется."}], "inputs": [], "reference_mapping": "", "prompt": "[Core Task]\nA 10-second live-action restaurant scene: one continuous handheld tracking shot with no cuts, following a waiter who carries exactly three plates the whole   const m = inputs[id];
  if (!m) return `<div class="in"><div><span>${esc(id)}</span></div></div>`;
  const media = m.kind==="image" ? `<a href="${esc(m.file)}" target="_blank"><img src="${esc(m.thumb||m.file)}" loading="lazy" alt="${esc(id)}"></a>`
    : m.kind==="video" ? `<video src="${esc(m.file)}" poster="${esc(m.thumb||"")}" controls preload="none" playsinline></video>`
    : `<audio src="${esc(m.file)}" controls preload="none"></audio>`;
  return `<div class="in">${media}<div><span>${esc(id)}</span><a href="${esc(m.file)}" download>скачать</a></div></div>`;
}
function render(){
  let html = "", tier = null;
  for (const i of items){
    if (i.tier !== tier){ tier = i.tier; html += `<tr class="sect"><td colspan="9">${tier==="core"?"Ядро — 20 главных сцен":"Расширение"}</td></tr>`; }
    const ins = i.inputs_expanded || [], o = open.has(i.id);
    html += `<tr class="r ${o?"o":""}" data-id="${i.id}">
      <td><span class="ar">▸</span></td><td class="n">${esc(i.id)}</td><td>${esc(i.direction)}</td><td>${esc(i.contrast||"—")}</td>
      <td class="m">${esc(i.task_mode)}</td><td class="f">${esc(i.aspect_ratio)}</td><td class="d">${esc(i.duration)}</td>
      <td class="t"><b>${esc(i.title_ru)}</b><br>${esc(i.summary_ru)}</td><td class="i">${ins.length?ins.length+" шт.":"—"}</td></tr>`;
    if (o){
      const ck = (i.checks||[]).map(c=>`<tr><td>${esc(c.name_ru)}</td><td>${esc(c.detail_ru)}</td></tr>`).join("");
      html += `<tr class="xr"><td colspan="9"><div class="xd">
        <div><h4>Промпт <button class="cp" data-c="${i.id}">Копировать</button></h4><pre>${esc(i.prompt)}</pre></div>
        <div><h4>Что проверяем</h4><table class="ck">${ck}</table>
        ${ins.length?`<h4>Инпуты</h4><div class="ins">${ins.map(card).join("")}</div>`:""}</div>
      </div></td></tr>`;
    }
  }
  document.getElementById("tb").innerHTML = html;
  document.querySelectorAll("tr.r").forEach(r => r.onclick = () => { const id=r.dataset.id; open.has(id)?open.delete(id):open.add(id); render(); });
  document.querySelectorAll(".cp").forEach(b => b.onclick = e => { e.stopPropagation();
    navigator.clipboard.writeText(items.find(x=>x.id===b.dataset.c).prompt).then(()=>{b.textContent="Скопировано";setTimeout(()=>b.textContent="Копировать",1200);}); });
}
render();
</script>
</body>
</html>
