const DATA = {"items": [{"id": "01", "tier": "Кино", "direction": "Кино · реальный кейс", "contrast": "Arena Zero", "task_mode": "R2V+blockout", "aspect_ratio": "21:9", "duration": "30s", "title_ru": "Один дубль: Ниса против циклопа в мясистом туалете", "summary_ru": "Тридцать секунд одним кадром: камера выходит из светящейся жидкости в стене, Ниса умывается после слёз, в зеркале к ней подходит ассасин в капюшоне с топором, удар, нырок, ответ локтем, ладонью и тремя ударами ногами, капюшон слетает, и в крупном плане впервые видно одноглазое лицо. Сложно: ни одной склейки, путь камеры по превизу до 0:23, логика независимых рук ассасина и раскрытие лица строго в 0:29.3.", "checks": [{"name_ru": "Ни одной склейки", "detail_ru": "Один непрерывный кадр с 0 до 30 с, включая нырок на 0:22, удары ногами и наезд на лицо. Без замедлений и ускорений."}, {"name_ru": "Камера по превизу", "detail_ru": "До 0:23 камера идёт строго по @Video 2: выход из жидкости через мембрану, проход к раковине, облёт, долгое удержание на зеркале, падение вниз вместе с Нисой. Серых болванок превиза в кадре нет."}, {"name_ru": "Руки Нисы пустые", "detail_ru": "Её клинки весь кадр в ножнах на бёдрах, она к ним не прикасается. Три удара ногами: в колено, восходящий в грудь, колесом в голову. Ладонь касается пола один раз."}, {"name_ru": "Топор и зеркала", "detail_ru": "Один топор, всегда в правой руке ассасина, его левая пустая. Первый удар застревает в латунной стойке зеркала, и зеркало остаётся перекошенным. Второй разбивает соседнее зеркало. Лезвие ни разу не касается Нисы."}, {"name_ru": "Лицо только в конце", "detail_ru": "Лицо в тени капюшона, на 0:27.6 капюшон слетает, до 0:29.3 голова отвёрнута. Затем в крупном плане: красная кожа с чёрными полосами, один янтарный глаз в стальном кольце, огромная безгубая ухмылка. Глаз ровно один."}, {"name_ru": "Никто не падает", "detail_ru": "Ассасин принимает оба удара стоя, не падает и не касается пола. Оба заканчивают в стойках примерно в полутора метрах друг от друга."}, {"name_ru": "Массовка и жидкость", "detail_ru": "Три гуляки уходят до того, как открывается дверь кабинки, дальше в комнате только двое. Жидкость за мембраной жидкая, течёт и плещется. Без реплик и музыки."}], "inputs": ["AZ12_char_AZ2_Nisa_v2", "AZ12_Video1", "AZ12_Video2", "AZ12_loc_AZ2_BarToilet_v1", "AZ12_char_AZ2_LowerPitCrowd_v2", "AZ12_Video3"], "reference_mapping": "@char_AZ2_Nisa_v2 = AZ12_char_AZ2_Nisa_v2 (Nisa sheet (front/back/face, bow, quiver, blades); tag inferred: ASSETS.txt lists it only by internal id 1e77e76c-…; 4467x2496; package file f9c541b2-5677-440d-87bd-987e024ce311.png); @Video 1 = AZ12_Video1 (hooded cyclops assassin identity video (5 s); tag inferred from content/order: ASSETS.txt says the tag is not confirmed; 1664x1248, 5.05 s; package file Video_1.mp4); @Video 2 = AZ12_Video2 (grey-box previz of the one-take camera path, 23.04 s = the prompt's \"0:00–0:23\"; tag inferred: ASSETS.txt says the tag is not confirmed; 1920x822, 23.04 s; package file Video_2.mp4); @loc_AZ2_BarToilet_v1 = AZ12_loc_AZ2_BarToilet_v1 (flesh-dome restroom (loc_AZ2_BarToilet_v1); tag inferred: ASSETS.txt lists internal id 9d7a74fa-…; 3120x1328; package file a30f9b8a-5398-4484-b463-397c08ddd46a.png); @char_AZ2_LowerPitCrowd_v2 = AZ12_char_AZ2_LowerPitCrowd_v2 (lineup of alien revellers; tag inferred: ASSETS.txt lists internal id b2db97a6-…; 3120x1328; package file 8e07843a-7ebc-4254-987c-c03539389f99.png); @Video 3 = AZ12_Video3 (third attached video (992x432, 30 s; an earlier low-res take of this shot); never referenced in the prompt text; label assumed; 992x432, 30.05 s; package file Video_3.mp4)", "prompt": "\n\nSCENE CONTEXT\n\nInside the living bar, in its fleshy toilet, @char_AZ2_Nisa_v2 , who has just been crying, washes her face alone at a sink. A hooded cyclops assassin, @Video 1 , approaches behind her with a single axe in his right hand. She sees his first attack in the mirror and ducks. She answers with her elbow, a palm strike and a kick, with empty hands only; his empty left hand catches her striking wrist while his right recovers the axe. His hands work at different times: a short intervention with the left, a weighted axe action with the right. She ducks his second cut and, from that crouch, answers with a rising turning kick and a hand-planted wheel kick that knock his head round but do not knock him down. The wheel kick tears his hood back off his head and throws his head round, away from us. The exchange ends with both of them on their feet in fighting stances, neither one beaten; the camera closes in on his turned-away head, and he turns it back into a close-up: for the first time we see his face.\n\n\n\n\nACTIVE REFERENCES\n\n@Video 2 — the camera path and its timing for 0:00–0:23 only, exactly as in this previz: the start inside the wall liquid, the long hold on the mirror and the drop to the floor at 0:22; where the previz ends, the same camera carries on in the same unbroken move as written below; its grey shapes, colours and lighting stay out.\n\n@loc_AZ2_BarToilet_v1 — the toilet, exactly as in the reference: an oval room under a dark flesh dome with a pale veined honeycomb ceiling and hanging sinew strands; a waist-high band of thin, watery, glowing yellow liquid held in a translucent elastic membrane round the whole wall, white clumps floating in it; along the left wall a row of pale shell-shaped sinks on dark stems with brass taps, each with a round brass-framed mirror on a stalk; on the right a free-standing row of dark metal-framed booths with pale arched doors; a round puckered hole in the far wall; a dark, wet, shining flesh floor.\n\n@char_AZ2_Nisa_v2 — Nisa: face, hair, body, costume, bow, quiver and blades, 100% matches the reference; her two blades stay sheathed at her thighs for the whole shot; she never touches their grips, and her hands stay empty in every frame.\n\n@Video 1 — the assassin: body, hooded cloak, armour and the design of the single axe exactly as in the reference. His face stays in the shadow of the hood until her last kick throws the hood back at 0:27.6, and then stays turned away from the camera until 0:29.3. One axe is present, held in his right hand throughout. His left hand carries no weapon or prop; it can intercept, release, grip and push. All left/right directions refer to each character's own body.\n\n@Video 1 — the assassin's face and head, exactly as in this reference, seen only from 0:29.3, when he turns his head back into the close-up: deep red skin with black tiger-like stripes, a bald head with two small horn ridges at the temples, one large amber-brown eye in the middle of the face set in a polished steel oval ring whose band wraps round the head, and under it an enormous lipless grin of big yellowed teeth stretching from cheek to cheek. Count of eyes: one.\n\n@char_AZ2_LowerPitCrowd_v2 — the revellers: only these eleven species.\n\n\n\n\nLOCATION MAP\n\nThe booths stand on the right side of the room, the sinks along the left wall. The camera enters through the wall beside the near end of the booth row. Nisa is at the nearest sink on the left, facing its mirror, her back to the room. The assassin waits in the far-left booth of the row, behind her back. The fight stays at the sinks. After turning from the mirror, Nisa stays between him and the sinks, facing him to the end; she never passes behind him. Her kicks rock him but do not move him far: he stays on his feet a short step out from the sinks. The final stand-off: Nisa with the sinks behind her, the assassin facing her about a metre and a half away on the open wet floor.\n\n\n\n\nFIRST FRAME\n\nThe lens is inside the wall band, in the glowing yellow liquid itself: clear watery yellow all around, white clumps drifting slowly past the lens, the pale translucent membrane just ahead with the blurred room beyond.\n\n\n\n\nFORMAT MODE\n\nOne continuous shot, 30 seconds, a single take.\n\n\n\n\nACTION TIMING\n\nShot 1 · 0:00–0:30 · 100° wide · one continuous shot\n\n0:00–0:03 — The camera glides forward through the yellow liquid, white clumps tumbling past, and out through the elastic membrane into the room, the skin stretching round the lens and closing behind it; ahead, the row of booths on the right, the sinks far across on the left. As the camera passes the near booth, its door swings open from the handle edge, and a drunk shaggy brown-furred tusked reveller stumbles out, hiccuping, fumbling with his belt, and wanders off out of frame to the right.\n\n0:03–0:07 — The camera glides across the room toward the row of sinks. At a far sink a small fly-headed reveller in a tan jumpsuit finishes washing his hands, shakes them dry and hurries out; beside him a tall red-scaled lizard-faced one in armour leans to his mirror, picks at his teeth with a claw, then shuffles out after him. At the nearest sink Nisa is bent over the shell basin, water running from the brass tap. She has been crying: her lashes are wet and the rims of her lids faintly pink, and her shoulders give one small shake as she scoops the running water over her face with both hands, again and again.\n\n0:07–0:13 — The camera arcs past the mirror stalk and the brass tap and comes round in front of Nisa in 3/4, her face in view, the booth doors behind her. She is still bent low, washing, so the whole row shows above her back. In the background the door of the far-left booth swings open from its handle edge, and a heavy hooded figure stands in the dark doorway, motionless, his hood turned toward her back, while she keeps washing. Nisa turns the tap off; the stream stops, the last drops fall. She straightens and lifts her head, her head and shoulders now covering that booth.\n\n0:13–0:22 — The camera swings round behind her, close over her shoulder, and holds on the round mirror: her face in the glass, sharp, and the room behind her soft. She looks at herself, alone with her grief: her chin trembles once, she presses her lips together and wipes a tear off her cheek with her thumb, then takes one slow steadying breath and her eyes firm up. Meanwhile, deep in the soft background of the mirror, a dark hooded shape approaches her back in short, deliberate grounded steps, his knees slightly bent and the axe low beside his right thigh. His empty left hand stays close to his body; his cloak follows each step and settles behind him. He grows larger in the reflection while she looks only at herself. At 0:21 he rises from the low approach immediately behind her, filling the mirror; his right hand lifts the axe high beside the hood, elbow still bent, while his left remains separate. Her eyes catch him in the glass and widen.\n\n0:22 — He commits to one abrupt right-handed diagonal cut with a short grounded weight shift. Nisa drops directly into a deep crouch and the camera drops with her, following the previz, in one fast but visible continuous descent of about half a second, the same mirror and its stalk staying in frame the whole way down: the axe passes through the space her head has just vacated and catches in the slender brass mirror stalk with a sharp crack. The stalk bends; the first mirror tips and hangs crooked. His right hand stays on the handle, his empty left remains clear of the axe. The miss carries his right shoulder forward; he must recover from that position.\n\n0:22–0:24 — Nisa answers immediately from the crouch, driving her elbow back into his lower torso as she begins to rise and turn toward him. His breath breaks and his body compresses over bent legs; he stays on his feet. Still turning, she drives the heel of her empty right palm up toward his chin; his empty left hand catches her right wrist in mid-strike, short of his face, while his right hand pulls the axe free along the bent stalk and brings it down to his right side. The two hands perform different actions at the same time. She keeps twisting against the wrist contact. Through 0:23, the camera completes the exact movement in the previz; only after that endpoint does its slow, low backward continuation begin, Nisa staying in frame every moment.\n\n0:24–0:26 — Nisa tears her wrist free and stamps a short kick into the front of his left knee. That leg dips; he catches his body over the right leg in one short recovery step, still holding the axe low on his right. He stays lower afterward, guarding the struck knee. His right hand delays the recovered axe for a fraction of a beat while his body settles onto the supporting leg; Nisa keeps moving and regains her footing after the kick. His right hand then sends the axe through a shorter rising diagonal cut toward her upper body. She immediately folds beneath it into a low crouch, knees deep, about one step in front of him. The completed arc strikes the glass of the next mirror behind her at shoulder height, shattering it. The blade never touches her. His empty left hand stays clear of this arc. After the arc finishes, his right arm visibly lowers the axe back outside his body toward his right hip, and his lowered chest is open in front of her.\n\n0:26–0:27 — Out of that crouch, without straightening first, Nisa answers with a rising turning kick. She presses her weight onto her left leg, and her hips turn a quarter toward her left; her right leg, almost straight, sweeps up from the floor in one wide rising arc across the front of her body. The top of her right foot meets the centre of his chest: his chest and hooded head snap back, and his torso is lifted upright off the guarded knee. Her right leg carries on past the height of her own head under its momentum, then swings down in front of her, and her right foot plants on the wet floor.\n\n0:27–0:28 — In the same flow she drops low again to her left side: her left palm slaps flat onto the wet floor beside her left foot, and with her weight on that hand and her right foot, her body tilts sideways over the planted hand as her left leg swings up in a rising wheel, knee extending. At 0:27.6 the sole of her left boot slams other planet, blue-black porous bone walls full of round dwelling holes and amber balconies, veined membranes overhead, stalls of white ribs and bone slabs under membrane domes, amber glow-sacs, a pink-purple path with a wet black channel, the giant's stall with a glowing dome, and a narrow side ALLEY opening right beside it. Nothing from Earth.\n\n\n\n\nTHE CROWD — the Lower Pit's underground black market in the slums, packed shoulder to shoulder, as dense as a festival crowd: 50 to 60 creatures in every frame, from bodies brushing the lens to the far depth of the street, no gap anywhere. Each of them is one named creature from the five creature sheets, with its own task for the whole clip, listed in THE CROWD LIST after the shots.\n\nTHE CROWD NEVER EMPTIES — every second of every shot, first frame to last. HALF of them stay at their spot and work the whole clip: traders behind counters, guards at doors, sitters on crates, eaters, gamblers. The other half keep moving the whole clip, each its own way and speed: across in both directions, toward and away from the camera, diagonally, stopping to haggle and walking on, climbing poles, flying overhead; as soon as one leaves the frame, another walks in. Nobody moves in step: big ones lumber and shoulder through, small ones dart and dodge, long-legged ones stride over the crowd, four-legged ones trot, slithering ones weave between feet. Nobody makes way for Leo and Nisa; they squeeze through. Far back in a dark wall hole, out of focus, two creatures mate, a slow blur nobody looks at. The thieves: two skinny dark-grey creatures with stolen bundles bolt right to left across the foreground; a bigger squat tusked trader charges after them between Nisa and Leo, shouting; all three run heavy, with real inertia.\n\n\n\n\nREFERENCES\n\n@v_char_az2_leo_v2_short LEO — exact identity, voice, costume, the vest with the glowing purple star. RIGHT arm ends above the elbow in a white bandaged stump; LEFT arm intact.\n\n@v_char_az2_nisa_v1_short NISA — exact identity, voice, costume: burgundy very high ponytail, oxblood bodice, crossed red belts with two scimitars sheathed at her hips.\n\n@loc_az2_lowerpitmarket_v1 THE LOCATION — never a keyframe; every shot is composed fresh. THE GIANT'S STALL IS IN IT: the glowing ribbed membrane-dome stall on the RIGHT side of the street, beside a heap of pale sand, with the black horned helmet sitting inside it — that is the giant's stall and that is the giant's helmet; Leo walks up to exactly that stall and that helmet.\n\n@Image 1 THE GIANT'S BREASTPLATE — exact look, gear of a colossal giant, huge; it is not a helmet.\n\n@prop_az2_hornedhelmet_v1 THE GIANT'S HELMET — exact look: blackened, battered iron; two long, thick, curved dark horns rising from the sides; a closed face-plate split down the middle with two narrow eye slits and rows of small breathing holes; a round riveted boss on each side; a jagged hole torn through the forehead between the horns, its torn metal edges bent inward. The reference shows the SAME helmet from two sides; it is one helmet, never two; its grey studio background never appears. There is exactly ONE helmet in the whole clip: the black horned helmet already standing in the glowing dome stall of @loc_az2_lowerpitmarket_v1 . It is never duplicated; no second helmet appears anywhere.\n\n@Image 2 THE GIANT'S BODY — exact look of the dismembered corpse and its insides, at a much bigger, colossal scale.\n\n@char_AZ2_LowerPitCrowd_v6 @char_AZ2_LowerPitCrowd_v7 @char_AZ2_LowerPitCrowd_v8 @char_az2_lowerpitcrowd_v9 @char_AZ2_LowerPitCrowd_v3 CREATURE SHEETS — five line-ups; each creature in THE CROWD is one figure from the sheet tagged in its line, exact species and anatomy. @char_AZ2_LowerPitCrowd_v5 — only the two butchers. The studio backgrounds and the line-up layout never appear.\n\n\n\n\nTHE CAST\n\nTHE DEAD GIANT (GROK), exactly @Image 2 — pale grey, hairy, COLOSSAL: TWICE as big as before, about twenty-four metres tall in life. SCALE: lying on his side he fills the whole floor of the alley from wall to wall and runs far out past the frame on both sides, a hill of grey flesh higher than the stall roofs; his shoulder alone is twice Leo's height; one arm is as long as two market stalls; his hand is bigger than a butcher; the two big butchers, standing beside him, reach only up to his lower ribs, small as ants on a beached whale, and climb on him to reach the higher cuts. He lies dismembered ON THE FLOOR of a narrow DARK ALLEY right behind his stall's counter: torso split open, greenish ribbed tubes and coiled guts, arms and legs cut into heavy segments, green fluid creeping.\n\nTHE TWO BUTCHERS, from @char_AZ2_LowerPitCrowd_v5 — a big BLUE-skinned monster and a big sandy-BEIGE-skinned monster work the body IN TURNS. While the BLUE one chops, the BEIGE one sits on a crate right beside the body and sharpens his heavy chitin axe on a whetstone, long rasping strokes, the scrape clearly heard; at the end of shot 3 he puts the stone away; in shot 4 it is his turn: he stands up and strikes. Every stroke punches through the skin into the meat and sticks; dark-green blood sprays and stays on the axes.\n\nTHE HELMET AND BREASTPLATE — the helmet is the one ALREADY STANDING in the location @loc_az2_lowerpitmarket_v1 : the black horned helmet inside the glowing ribbed membrane-dome stall on the RIGHT side of the street, on its low bone counter, beside a heap of pale sand, exactly where it is in the location reference and exactly its size there, looking exactly like @prop_az2_hornedhelmet_v1 , a deep axe hole through its forehead; beside it the huge black breastplate, exactly @Image 1 .\n\n\n\n\nSHOT 1 — 00:00–09.5 — ONE HANDHELD TAKE, 16 MM, NO CUT\n\n16 mm wide lens, about 95°, handheld, one continuous take with no cut.\n\n00.0–02.0: The shot opens LOW, the lens at knee height inside the packed crowd, already in the middle of a theft: the small blue hammerhead-shark kid @char_AZ2_LowerPitCrowd_v6 in a harness has his hand on a pouch at a big creature's belt and yanks it free. 1.0: off frame above, Nisa starts her line, in sync with her voice: \"Many of creatures you see here are fighters.\" (light, teasing) 1.2: the thief darts away between the legs, right past the lens, and is swallowed by the crowd. In the middle of Nisa's line the camera RISES from knee height to chest height, still in the same take, and finds Nisa @v_char_az2_nisa_v1_short and Leo @v_char_az2_leo_v2_short stepping out of the crowd and walking to the RIGHT, seen in PROFILE, deep inside the market of @loc_az2_lowerpitmarket_v1 : NISA in front, closer to the lens, waist up, finishing her line with a chin-flick at a passing fighter; LEO a step behind her. The camera starts tracking PARALLEL to the RIGHT beside them.\n\n02.0–05.6: the camera keeps tracking RIGHT beside them, both still in profile. 3.4: the two thieves dash right to left across the foreground; 4.2: the tusked trader charges after them between Nisa and Leo, shouting. Nisa does not turn her head; Leo flinches. 4.6–5.6: THE RED MONSTER, @char_AZ2_LowerPitCrowd_v8 , the huge red-skinned ogre in a black vest, walks straight at them through the crowd and does not make way; Nisa slips past his elbow, Leo squeezes round his belly, and he lumbers on behind them.\n\n05.6–07.2: they reach the giant's stall: the glowing ribbed membrane-dome stall on the RIGHT side of the street from @loc_az2_lowerpitmarket_v1 , beside the heap of pale sand, the black horned helmet sitting inside it exactly as in the location reference. THE SLOW RECOGNITION: Leo's eyes slide over the horned helmet in the dome stall as he walks, and he keeps walking — one step, two steps PAST it — slowing down, his brow knotting, something nagging at him. A silent thought dawns behind his eyes, lips closed, never voiced: wait… that thing… it's HIM. 6.6: he stops a couple of steps past the helmet and slowly turns his head back over his shoulder to look at it. Nisa does not notice; she walks on to the RIGHT and out of the frame, still talking. 7.0, Nisa, just out of frame to the right, in sync with her voice: \"And in the Pit… …nothing goes to waste.\" (sly)\n\n07.2–09.5: Leo slowly walks BACK to the helmet, step by step, his eyes locked on it, as if pulled; in the same take, without a cut, the camera circles round him BEHIND HIS BACK as he goes — it passes close behind his shoulders from one side of him to the other, his back and the back of his head filling the frame for a moment — and comes out on his other side, settling into a MEDIUM SHOT across the counter, so that at the end of the shot Leo is on the RIGHT and the helmet on the LEFT: Leo on the RIGHT of the frame, waist up, facing LEFT; on the LEFT of the frame, inside the glowing dome stall from @loc_az2_lowerpitmarket_v1 , on its low bone counter beside the heap of pale sand, the giant's horned helmet @prop_az2_hornedhelmet_v1 , blackened iron, two long curved horns, the split face-plate with its eye slits, the torn hole through its forehead, the same helmet and the same size as it stands in the location reference; the black breastplate @Image 1 beside it. 8.6: he stops right in front of the helmet, close, and stays there. Behind them the market keeps working, slightly soft. Leo stares at the helmet. The recognition sinks in: this is the helmet of Grok, the giant he killed in the Arena, the fight that took his arm. FEAR, not seriousness: his breathing stops; a FRIGHTENED face, not a serious one: his inner eyebrows lift and pull together, his upper eyelids rise so the whites show around his irises, his lips part and the corners of his mouth stretch back; his eyes fix on the axe hole; a bead of sweat at his temple; his stump twitches; his body shrinks back from the helmet without his feet moving. PRESSURE: a weight settles on him — his shoulders sink and draw up, his chest tightens, he swallows hard, the din of the market seems to close in around him.\n\n\n\n\nSHOT 2 — 09.5–11.0 — DETAIL: THE HELMET FROM BELOW\n\nHard cut. 12 mm, the lens low at the edge of the bone counter, looking UP at the one helmet from the dome stall, @prop_az2_hornedhelmet_v1 : the iron face-plate, the eye slits, the two long horns rising against the membranes and the swinging glow-sac, the jagged axe hole through the forehead, scratched and dented iron, old dark blood dried in the seams. The swinging glow-sac slides a pool of amber light across it, and a bright specular GLINT jumps and skips across the helmet's polished iron — over a horn, along the face-plate, into the rim of the axe hole and back — dancing with every swing of the glow-sac. 10.0, Nisa, off frame nearby, her voice close: \"Weapons. Ammo… Bodies. Limbs.\" (playful list)\n\n\n\n\nSHOT 3 — 11.0–15.0 — THE SAME MEDIUM: THE BODY IN THE DEPTH\n\nHard cut back to the same MEDIUM as at the end of shot 1: Leo @v_char_az2_leo_v2_short on the RIGHT, waist up, facing the helmet on the LEFT. Far away in the depth, BETWEEN them, out of focus: the narrow DARK ALLEY behind the stall, lit only by a swinging glow-sac, and on its floor the giant's COLOSSAL body @Image 2 , a grey mountain of flesh filling the alley from wall to wall, being chopped up by THE TWO BUTCHERS — the BLUE one chopping at the giant's arm, stroke after stroke, his axe blade, soft and out of focus far away, catching the swinging glow-sac on every swing and throwing bright glints and lens FLARES straight into the camera, flare after flare streaking across the frame; the BEIGE one on a crate beside the body sharpening his axe on a whetstone, long rasping strokes, the scrape loud and clear. 12.8, Nisa, off frame nearby, her voice close: \"They'll find a use for anything. And it all comes from different worlds.\" (airy, proud) 13.6: the FOCUS pulls from Leo and the helmet to the far alley, landing on an axe strike: the BLUE one's blade slams into the giant's shoulder, green blood bursting. 14.0–15.0: Leo, soft now in the foreground, turns his head and shoulders toward the body in the depth and sees what is being done to Grok. 14.6: the BEIGE one stops sharpening and tucks the whetstone into his belt.\n\n\n\n\nSHOT 4 — 15.0–20.0 — THE AXE SHOT: THE BODY IN THE FOREGROUND, LEO BEYOND\n\nHard cut. The shot opens on an axe already coming down. Low on the far side of the corpse, the lens a hand's width from the body. FOREGROUND, colossal, the whole shot: the giant's hairy shoulder and arm @Image 2 , a wall of grey flesh filling the lower half and the left of the frame, the butchers small against it, and the two butchers taking their turns, as before. 15.0–17.4, THE BLUE ONE: he chops at the giant's arm where it joins the shoulder — 15.0, 15.8, 16.6 — each blade punching through the skin into the meat with a wet thud, sticking, wrenched out with a sucking jerk, green blood strings snapping and flying. 17.4: the last stroke cuts through the bone; he drops the axe, grabs the huge severed arm with both hands, braces a foot on the corpse and RIPS it away, the last sinews and skin tearing loose in long green strings, and hauls the heavy arm off out of frame. 15.0–17.4, THE BEIGE ONE, close beside him: he sits on his crate, axe gripped in both hands, the whetstone in his belt, waiting his turn. 17.6: his turn — he stands up, swings the axe high over his head with both hands and at 18.4 slams it down into the giant's shoulder; the blade bites deep and sticks, green blood bursting; he wrenches it out and at 19.4 strikes again. Beyond the axes, small and whole: Leo @v_char_az2_leo_v2_short , standing, his body turned to the RIGHT, his face turned toward the giant's body; behind him the street packed with the creatures of THE CROWD at their tasks. CAMERA: slow counter-clockwise orbit along the corpse, a jolt on every stroke. Focus: Leo. THE FEAR: seeing the colossal giant he killed being butchered like meat, Leo understands that this is what happens down here, and that he will die here too. Fear takes him, open and visible, a scared young man, not a stern one: a FRIGHTENED face, not a serious one: his inner eyebrows lift and pull together, his upper eyelids rise so the whites show around his irises, his lips part and the corners of his mouth stretch back; his eyes widen and stay wide, his breath goes short and fast, sweat breaks at his hairline, the colour drains from his face, his LEFT hand closes tight over his stump, he takes half a step back. The PRESSURE crushes him: the whole market seems to press in on him, his shoulders hunch, his chest heaves with short shallow breaths he cannot fill, his lower lip trembles, his eyes dart from the body to the butchers and back and then round the crowd as if looking for a way out, his LEFT hand shaking on his stump. 18.0, very quietly, barely above a breath, in sync with his lips: \"This is just… …fucked up.\" (hushed, thin, cracking with fear) 19.0–20.0: he turns back toward the helmet.\n\n\n\n\nSHOT 5 — 20.0–25.0 — FROM INSIDE THE HELMET, THROUGH THE AXE HOLE\n\nHard cut. The camera is INSIDE the giant's helmet, the one helmet from the dome stall, looking out through the jagged axe hole in its forehead: the dark inner iron of the helmet fills the edges of the frame, black and close, and the hole is a ragged opening in it. Through the hole: Leo @v_char_az2_leo_v2_short , close, framed from the CHEST UP, facing the helmet, the market soft behind him. Close on his face through the hole: a FRIGHTENED face, not a serious one: his inner eyebrows lift and pull together, his upper eyelids rise so the whites show around his irises, his lips part and the corners of his mouth stretch back, his eyes wide, his chin quivering, sweat on his upper lip. 22.0, terrified, very quiet, a barely audible whisper, his breath shaking, in sync with his lips: \"I'm\" mini pause \"gonna die here.\" 23.0–25.0: he turns fully to the LEFT: first his body turns, then his head follows, until he faces away to the left, toward Nisa, off frame.\n\n\n\n\nSHOT 6 — 25.0–30.0 — NISA, AND THE DARK\n\nHard cut. 12 mm, handheld, at Leo's eye height, from where he stands: Nisa @v_char_az2_nisa_v1_short a few steps away, waist up, facing him, both thumbs hooked in her crossed belts; Leo's shoulder soft at the edge of the frame. Behind her the packed crowd of THE CROWD, every creature busy with its own task. 25.0–27.0: she sees his face, the smirk drains away; at 25.8 she says calmly, in sync with her lips: \"Not exactly…\" (serious, steady) 27.0–28.0: a faint lopsided half-smile and a nod toward the street; 27.2: \"C'mon.\" (soft, low) 28.0: she turns to go into the crowd. 28.4–30.0: a huge dark creature of the crowd walks across right in front of the lens; its body covers the lens completely and the frame goes DARK; it stays black to the last frame.\n\n\n\n\nTHE CROWD LIST — each creature below is one figure from the sheet tagged in its line, exact species and look; it does its task the whole clip, from the first frame to the last, in every shot where its part of the street is seen. [STAYS] = works at its spot; [MOVES] = keeps moving.\n\n1. THE RED MONSTER @char_AZ2_LowerPitCrowd_v8 — the huge red-skinned ogre in a black denim vest and grey trousers [MOVES]: from 4.6 walks straight at Nisa and Leo down the street and does not make way; then shoulders on through the crowd behind them, small ones scattering.\n\n2. @char_AZ2_LowerPitCrowd_v8 the grey hammerhead-shark butcher in a maroon apron with a padlocked chain [STAYS]: at the meat stall right next to the giant's stall, hacks small carcasses on a bone block, cleaver rising and falling.\n\n3. @char_AZ2_LowerPitCrowd_v8 the green-shelled crustacean [MOVES]: drags a heavy net bag of shells and scrap along the street, stooping to pick up more.\n\n4. @char_AZ2_LowerPitCrowd_v8 the grey shark-headed brute in chainmail with a tooth belt [MOVES]: the boss's collector; lifts a small vendor by the collar, takes his tokens, drops him and moves on to the next stall.\n\n5. @char_AZ2_LowerPitCrowd_v8 the tiny brown furry critter [MOVES]: scurries up and down the stall poles, snatching tokens off counters.\n\n6. @char_AZ2_LowerPitCrowd_v8 the ochre crested lizard gladiator in a scale vest and leather kilt [STAYS]: on a crate, flexes and shows his scars while a knot of creatures bets tokens on him.\n\n7. @char_AZ2_LowerPitCrowd_v8 the creature in a coffin-like metal shell on mechanical feet [MOVES]: a walking strongbox; stops, opens its hatch, sells something from inside, shuts it and walks on.\n\n8. @char_AZ2_LowerPitCrowd_v6 the huge teal ogre with a red chest plate and red canisters on his shins [MOVES]: refuels the glow-sac lamps from his shin canisters, stall after stall.\n\n9. @char_AZ2_LowerPitCrowd_v6 the grey stalker in an antlered deer-skull mask [STAYS]: at the alley mouth beside the giant's stall, hangs fresh pelts and skulls on hooks and sells them.\n\n10. @char_AZ2_LowerPitCrowd_v6 the floating purple sphere of tentacles and orange eyes [MOVES]: drifts slowly over the crowd at head height, eyes swivelling.\n\n11. @char_AZ2_LowerPitCrowd_v6 the tall black saucer-headed creature on needle legs [MOVES]: a courier striding high over the crowd with a parcel, stepping over the small ones.\n\n12. @char_AZ2_LowerPitCrowd_v6 the dark-blue squid-headed creature on tentacle legs [STAYS]: sells squirming eels out of a bucket, holding them up to buyers.\n\n13. @char_AZ2_LowerPitCrowd_v6 the small blue hammerhead-shark kid in a harness [MOVES]: a pickpocket; shot 1 opens low on him: in the first second he snatches a pouch off a big creature's belt and darts away between the legs past the lens; then keeps weaving between legs, lifting pouches.\n\n14. @char_AZ2_LowerPitCrowd_v6 the huge white-masked cyber-brute in grey armour [STAYS]: bouncer at the dark door of a gambling den, arms crossed, shoving a drunk away.\n\n15. @char_AZ2_LowerPitCrowd_v7 the huge green three-eyed ogre with a fur collar [STAYS]: at a food stall, gnaws a whole roasted leg, grease dripping, tossing the bones.\n\n16. @char_AZ2_LowerPitCrowd_v7 the hunched green mech-armoured gorilla with a small pale face in its helmet [MOVES]: carries heavy crates from a cart to a stall, one after another.\n\n17. @char_AZ2_LowerPitCrowd_v7 the small lavender pointy-eared alien in a padded suit [STAYS]: sells scrap tech out of his open backpack on the ground, showing off a sparking gadget.\n\n18. @char_AZ2_LowerPitCrowd_v7 the slim black eel-skinned punk with a spiked crest [MOVES]: slides through the crowd passing tokens from hand to hand.\n\n19. @char_AZ2_LowerPitCrowd_v7 the purple stilt-legged alien with a hammer head and eye-stalks [MOVES]: stalks high above the crowd, peering into the balconies.\n\n20. @char_AZ2_LowerPitCrowd_v7 the small trunk-snouted creature in a brown robe [MOVES]: sweeps rubbish into the wet channel with a bone broom.\n\n21. @char_AZ2_LowerPitCrowd_v7 the grey tusked troll with a mohawk and scale armour [STAYS]: drinks from a barrel against the bone wall, belches, drinks again.\n\n22. @char_az2_lowerpitcrowd_v9 the huge red-furred pig-faced many-eyed ape with an iron collar [STAYS]: sorts hides and stacks them into a tall heap at his stall.\n\n23. @char_az2_lowerpitcrowd_v9 the grey ram-horned ogre in scale armour [STAYS]: arm-wrestles challengers on a barrel, slamming hand after hand down.\n\n24. @char_az2_lowerpitcrowd_v9 the bird-legged creature in a conical hat with red feathered wings [MOVES]: hops along the street selling skewers of roasted bugs.\n\n25. @char_az2_lowerpitcrowd_v9 the boar-headed muscle brute with a fur collar and a gold chain [MOVES]: struts through the market with two small hangers-on.\n\n26. @char_az2_lowerpitcrowd_v9 the tall brown mantis [MOVES]: goes stall to stall tasting samples with its mouthparts and spitting them out.\n\n27. @char_az2_lowerpitcrowd_v9 the green four-legged creature with a split, flower-like mouth [MOVES]: a living taxi trotting along with two small riders on its back.\n\n28. @char_az2_lowerpitcrowd_v9 the small moss-covered creature [STAYS]: sells glowing fungi plucked from its own back.\n\n29. @char_AZ2_LowerPitCrowd_v3 the huge blue stitched brute with bolts in his neck, a chain and padlock and a black vest [MOVES]: carries a whole carcass on his shoulder away along the street.\n\n30. @char_AZ2_LowerPitCrowd_v3 the bright-green tentacled creature riding in a walking mechanical frame [MOVES]: clanks along the street, the frame's arms loaded with sacks.\n\n31. @char_AZ2_LowerPitCrowd_v3 the pale pink many-eyed blob carried on black mechanical spider legs [MOVES]: a rich buyer picking its way slowly from stall to stall.\n\n32. @char_AZ2_LowerPitCrowd_v3 the blue shark-faced humanoid in bone-grey armour [STAYS]: a weapon seller testing blade after blade with his thumb.\n\n33. @char_AZ2_LowerPitCrowd_v3 the small round grey hooded creature with many black eyes [STAYS]: sits on a crate counting tokens into a pouch.\n\n34. @char_AZ2_LowerPitCrowd_v3 the thin grey crescent-headed creature in tattered robes [STAYS]: a beggar holding out a bowl to everyone who passes.\n\n35. @char_AZ2_LowerPitCrowd_v3 the lean reptile in black-and-orange armour [MOVES]: a guard patrolling the street, head turning, hand on his belt.\n\n\n\n\nLIGHT — low-key: cold blue-grey light through the membranes, amber pools from glow-sacs; one glow-sac swings over the stall, a moving pool on the helmet and the corpse; the guts are the only sickly green.\n\n\n\n\nLIVE-ACTION — Leo and Nisa are real human actors; every creature is a real, physical being: prosthetics, animatronics, puppetry, wet eyes, real fabric, matte skin.\n\n\n\n\nPERFORMANCE — Leo: a coward performing confidence; two clear beats: first he walks past the helmet, slows, RECOGNISES it — wait… it's him — and slowly walks back and stops in front of it; then he SEES Grok's colossal body butchered and understands he will die here, and fear takes over; from the helmet on he is under heavy pressure, the fear growing shot by shot, and he speaks only i e_ru": "Last Call: один дубль 30 с через шесть пространств", "summary_ru": "Пьяного Лео выводит вышибала Оуэн из клуба, на улице перед рассветом его чуть не сбивает такси с Девом за рулём, он добирается до квартиры, включает свет и падает спать. Ждём настоящий непрерывный дубль через дверные проёмы, свет со своей причиной в каждом пространстве, честное торможение такси и реплики у правильных ртов.", "checks": [{"name_ru": "Без склеек", "detail_ru": "Один непрерывный дубль 30 с; каждый переход — камера физически проходит дверной проём, рама проплывает мимо; нет телепортов, затемнений и вип-панов."}, {"name_ru": "Порядок пространств", "detail_ru": "Клуб → УФ-коридор → улица → подъезд → прихожая → гостиная; ни одно не пропущено и не повторено."}, {"name_ru": "Свет по причинам", "detail_ru": "Стробы примерно дважды в секунду и лазеры в клубе, только УФ в коридоре, на улице горят фонари и витрины как на рефе, небо над крышами бледнеет; слабая лампа в подъезде, почти темнота в прихожей, тёплый свет только после щелчка выключателя; окно и улица за ним не меняются."}, {"name_ru": "Такси на грани", "detail_ru": "Такси видно метрах в двадцати с момента, как Лео сходит с бордюра; тормозит около секунды со скрипом и клевком носа, качается на подвеске и стоит в шаге от его колен; Лео в правой трети кадра; никого не сбивает."}, {"name_ru": "Пьяная походка", "detail_ru": "Лео всё время пьян: быстро и неуклюже кренится вперёд, шатается, но не бежит; успевает все проходы без телепортов."}, {"name_ru": "Операторская логика", "detail_ru": "Ручная камера держит ровную дистанцию; сторону меняет только в дверях и у такси; дверь на улицу открывается толчком спины оператора в штангу."}, {"name_ru": "Роли и лица", "detail_ru": "Лео = CH_LEO, вышибала = CH_OWEN, таксист = CH_DEV только в машине на месте водителя."}, {"name_ru": "Реплики", "detail_ru": "Пять реплик дословно у правильных ртов: «Easy, big guy...», «Out.», «Are you blind?!...», «Relax, relax!», «Aaah, no, no, no...»."}, {"name_r , keeping Leo and the driver's window in frame. Dev leans out of the driver's window: \"Are you blind?! Get out of the road!\" (in English)\n00:17.5-00:21: Leo squints into the headlights, waves him off: \"Relax, relax!\" (in English), lurches around the bumper to the far sidewalk, pulls open the glass door of his building and stumbles inside; the camera follows right behind him through the doorway.\n00:21-00:23.5: The building hallway of @Image6, very dark under one weak ceiling light. His door is the first on the left, right inside the entrance; he shoulders it open and walks in, the camera following through the doorway; the door swings shut behind the camera and cuts off the hallway light.\n00:23.5-00:26.5: The entry hall of @Image7, almost pitch black, faint blue window glow ahead from the living room doorway. He slaps the light switch right beside the door frame: the brass floor lamp of @Image8 comes on and fills the living room with warm light, while the window and the street outside stay exactly as they were. He covers his eyes with both hands: \"Aaah, no, no, no...\" (in English)\n00:26.5-00:30: He takes two steps into the room and falls face-down onto the sofa of @Image8, asleep at once, snoring. The camera stops in the doorway, ending on a gently swaying medium shot of him asleep.\n\n[Audio Style]\nDiegetic sound only: booming club music on the dance floor, muffled in the corridor and cut off by the door slam; then a quiet street with early birds and distant traffic, the taxi engine approaching, a one-second tyre screech, the hallway hum, a door click, a switch click, a snore. All lines in English with American accents, each lip-synced to its speaker. No score.\n\n[Camera Work and Core Constraints]\nOne unbroken handheld take, 24 mm, every space change through a visible doorway. Light always comes from a visible source in the current space: strobes and lasers, UV tubes, streetlights and shop windows under a paling sky, one weak bulb, darkness, then the floor lamp after the switch click. Leo matches @Image1, Owen @Image2, Dev @Image3 and only inside the taxi; each place matches its reference. Photoreal, 35 mm film look, natural colour that follows each space's own light, natural human eyes under every light.\n\n[Negative Prompt]\nsubtitles, on-screen text, watermark, background score, readable signs", "old_id": "40", "inputs_expanded": ["CH_LEO", "CH_OWEN", "CH_DEV", "LO_CLUB", "LO_STREET_NIGHT", "LO_HALLWAY", "LO_APT_1", "LO_APT_2"]}, {"id": "05", "tier": "Кино", "direction": "Кино · реальный кейс", "contrast": "Arena Zero", "task_mode": "R2V", "aspect_ratio": "21:9", "duration": "20s", "title_ru": "Арена: Ниса отбивает четыре выстрела Элии", "summary_ru": "Двадцать секунд вплотную на дне арены днём: Ниса раз за разом сбивает ствол Элии и добивает локтями, коленями и подсечками, все четыре выстрела мимо, в конце она коленом прижимает руку с винтовкой стволом в небо. Сложно: непрерывный клинч на шесть планов с 5–7 контактами в каждом, одно точное замедление и выстрелы с отдачей. Промпт на китайском.", "checks": [{"name_ru": "Четыре промаха по порядку", "detail_ru": "Выстрел у самого уха, выстрел вверх, выстрел в песок под ногами, выстрел в стену после кувырка. Ни одна пуля не попадает в Нису."}, {"name_ru": "Одно замедление", "detail_ru": "Только первый выстрел во втором плане замедлен примерно в 8 раз на полсекунды, потом резкий возврат в реальное время. Других замедлений нет."}, {"name_ru": "Оружие в нужных руках", "detail_ru": "У Нисы в правой руке изогнутый клинок, левая пустая и держит запястье противницы. У Элии в правой винтовка с крылообразным лезвием по @prop_cicada-rifle-elia-2_v1. Оружие не переходит из рук в руки и не меняет форму."}, {"name_ru": "Удар каждого выстрела", "detail_ru": "Вспышка освещает оба лица, взрывная волна откидывает волосы и песок, кадр вздрагивает, отдача подбрасывает руку, после выстрела полсекунды глухо и звенит в ушах."}, {"name_ru": "Пуля по рефу", "detail_ru": "Маленький чёрный ш  deep-sea station corridor, with its bulkheads, the pipes and valve wheels running along the right side of the ceiling, the cable runs, the line of four round ceiling lamps and the round hatch at the far end. @Image3 is the prop: the yellow emergency lantern with its black handle and base and its clear ribbed lens that glows warm white all around, its exact shape and colours. Reproduce each reference exactly; @Image2 is the one and only location.\nLive-action survival scene, one continuous 20-second shot with no cuts. The corridor of @Image2 is a compartment of a research station on the ocean floor that starts to flood. Owen from @Image1 is alone in it, working at a wall console halfway down the corridor, facing the far end; the round hatch is about five metres ahead of him and stands half open, a dark gap at its edge with dim white light beyond. The yellow lantern from @Image3 hangs switched off from a bracket on the left wall beside him.\n\n[Plot Summary]\nShot 1 (one continuous take), 00:00-00:20:\n00:00-00:02.5: Medium shot from behind Owen's right shoulder at the console, the corridor and the hatch ahead. A thick pipe on the left wall bursts at a welded joint with a bang; a white high-pressure jet of seawater blasts horizontally across the corridor and slams into the right wall, spraying back in a fan. He flinches and turns toward it.\n00:02.5-00:05.5: The split in the joint tears wider with a groan and the jet thickens into a roaring torrent that churns the floor water white. The spray reaches the ceiling wiring and the round ceiling lamps short out one at a time, nearest first, each with a spark, about one second apart, each leaving the corridor darker, until only the dim light through the gap of the half-open hatch remains. Water spreads across the floor and climbs past his ankles.\n00:05.5-00:08.5: In the near-dark he pulls the yellow lantern from its bracket and presses its switch; its clear lens lights up warm white and throws a pool of light around him. анжевый язычок на пятке; надписи только как на рефах."}, {"name_ru": "Детали целы", "detail_ru": "Ровно четыре детали всё время: подошва, верх, шнурки (летят одним куском, уже зашнурованные крест-накрест) и оранжевый задник; ничего не появляется из воздуха; собранный кроссовок идентичен исходному."}, {"name_ru": "Звук", "detail_ru": "Свуши по траекториям, мягкие щелчки сборки, удар на финальной сборке, ритм по склейкам; без музыки."}], "inputs": ["BO_PRODUCT", "PR_SNEAKER_1", "PR_SNEAKER_2", "PR_SNEAKER_3", "LO_STUDIO"], "reference_mapping": "@Video1 = BO_PRODUCT (grey-box blocking previs: cuts, camera, part trajectories and timing); @Image1–@Image3 = PR_SNEAKER_1..3 (three photos of the same STRIDE ONE sneaker); @Image4 = LO_STUDIO (white cyclorama studio)", "prompt": "[Core Task]\n[Reference Mapping] @Video1 is a grey-box 3D blocking previs: it controls camera path, framing, timing, positions and trajectories; the grey boxes become the sneaker parts and the studio from the images; nothing grey remains. @Image1–@Image3 are three photos of the same product, the STRIDE ONE running sneaker: off-white knit upper, gum sole, orange heel tab; they fix every material, colour and any lettering. The grey part boxes become its real parts: the sole box becomes the gum sole, the upper box the off-white knit upper, the row of lace bars the laces, the heel-tab box the orange heel tab. @Image4 is the white cyclorama studio; the grey set becomes it and the grey turntable pedestal becomes a matte white plinth.\nA 15-second photoreal product deconstruction that re-renders @Video1 exactly, with hard cuts about every 1.5 seconds. Match @Video1 frame by frame: the same camera path, lens feel, framing, cuts and timing, the same positions, trajectories and speeds, and every contact on the same frame as in @Video1. The times below describe the beats of @Video1; where they differ, @Video1 wins.\n\n[Plot Summary]\nBeats of @Video1, hard cuts every 1.5 s, part motion continuous across the cut ic", "old_id": "46", "inputs_expanded": ["BO_PRODUCT", "PR_SNEAKER_1", "PR_SNEAKER_2", "PR_SNEAKER_3", "LO_STUDIO"]}, {"id": "31", "tier": "Анимация", "direction": "Анимация · реальный кейс", "contrast": "Ермек", "task_mode": "R2V", "aspect_ratio": "21:9", "duration": "15s", "title_ru": "Стоп-моушен: отец отбивает метлу у гигантского монстра", "summary_ru": "Пятнадцать секунд кукольной анимации в разгромленной тёмной гостиной: отец толкает монстра метлой, тот перехватывает и разворачивает её, отец пятится, давит бумажное ведро-тыкву и один раз бьёт монстра щёткой в морду, прикрывая сына в костюме привидения. Сложно: монстр стабильно в 1,7 раза выше отца во всех планах, точные хваты на твёрдой метле, склейки по таймкодам и ступенчатое стоп-моушен-движение. Промпт дословный; в исходном документе он обрывается посреди седьмого плана («the broom clears the»), восьмого плана в тексте нет.", "checks": [{"name_ru": "Масштаб 1,7×", "detail_ru": "Монстр выпрямившись примерно в 1,7 раза выше отца, голова почти у потолка, макушка отца на уровне нижних рёбер монстра; даже согнувшись, голова монстра минимум на полметра выше головы отца. Рука монстра примерно вдвое длиннее руки отца. Разница в росте одинакова во всех планах, монстр увеличен целиком, а не вытянуты ноги или шея."}, {"name_ru": "Ровно два ведра, одно раздавлено", "detail_ru": "В комнате ровно два оранжевых бумажных ведра-тыквы по @prop_vedro_v1. Первое стоит неподвижно сразу за пятками отца и не сдвигается до контакта; в 5-м плане (около 8,85 с) правый ботинок отца, шагнувший назад, давит его за один шаг: стенка сминается и складывается вокруг ботинка, дальше оно остаётся раздавленным. Второе всё время цело на своём месте дальше позади."}, {"name_ru": "Метла жёсткая, длина постоянна", "detail_ru": "Одна метла по @prop_metla: деревянная ручка со скруглённым концом, двойная красная обмотка, пучок соломы. Не гнётся, не удлиняется и не укорачивается при перехватах, не раздваивается, руки видимо касаются ручки."}, {"name_ru": "Хваты по планам", "detail_ru": "1-й план: обе руки отца на ручке, правая сразу за обмоткой, левая у бедра. 2-й: пальцы монстра по одному смыкаются на пучке у обмотки. 3-й: монстр левой рукой держит обмотку, поднимает щётку вертикально, разворачивает метлу и правой хватает скруглённый конец ручки; дальше монстр держит оба внешних конца, отец обеими руками середину. Хотя бы одна рука отца всё время на метле."}, {"name_ru": "Один удар", "detail_ru": "7-й план, около 11,9 с: после короткого приседа отец рывком вперёд-вверх вырывает метлу из когтей и один раз бьёт пучком в морду монстра. Левая рука монстра раскрывается во время рывка, правая отпускает при ударе. Второго удара нет."}, {"name_ru": "Склейки по таймкодам", "detail_ru": "Жёсткие склейки на 1,5 / 2,75 / 5,25 / 8,0 / 10,0 / 11,25 / 12,5 с, каждый план со статичной камерой и своей крупностью (за плечом монстра, инсерт щётки, низкий бок, верхний ракурс, ботинки у пола, лицо отца, монстр с позиции отца). Монстр всегда на стороне дивана, отец к нему лицом и спиной к сыну, сын близко позади и не попадает под метлу."}, {"name_ru": "Ступенчатый стоп-моушен", "detail_ru": "Кукольная анимация со ступенчатым, но гибким движением: антиципация, разгон, нагруженный контакт и отдача; монстр тяжёлый и чуть запаздывает. Не плавная 3D-интерполяция и не ускоренное движение."}, {"name_ru": "Свет и комната по рефам", "detail_ru": "Тёмная холодная приглушённая картинка по @ref_horror_atmosphere_01: свет из окна, глубокие тени, тёплые акценты только от свечей и тыкв, электрические лампы выключены. Упавшие шторы и карниз, перевёрнутый стол, сдвинутый диван, ковёр и игрушки на своих местах по @ref_sh600_action_05; рефы не появляются вставками или титрами."}, {"name_ru": "Финал: отшатывание и защита сына", "detail_ru": "После удара монстр отшатывается к дивану, отец прикрывает сына рукой, метла у отца целиком; второе ведро цело, первое лежит раздавленным."}], "inputs": ["YM_ref_sh600_action_05", "YM_char_monster_v12", "YM_father", "YM_son", "YM_prop_metla", "YM_prop_vedro_v1", "YM_ref_horror_atmosphere_01", "YM_blockout_1", "YM_blockout_2"], "reference_mapping": "@ref_sh600_action_05 = YM_ref_sh600_action_05 (Drive '3.png', 3642x1554: Room geography / post-crash environment: rendered stop-motion frame, high angle from behind the black monster; father (plaid shirt, apron) holds the broom level with both hands, son in ghost costume behind him at right, orange jack-o'-lantern paper bucket on the floor behind the father, grey rug, scattered toy blocks at left, jack-o'-lantern on the wall, warm glow at right. Matches the SHOT 4 description.); @char_monster_v12 = YM_char_monster_v12 (Drive '4.webp', 1536x2048: Monster identity: pencil/ink drawing on grey paper of a hunched black creature, round black head with one empty eye socket and a wide grin of white teeth, long thin limbs, long bony fingers with curved claws, hair strands hanging from the head; note it wears an apron-like garment with a pocket and a torn hem (not mentioned in the prompt).); @father = YM_father (Drive '5.png', 1889x1888: Father identity sheet, front + back full body on white: black messy hair, thick moustache and goatee, red-and-cream plaid shirt with rolled sleeves, dark paint-spattered apron, brown corduroy trousers, tan suede boots; puppet/stop-motion look.); @son = YM_son (Drive '6.png', 3053x2732: Son identity sheet, front + back full body: small boy with black hair in a white felt ghost costume (pointed hood, two black eye dots, zigzag hem), black shirt and jeans, white sneakers.); @prop_metla = YM_prop_metla (Drive '7.webp', 1536x2048: Broom: worn wooden handle with a rounded end, red double binding, straw bristle bundle; product shot on blue-grey.); @prop_vedro_v1 = YM_prop_vedro_v1 (Drive '8.webp', 1536x2048: Paper jack-o'-lantern bucket: orange, black drawn face, tape patches, paper/card strap handle fixed with grommets (the prompt says 'thin wire handles').); @ref_horror_atmosphere_01 = YM_ref_horror_atmosphere_0 ather](ceb373fb-2b32-4955-b2f5-e7379d1e55fd) — father identity, proportions, clothing and materials: black messy hair, thick mustache and goatee, red-and-cream plaid shirt with rolled sleeves, dark apron, brown corduroy trousers, tan suede boots.\r\n@[son](02f8f8aa-17d4-4f7d-bd44-06e04209e743) — son identity and white ghost costume.\r\n@[prop_metla](45983ebf-c0cc-468c-b96d-159fbeff81be) — one rigid broom: wooden handle with a rounded end, double red binding, straw bristle bundle.\r\n@[prop_vedro_v1](4db33a65-49dc-434a-a0e4-81a6184b5f24) — exactly two existing orange paper jack-o'-lantern buckets with black drawn faces, tape patches and thin wire handles.\r\nAll references define identity, materials and environment only. Every camera, framing and action comes from the shot blocks below. Reference images never appear as overlays, inserts or titles.\r\nMONSTER SCALE\r\nThe monster is a giant next to the father. Standing upright it is about 1.7 times the father's height, its head almost touching the ceiling. Upright, the father's head reaches only the monster's lower ribs. Throughout the struggle the monster leans forward over the father, and even bent, its head stays at least half a meter above the father's head. Its arms are much longer than the father's, its grip span on the broom is about twice his, and its hand is about twice the length of the father's hand. Scale the whole monster up evenly, keeping the proportions of its reference; do not stretch only the legs or neck. The father always looks up at the monster's face. The size difference stays identical in every shot.\r\nLIGHTING\r\n@[ref_horror_atmosphere_01](6911ed08-e455-40a0-a15e-6938159225da) is authoritative for lighting, exposure, colour, contrast and atmosphere throughout. Preserve its dark, cool, subdued look, muted window light and deep shadows. Small warm accents come only from existing candles and jack-o'-lanterns. Electrical lights remain off.\r\nTransfer atmosphere without copying this reference's camera, composition, objects or character positions. Other references do not override its lighting.\r\nSPATIAL CONTINUITY\r\nOne continuous struggle in one room, shown through eight steady cameras with hard cuts on action at the exact times below. The monster always stands on the sofa side of the room, the father faces it with his back toward the son. Preserve body positions, grip states, broom orientation, gaze direction, momentum and the monster's towering height and forward lean across cuts.\r\nThe fallen curtains and rod, overturned table, displaced sofa, rug and scattered toys retain their world positions.\r\nOne intact bucket stands on the floor immediately behind the father, in his backward path. It stays stationary until his boot crushes it in SHOT 5, then remains crushed. The second bucket stays intact farther back in its established position. The son stays close behind the father, clear of the broom.\r\nANIMATION\r\nHandmade puppet stop-motion with supple, stepped movement. Force travels from planted feet through hips, torso, shoulders and arms. Use brief anticipation, acceleration, loaded contact and recoil. The monster moves with the heavy, slightly delayed inertia of a large body: long reach, slow powerful weight shifts, slower recoveries. Keep the broom rigid and constant in length, with visible hand contact and natural inertia. Fit the action into 15 seconds by shortening pauses, not by speeding up movement.\r\nSHOT 1 — 0.0–1.5 s — THE PUSH\r\nCamera: over-the-shoulder from behind the monster's right side, camera at the father's chest height, 1.5 m behind the monster, 47° diagonal field of view, static. The monster's dark, out-of-focus side fills the left third of the frame (x 0–30%) and rises out of the top edge. The father stands at x 70%, seen from the waist up, facing screen-left toward the monster. A dark wall with a framed picture sits behind him in soft focus.\r\nThe first frame already shows the father pushing: both hands on the handle, right h reet in the same 3D feature-animation style.\nA 20-second comedy chase in exactly the stylized 3D feature-animation look of @Image1–@Image3 — the same shapes, materials, soft subsurface skin and painterly summer light — eight shots across the yards and street of @Image3. Ruth rides a red ride-on lawn mower with a plastic cup of iced tea and a straw in its cup holder. The sheriff drives an old boxy white sedan with plain doors, no lettering and a red-and-blue light bar on the roof. Screen direction stays constant: Ruth flees left to right; the sedan chases behind her, then cuts ahead to block her in Shot 4.\n\n[Plot Summary]\nShot 1, 00:00-00:02.5: Camera low on the grass, ultra-wide lens, a tall hedge filling the right two thirds of frame. The mower bursts through the hedge toward the lens, branches splitting, leaves tumbling past, Ruth upright and calm, her glasses swinging on their cord; she roars past the right edge of frame, moving left to right.\nShot 2, 00:02.5-00:05: Camera mounted on the mower's hood looking back at her. Her hands grip the wheel at ten and two. She glances sideways over her reading glasses and a slow sly grin creeps across her face. Behind her the white sedan swings around the corner, light bar flashing.\nShot 3, 00:05-00:07.5: Wide side view, the camera dollies right at the mower's speed, mower in the left third. She cuts through a backyard barbecue: the mower clips a kettle grill, the grill tips and a handful of hot dogs spring into the air in a lazy arc and drop onto the grass.\nShot 4, 00:07.5-00:10: Inside the sedan, camera on the dashboard facing the sheriff. Cutting across the neighbouring lawn, he overtakes her, slams the brakes and the car skids sideways to a stop broadside across the lawn to block her. He looks out of his side window and his round face drops into pure horror.\nShot 5, 00:10-00:11.5: Wide low angle from behind the mower, the stopped sedan in the right half of frame, a child's yellow plastic slide standing right in front of it like a ramp. The mower drives straight up the slide chute, front wheels lifting, and launches off the top.\nShot 6, 00:11.5-00:15: Slow motion. Camera low on the grass beyond the sedan, looking up. The mower sails in a high clean arc left to right over the sedan roof, its wheels passing above the flashing light bar, cardigan and silver hair fluttering, the glasses floating on their cord, the iced tea cup still in its holder. Through the window below, the sheriff's head turns slowly to follow her.\nShot 7, 00:15-00:17: Normal speed, wide. The mower lands hard on all four wheels on the far lawn with one bounce and rolls to a stop, Ruth in the left third.\nShot 8, 00:17-00:20: Medium on Ruth, the sedan soft in the background on frame-left, where the sheriff climbs out, adjusting his hat. Unbothered, she lifts the same iced tea from the cup holder and takes one long sip through the straw; the ice clinks. Hold on her deadpan face.\n\n[Audio Style]\nDiegetic only, no music, no dialogue: mower engine roar, hedge branches crunching, siren whoops, a metal grill clang and sizzle, soft thuds of hot dogs on grass, tyre squeal and skid, a hollow plastic rumble on the slide, a muffled slow-motion whoosh, a heavy landing thump exactly on touchdown, a car door, then near silence with cicadas, ice clinking and a long straw slurp.\n\n[Camera Work and Core Constraints]\nPhysical, motivated camera moves: dolly, hood mount, locked-off low angles; asymmetric compositions with lawn and sky as negative space. Ruth stays on-model with @Image1 and the sheriff with @Image2 in every shot; the yards and street match @Image3. Only Shot 6 is slow motion; normal speed returns on the landing. The iced tea cup stays in its holder until she lifts it in Shot 8. Comedy timing: crisp cuts on each beat, one stretched slow-motion jump, a quiet deadpan button. The whole film stays in the one stylized 3D look of the references.\n\n[Negative Prompt]\nsubtitles, watermark, logos, text on the car, m  en:{dl:"Download xlsx", arch:"Archive v1", th:["","#","Direction","Mode","Format","Dur.","Scene and what we test","Inputs","Run"], pcs:" files", cmpTitle:"Model comparison", cmpWait:"Comparison not built yet.", prompt:"Prompt", copy:"Copy", copied:"Copied", checks:"What we check", inputs:"Inputs", download:"download", take:"Take", part:"Part", sound:"Sound", nosound:"No sound", gen:"s gen.", seg:{s1:"Seg. 1",s2:"Seg. 2",s3:"Seg. 3",s4:"Seg. 4",A:"Edit A",B:"Edit B",C:"Edit C"}},
 ru:{dl:"Скачать xlsx", arch:"Архив v1", th:["","№","Направление","Режим","Формат","Длит.","Сцена и что проверяем","Инпуты","Прогон"], pcs:" шт.", cmpTitle:"Сравнение моделей", cmpWait:"Сравнение ещё собирается.", prompt:"Промпт", copy:"Копировать", copied:"Скопировано", checks:"Что проверяем", inputs:"Инпуты", download:"скачать", take:"Дубль", part:"Часть", sound:"Звук", nosound:"Без звука", gen:"с ген.", seg:{s1:"Сегм. 1",s2:"Сегм. 2",s3:"Сегм. 3",s4:"Сегм. 4",A:"Правка A",B:"Правка B",C:"Правка C"}}};
const T = k => TX[LANG][k];
const RU2EN = {"Кино":"Cinema","UGC":"UGC","Реклама":"Ads","Хайпер-моушн":"Hyper-motion","Genjutsu (V2V)":"Genjutsu (V2V)","Превиз (Blender-блокинг)":"Previs (Blender blocking)","Анимация":"Animation","Физика":"Physics","Звук и музыка":"Sound & music","Консистентность":"Consistency","Вирусный эффект":"Viral effect","Камера":"Camera","Текст":"Text","Кино · экшен":"Cinema · action","Кино · диалог":"Cinema · dialogue","реальный кейс":"real case","Остальное":"Other","физика":"physics","звук и музыка":"sound & music","консистентность":"consistency","вирусный эффект":"viral effect","камера":"camera","текст":"text","кино — экшен":"cinema — action","кино — диалог":"cinema — dialogue","стоп-моушен":"stop-motion"};
const enLabel = s => { if (LANG!=="en" || !s) return s; if (RU2EN[s]) return RU2EN[s]; return s.split(/( · |: )/).map(p=>RU2EN[p]||p).join(""); };
const F = (i,k) => LANG==="ru" ? (i[k+"_ru"] ?? i[k+"_en"] ?? "") : (i[k+"_en"] ?? i[k+"_ru"] ?? "");
const PR = i => LANG==="ru" ? (i.prompt_ru || i.prompt) : i.prompt;
const CK = c => LANG==="ru" ? [c.name_ru ?? c.name_en, c.detail_ru ?? c.detail_en] : [c.name_en ?? c.name_ru, c.detail_en ?? c.detail_ru];
function chrome(){
  document.documentElement.lang = LANG;
  document.getElementById("th").innerHTML = "<tr>"+T("th").map(h=>`<th>${esc(h)}</th>`).join("")+"</tr>";
  document.getElementById("dl").textContent = T("dl");
  const a = document.getElementById("arch"); if (a){ a.textContent = T("arch"); }
  document.querySelectorAll(".lng button").forEach(b=>{ b.classList.toggle("on", b.dataset.l===LANG); b.onclick=()=>{ LANG=b.dataset.l; try{localStorage.setItem("vmst-lang",LANG);}catch(e){} chrome(); render(); }; });
}
const NC = 9;
const st = {};   // per item: {take, seg, snd}
function card(id){
  const m = inputs[id];
  if (!m) return `<div class="in"><div><span>${esc(id)}</span></div></div>`;
  const media = m.kind==="image" ? `<a href="${esc(m.file)}" target="_blank"><img src="${esc(m.thumb||m.file)}" loading="lazy" alt="${esc(id)}"></a>`
    : m.kind==="video" ? `<video src="${esc(m.file)}" poster="${esc(m.thumb||"")}" controls preload="none" playsinline></video>`
    : `<audio src="${esc(m.file)}" controls preload="none"></audio>`;
  return `<div class="in">${media}<div><span>${esc(id)}</span><a href="${esc(m.file)}" download>${T("download")}</a></div></div>`;
}
const R = id => results[id] || {};
function takesOf(id){ const t=new Set(); for (const m of Object.values(R(id))) Object.keys(m).forEach(k=>t.add(k)); return [...t].sort(); }
function segsOf(id){ const s=new Set(); for (const m of Object.values(R(id))) for (const t of Object.values(m)) Object.keys(t).forEach(k=>s.add(k)); return [...s].sort(); }
function doneCount(id){ let n=0; for (const [mk] of models){ const r=R(id)[mk]?.["1"]; if (r && Object.values(r).some(x=>x.status==="done")) n++; } return n; }
const SEGNAME = new Proxy({}, {get:(o,k)=>T("seg")[k]});
function cmpKeys(id){ return Object.keys(DATA.compare||{}).filter(k=>k.split("|")[0]===id); }
function cmpHTML(i){
  const id=i.id, keys=cmpKeys(id);
  if (!keys.length) return `<div class="cmp"><div style="color:var(--ink-3);font-size:13px;padding:8px">${T("cmpWait")}</div></div>`;
  const takes=[...new Set(keys.map(k=>k.split("|")[2]))].sort(), segs=[...new Set(keys.map(k=>k.split("|")[1]))].sort();
  const s = st[id] ||= {take: takes[0], seg: segs[0], snd: models[0][0]};
  if (!keys.includes([id,s.seg,s.take].join("|"))) { s.take = takes[0]; s.seg = segs[0]; }
  const c = DATA.compare[[id,s.seg,s.take].join("|")] || {};
  if (s.snd!=="none" && !(c.audio||{})[s.snd]) s.snd = Object.keys(c.audio||{})[0] || "none";
  const pill = (k,v,cur,label,dis) => `<button class="pill ${cur===v?"on":""}" data-k="${k}" data-v="${esc(v)}" ${dis?"disabled style=\"opacity:.35\"":""}>${esc(label)}</button>`;
  const meta = models.map(([mk,n])=>{ const r=R(id)[mk]?.[s.take]?.[s.seg]; if(!r) return ""; 
    const m = r.status==="done" ? `${esc(r.res)} · ${esc(r.cost)} cr · ${r.sec?Math.round(r.sec)+T("gen"):""}${r.flags&&r.flags.length?" · "+esc(r.flags.join(", ")):""}` : esc(r.status+(r.reason?": "+r.reason:""));
    return `<div><b>${esc(n)}</b> <span>${m}</span></div>`; }).join("");
  return `<div class="cmp" data-id="${id}">
    <div class="cbar">
      <button class="play">▶ Play</button>
      <input type="range" class="sk" min="0" max="1000" value="0"><span class="tm">0.0 / ${(c.dur||0).toFixed(1)}</span>
      ${takes.length>1?`<div class="g"><span class="lb">${T("take")}</span>${takes.map(t=>pill("take",t,s.take,t)).join("")}</div>`:""}
      ${segs.length>1?`<div class="g"><span class="lb">${T("part")}</span>${segs.map(g=>pill("seg",g,s.seg,SEGNAME[g]||g)).join("")}</div>`:""}
      <div class="g"><span class="lb">${T("sound")}</span>${models.map(([mk,n])=>pill("snd",mk,s.snd,n,!(c.audio||{})[mk])).join("")}${pill("snd","none",s.snd,T("nosound"))}</div>
    </div>
    <video class="gv" src="cmp/${esc(c.video)}" preload="auto" playsinline muted style="width:100%;display:block;border-radius:6px;background:#000"></video>
    <audio class="ga" preload="auto" ${s.snd!=="none"&&c.audio[s.snd]?`src="cmp/${esc(c.audio[s.snd])}"`:""}></audio>
    <div class="cmeta">${meta}</div></div>`;
}
function wire(box){
  const id = box.dataset.id; if (!id || !box.querySelector("video")) return;
  const s = st[id], v = box.querySelector("video.gv"), a = box.querySelector("audio.ga");
  const btn = box.querySelector(".play"), sk = box.querySelector(".sk"), tm = box.querySelector(".tm");
  let timer = null;
  const hasA = () => !!a.getAttribute("src");
  const sync = () => { if (hasA() && Math.abs(a.currentTime - v.currentTime) > 0.08) a.currentTime = v.currentTime; };
  const tick = () => { const D=v.duration||0; if (D){ sk.value=Math.round(v.currentTime/D*1000); tm.textContent=`${v.currentTime.toFixed(1)} / ${D.toFixed(1)}`; }
    if (!v.paused) sync(); if (v.ended) stop(); };
  const stop = () => { v.pause(); a.pause(); btn.textContent="▶ Play"; };
  const play = () => { if (v.ended) v.currentTime = 0; sync(); v.play().catch(()=>{}); if (hasA()) a.play().catch(()=>{}); btn.textContent="❚❚ Pause"; };
  btn.onclick = () => v.paused ? play() : stop();
  v.onclick = btn.onclick;
  v.onwaiting = () => a.pause(); v.onplaying = () => { if (hasA()) { sync(); a.play().catch(()=>{}); } };
  timer = setInterval(tick, 150);
  sk.oninput = () => { v.currentTime = sk.value/1000*(v.duration||0); sync(); };
  box.querySelectorAll(".pill").forEach(p => p.onclick = e => {
    e.stopPropagation(); if (p.disabled) return; const k=p.dataset.k, val=p.dataset.v;
    if (k==="snd"){ s.snd=val; const c=DATA.compare[[id,s.seg,s.take].join("|")];
      if (val==="none"||!c.audio[val]){ a.pause(); a.removeAttribute("src"); a.load(); }
      else { a.src = "cmp/"+c.audio[val]; a.currentTime = v.currentTime; if (!v.paused) a.play().catch(()=>{}); }
      box.querySelectorAll('.pill[data-k="snd"]').forEach(x=>x.classList.toggle("on", x.dataset.v===val)); return; }
    stop(); clearInterval(timer); s[k]=val; const nb=document.createElement("div"); nb.innerHTML=cmpHTML(items.find(x=>x.id===id)); const nbox=nb.firstElementChild; box.replaceWith(nbox); wire(nbox);
  });
}
function detailHTML(i){
  const ins = i.inputs_expanded || [];
  const ck = (i.checks||[]).map(c=>{const [a,b]=CK(c); return `<tr><td>${esc(a)}</td><td>${esc(b)}</td></tr>`;}).join("");
  return `<tr class="xr" data-for="${i.id}"><td colspan="${NC}">
    <h4 style="margin:12px 0 6px;font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.04em">${T("cmpTitle")}</h4>
    ${cmpHTML(i)}
    <div class="xd">
      <div><h4>${T("prompt")} <button class="cp" data-c="${i.id}">${T("copy")}</button></h4><pre>${esc(PR(i))}</pre></div>
      <div><h4>${T("checks")}</h4><table class="ck">${ck}</table>
      ${ins.length?`<h4>${T("inputs")}</h4><div class="ins">${ins.map(card).join("")}</div>`:""}</div>
    </div></td></tr>`;
}
function render(){
  let html = "", tier = null;
  for (const i of items){
    if (i.tier !== tier){ tier = i.tier; html += `<tr class="sect"><td colspan="${NC}">${esc(enLabel(i.tier))}</td></tr>`; }
    const ins = i.inputs_expanded || [], dc = doneCount(i.id);
    html += `<tr class="r" data-id="${i.id}">
      <td><span class="ar">▸</span></td><td class="n">${esc(i.id)}</td><td>${esc(enLabel(i.direction))}</td>
      <td class="m">${esc(i.task_mode)}</td><td class="f">${esc(i.aspect_ratio)}</td><td class="d">${esc(i.duration)}</td>
      <td class="t"><b>${esc(F(i,"title"))}</b><br>${esc(F(i,"summary"))}</td><td class="i">${ins.length?ins.length+T("pcs"):"—"}</td>
      <td class="rs">${dc}/${models.length}</td></tr>`;
  }
  const tb = document.getElementById("tb"); tb.innerHTML = html;
  tb.querySelectorAll("tr.r").forEach(r => r.onclick = () => {
    const id = r.dataset.id, ex = tb.querySelector(`tr.xr[data-for="${id}"]`);
    if (ex){ ex.querySelectorAll("video,audio").forEach(v=>v.pause()); ex.remove(); r.classList.remove("o"); return; }
    r.classList.add("o"); r.insertAdjacentHTML("afterend", detailHTML(items.find(x=>x.id===id)));
    const d = r.nextElementSibling; d.querySelectorAll(".cmp").forEach(wire);
    d.querySelectorAll(".cp").forEach(b => b.onclick = e => { e.stopPropagation();
      navigator.clipboard.writeText(PR(items.find(x=>x.id===b.dataset.c))).then(()=>{b.textContent=T("copied");setTimeout(()=>b.textContent=T("copy"),1200);}); });
  });
}
chrome(); render();
</script>
